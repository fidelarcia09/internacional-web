<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b18">
<meta name="description" content="Verifica tu identidad con tu app de códigos.">
<title>Verificación en dos pasos — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b18;--orange:#28e4ff;--gold:#32b7ff;--white:#f5f5f5;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;padding:22px 15px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 12%,#00c6ff18,transparent 48%),var(--bg);color:var(--white);font-family:var(--font)}
.card{width:min(100%,440px);padding:clamp(24px,5vw,36px);border:1px solid #28e4ffa8;border-radius:25px;background:linear-gradient(150deg,#14100df5,#090a0df5);box-shadow:0 0 30px #28e4ff2b,inset 0 0 25px #28e4ff0b}
.icon{width:58px;height:58px;margin:0 auto 15px;display:grid;place-items:center;border:1px solid #2bc5ff8c;border-radius:18px;background:#2bc5ff12;color:var(--gold)}
.icon svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kicker{text-align:center;color:var(--orange);font-size:9px;font-weight:900;letter-spacing:2px;margin:0 0 8px}
h1{margin:0;text-align:center;font:900 clamp(38px,9vw,48px)/.95 var(--display)}
.description{margin:13px 0 24px;text-align:center;color:#b8bac2;font-size:12px;line-height:1.6}
label{display:block;margin:0 0 9px;color:#e8e8eb;font-size:11px;font-weight:700}
#code{width:100%;height:60px;border:1px solid #28e4ffa8;border-radius:14px;outline:none;background:#050b18;color:#fff;text-align:center;font:900 27px var(--font);letter-spacing:12px;padding-left:12px}
#code:focus{border-color:#32b7ff;box-shadow:0 0 0 3px #2bc5ff22}
#code::placeholder{color:#777;letter-spacing:8px}
.submit{width:100%;min-height:54px;margin-top:17px;border:1px solid #5cc4ff;border-radius:14px;background:linear-gradient(100deg,#2eacff,#21d7ff 55%,#25bdff);color:#081a35;font:900 13px var(--font);cursor:pointer}
.submit:disabled{opacity:.6;cursor:wait}
.message{display:none;margin:14px 0 0;padding:11px 12px;border:1px solid #2bc5ff70;border-radius:11px;background:#2cd5ff12;color:#9de3ff;font-size:11px;line-height:1.5;text-align:center}
.message.show{display:block}.message.error{border-color:#ff5d5d88;background:#ff5d5d12;color:#ffb5b5}
.help{text-align:center;margin:15px 0 0;color:#93959d;font-size:10px;line-height:1.55}
.actions{display:flex;justify-content:center;gap:16px;margin-top:18px}
.actions button{border:0;background:transparent;color:#5accff;font:700 11px var(--font);cursor:pointer}
</style>
</head>
<body>
<main class="card">
<div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 20 6v5.5c0 4.7-3.3 7.8-8 9.5-4.7-1.7-8-4.8-8-9.5V6l8-3Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg></div>
<p class="kicker">PROTECCIÓN DE CUENTA</p>
<h1>VERIFICACIÓN EN DOS PASOS</h1>
<p class="description">Abre tu <strong>App de códigos</strong> (por ejemplo, Google Authenticator) e introduce el código temporal de 6 dígitos para continuar.</p>
<form id="verifyForm" novalidate>
<label for="code">Código de tu aplicación</label>
<input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
<button class="submit" id="verifyButton" type="submit">VERIFICAR Y CONTINUAR</button>
<div class="message" id="message" role="status" aria-live="polite"></div>
</form>
<p class="help">El código cambia automáticamente cada pocos segundos. Si no funciona, espera a que aparezca uno nuevo en tu aplicación.</p>
<div class="actions"><button type="button" id="backButton">Volver al inicio de sesión</button></div>
</main>
<script type="module">
import { supabase, SITE_URL } from "./supabase-client.js";
const form=document.getElementById("verifyForm");
const codeInput=document.getElementById("code");
const button=document.getElementById("verifyButton");
const message=document.getElementById("message");
function showMessage(text,isError=false){message.textContent=text;message.classList.toggle("error",isError);message.classList.add("show")}
function getDestination(){
  const target=sessionStorage.getItem("mfa_return_to")||"index.html";
  sessionStorage.removeItem("mfa_return_to");
  if(target.startsWith("/")||target.startsWith("//")||target.includes("://")) return SITE_URL+"index.html";
  return SITE_URL+target;
}
async function initialize(){
  const {data:sessionData}=await supabase.auth.getSession();
  if(!sessionData?.session){window.location.replace(SITE_URL+"login.html");return}
  const {data:assurance,error:assuranceError}=await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
  if(assuranceError){showMessage("No pudimos comprobar tu sesión. Recarga la página e inténtalo otra vez.",true);return}
  if(assurance?.currentLevel==="aal2"){window.location.replace(getDestination());return}
  const {data:factors,error}=await supabase.auth.mfa.listFactors();
  if(error){showMessage("No pudimos consultar tu app de códigos. Inténtalo de nuevo.",true);return}
  const factor=(factors?.totp||[]).find(item=>item.status==="verified");
  if(!factor){showMessage("Esta cuenta no tiene una App de códigos activada. Inicia sesión y configúrala desde Seguridad.",true);button.disabled=true;return}
  form.dataset.factorId=factor.id;
  codeInput.focus();
}
form.addEventListener("submit",async event=>{
  event.preventDefault();
  const code=codeInput.value.replace(/\D/g,"");
  const factorId=form.dataset.factorId;
  if(!factorId){showMessage("No se encontró una app de códigos verificada para esta cuenta.",true);return}
  if(!/^\d{6}$/.test(code)){showMessage("Introduce los 6 dígitos que aparecen en tu aplicación.",true);return}
  button.disabled=true;button.textContent="COMPROBANDO CÓDIGO...";message.classList.remove("show","error");
  try{
    const {data:challenge,error:challengeError}=await supabase.auth.mfa.challenge({factorId});
    if(challengeError) throw challengeError;
    const {error:verifyError}=await supabase.auth.mfa.verify({factorId,challengeId:challenge.id,code});
    if(verifyError) throw verifyError;
    const {data:verified}=await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
    if(verified?.currentLevel!=="aal2") throw new Error("La sesión todavía no está verificada en dos pasos.");
    button.textContent="VERIFICADO";
    window.location.replace(getDestination());
  }catch(error){
    showMessage("El código es incorrecto o ha caducado. Comprueba tu aplicación e inténtalo otra vez.",true);
    button.disabled=false;button.textContent="VERIFICAR Y CONTINUAR";codeInput.value="";codeInput.focus();
  }
});
document.getElementById("backButton").addEventListener("click",async()=>{
  await supabase.auth.signOut();
  sessionStorage.removeItem("mfa_return_to");
  window.location.replace(SITE_URL+"login.html");
});
initialize();
</script>
</body>
</html>
