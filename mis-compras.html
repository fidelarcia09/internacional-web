<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="Historial de compras de Internacional Web.">
<title>Mis compras — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0d;--orange:#ff7900;--white:#f5f4f1;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#ff790012,transparent 42%),var(--bg);color:var(--white);font-family:var(--font);padding-bottom:80px}
a{color:inherit;text-decoration:none}
main{width:min(92%,760px);margin:25px auto 38px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:25px}
.heading{min-width:0}
.page-kicker{color:var(--orange);font-size:9px;font-weight:800;letter-spacing:2px;margin:0 0 7px}
h1{font:900 clamp(39px,8vw,54px)/.92 var(--display);letter-spacing:.4px;margin:0}
.tabs{display:flex;align-items:center;gap:5px;padding:4px;border:1px solid #ffffff18;border-radius:13px;background:#111318;flex-shrink:0}
.tab{appearance:none;border:0;background:transparent;color:#8d9099;font:700 11px var(--font);padding:10px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .18s,color .18s,box-shadow .18s}
.tab.active{color:#fff;background:linear-gradient(105deg,#9b4808,#d96a08 58%,#ff8a18);box-shadow:0 0 14px #ff79002b}
.content-panel{min-height:320px;border:0;border-radius:0;background:transparent;box-shadow:none;display:grid;place-items:center;padding:18px 0;text-align:center}\n.history-list{width:100%;display:flex;flex-direction:column;gap:22px;text-align:left}\n.day-group{display:flex;flex-direction:column;gap:11px}\n.day-label{margin:0;color:#f5f4f1;font-size:13px;font-weight:800;letter-spacing:.2px}\n.transaction-card{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;border:1px solid #ff790078;border-radius:16px;background:linear-gradient(105deg,#17110c,#0d0e11 65%);box-shadow:inset 0 0 16px #ff79000b}\n.transaction-info{min-width:0;display:flex;flex-direction:column;gap:5px}\n.transaction-name{margin:0;font-size:12px;font-weight:800;color:#f5f4f1}\n.transaction-detail{margin:0;font-size:10px;line-height:1.5;color:#92959e}\n.transaction-amount{flex-shrink:0;font-size:13px;font-weight:800;color:#ff922e;white-space:nowrap}

.history-list{width:100%;display:flex;flex-direction:column;gap:18px;text-align:left}
.history-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid #ff790078;border-radius:15px;background:linear-gradient(105deg,#17110c,#0d0e11 65%)}
.history-main{min-width:0;display:flex;flex-direction:column;gap:5px}
.history-title{font-size:12px;font-weight:800;overflow-wrap:anywhere}
.history-meta{font-size:9px;color:#92959e;line-height:1.6;overflow-wrap:anywhere}
.history-right{flex-shrink:0;text-align:right}
.history-amount{font-size:13px;font-weight:800;color:#ff922e;white-space:nowrap}
.history-status{display:inline-block;margin-top:6px;padding:4px 7px;border:1px solid #ffffff20;border-radius:20px;color:#c5c6ca;font-size:8px;font-weight:800}
.history-status.completed,.history-status.confirmed{color:#69dba0;border-color:#277b50;background:#0c2118}
.history-status.failed,.history-status.rejected{color:#ff8585;border-color:#873b3b;background:#241010}
.history-status.pending{color:#ffc078;border-color:#77501e;background:#21180d}
.history-error{font-size:11px;color:#ff9c80;line-height:1.7}
.empty-state{max-width:340px;text-align:center}
.empty-icon{width:72px;height:72px;margin:0 auto 18px;border:1px solid #ff79005c;border-radius:22px;background:radial-gradient(circle,#ff790020,#111114 72%);display:grid;place-items:center;color:#ff922e;box-shadow:0 0 24px #ff790012}
.empty-icon svg{width:35px;height:35px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty-state h2{font-size:17px;margin:0 0 8px;font-weight:800}
.empty-state p{font-size:11px;line-height:1.7;color:#92959e;margin:0}
.content-panel[hidden]{display:none}
.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:65px;background:#101217f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;height:60px;color:#777}
.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav small{font-size:8px;letter-spacing:.2px}
.mobile-nav a.current{color:var(--orange)}
.mobile-nav a.current:before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:66px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#ff700059 0%,#ff700026 42%,transparent 75%);filter:blur(5px)}
.mobile-nav a.current svg{filter:drop-shadow(0 0 4px #ff7d00) drop-shadow(0 0 9px #ff690073)}
.mobile-nav a.current small{text-shadow:0 0 8px #ff780059}
@media(max-width:520px){main{width:90%;margin:20px auto 28px}.page-head{align-items:flex-start;gap:9px;margin-bottom:20px}h1{font-size:clamp(34px,9vw,44px)}.page-kicker{font-size:8px}.tabs{gap:2px;padding:3px;border-radius:11px;margin-top:15px}.tab{font-size:9px;padding:9px 9px}.content-panel{min-height:285px;padding:20px 0;border-radius:0}.transaction-card{padding:13px 12px;border-radius:14px}.history-list{gap:19px}.empty-icon{width:65px;height:65px}}
@media(max-width:370px){.page-head{flex-wrap:wrap}.tabs{margin-top:0;margin-left:auto}.page-head{align-items:center}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header class="page-head">
<div class="heading"><p class="page-kicker">TU ACTIVIDAD</p><h1>MIS COMPRAS</h1></div>
<div class="tabs" role="tablist" aria-label="Tipo de compras">
<button class="tab active" id="games-tab" type="button" role="tab" aria-selected="true" aria-controls="games-panel">Juegos</button>
<button class="tab" id="deposits-tab" type="button" role="tab" aria-selected="false" aria-controls="deposits-panel">Depósitos</button>
</div>
</header>
<section class="content-panel" id="games-panel" role="tabpanel" aria-labelledby="games-tab">
<div class="empty-state">
<div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M11 11h14a6 6 0 0 1 5.7 4.2l2 7.1a3.5 3.5 0 0 1-5.7 3.6l-3.4-2.8H12.4L9 29a3.5 3.5 0 0 1-5.7-3.6l2-10.2A5 5 0 0 1 11 11Z"/><path d="M11 17v7m-3.5-3.5h7m9-1h.1m4 4h.1"/></svg></div>
<h2>Sin recargas todavía</h2>
<p>Aquí aparecerán tus compras y recargas de juegos cuando realices una.</p>
</div>
</section>
<section class="content-panel" id="deposits-panel" role="tabpanel" aria-labelledby="deposits-tab" hidden>
<div class="empty-state">
<div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 36 36"><rect x="3.5" y="8" width="29" height="21" rx="4"/><path d="M4 14h28m-22 9h7"/><path d="M23 3v10m-4-4 4 4 4-4" stroke="#ff922e"/></svg></div>
<h2>Sin depósitos todavía</h2>
<p>Aquí encontrarás el historial de tus depósitos y movimientos de USDT.</p>
</div>
</section>
</main>
<nav class="mobile-nav" aria-label="Navegación inferior">
<a href="index.html" aria-label="Inicio"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><small>Inicio</small></a>
<a href="tienda.html" aria-label="Tienda"><svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11h-15L3 9Z"/><path d="M7 9 9 4h6l2 5M9 13v3m6-3v3"/></svg><small>Tienda</small></a>
<a href="revendedores.html" aria-label="Revendedores"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.4-5 6-5s6 1.7 6 5m1-10 2 2 4-4m-5 9h5"/></svg><small>Revendedores</small></a>
<a href="soporte.html" aria-label="Soporte"><svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 12H2v6h4v-6H4Zm16 0h2v6h-4v-6h2ZM18 19c-1 2-3 3-6 3"/></svg><small>Soporte</small></a>
<a class="current" href="cuenta.html" aria-label="Cuenta" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.4-6 8-6s7.3 2 8 6"/></svg><small>Cuenta</small></a>
</nav>
<script>
const gamesTab=document.getElementById('games-tab');
const depositsTab=document.getElementById('deposits-tab');
const gamesPanel=document.getElementById('games-panel');
const depositsPanel=document.getElementById('deposits-panel');
function selectTab(showGames){
 gamesTab.classList.toggle('active',showGames);
 depositsTab.classList.toggle('active',!showGames);
 gamesTab.setAttribute('aria-selected',String(showGames));
 depositsTab.setAttribute('aria-selected',String(!showGames));
 gamesPanel.hidden=!showGames;
 depositsPanel.hidden=showGames;
}
gamesTab.addEventListener('click',()=>selectTab(true));
depositsTab.addEventListener('click',()=>selectTab(false));

</script>
<script type="module">
import { supabase } from "./supabase-client.js";

const gamesPanel = document.getElementById("games-panel");
const depositsPanel = document.getElementById("deposits-panel");

function statusLabel(status) {
  return ({pending:"Pendiente",completed:"Completada",failed:"Reembolsada",confirmed:"Confirmado",rejected:"Rechazado"})[status] || status;
}
function dateLabel(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "Fecha no disponible" :
    date.toLocaleString("es", {day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function makeEmpty(title, description) {
  const box=document.createElement("div");
  box.className="empty-state";
  const h=document.createElement("h2"); h.textContent=title;
  const p=document.createElement("p"); p.textContent=description;
  box.append(h,p);
  return box;
}
function makeHistoryItem({title,code,transaction,amount,status,date,kind}) {
  const item=document.createElement("article"); item.className="history-item";
  const main=document.createElement("div"); main.className="history-main";
  const name=document.createElement("strong"); name.className="history-title"; name.textContent=title;
  const meta=document.createElement("span"); meta.className="history-meta";
  meta.textContent=[code,transaction ? "Movimiento "+transaction : "",dateLabel(date),kind || ""].filter(Boolean).join(" · ");
  main.append(name,meta);
  const right=document.createElement("div"); right.className="history-right";
  const value=document.createElement("div"); value.className="history-amount";
  value.textContent=(status==="failed"||status==="rejected"?"":"−")+Number(amount).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:8})+" USDT";
  const badge=document.createElement("span"); badge.className="history-status "+status; badge.textContent=statusLabel(status);
  right.append(value,badge); item.append(main,right);
  return item;
}
function showLoading(panel,label) {
  panel.replaceChildren(makeEmpty("Cargando...",label));
}
async function loadHistory() {
  const {data:{session},error:authError}=await supabase.auth.getSession();
  if(authError || !session?.user) { window.location.replace("login.html"); return; }

  showLoading(gamesPanel,"Estamos buscando tus compras.");
  showLoading(depositsPanel,"Estamos buscando tus depósitos.");

  const [ordersResult,depositsResult,ledgerResult]=await Promise.all([
    supabase.from("usdt_orders").select("id,order_code,description,amount_usdt,status,created_at").eq("user_id",session.user.id).order("created_at",{ascending:false}),
    supabase.from("usdt_deposits").select("id,deposit_code,amount_usdt,payment_method,status,created_at").eq("user_id",session.user.id).order("created_at",{ascending:false}),
    supabase.from("usdt_transactions").select("transaction_code,order_id,deposit_id,kind").eq("user_id",session.user.id)
  ]);

  if(ordersResult.error) gamesPanel.replaceChildren(makeEmpty("No se pudo cargar el historial","Inténtalo de nuevo más tarde."));
  else if(!ordersResult.data.length) gamesPanel.replaceChildren(makeEmpty("Sin recargas todavía","Aquí aparecerán tus compras y recargas cuando realices una."));
  else {
    const ledgerByOrder=new Map((ledgerResult.data||[]).filter(x=>x.order_id).map(x=>[x.order_id,x.transaction_code]));
    const list=document.createElement("div"); list.className="history-list";
    ordersResult.data.forEach(order=>list.append(makeHistoryItem({
      title:order.description,code:"Pedido "+order.order_code,transaction:ledgerByOrder.get(order.id),
      amount:order.amount_usdt,status:order.status,date:order.created_at,kind:"Compra"
    })));
    gamesPanel.replaceChildren(list);
  }

  if(depositsResult.error) depositsPanel.replaceChildren(makeEmpty("No se pudo cargar el historial","Inténtalo de nuevo más tarde."));
  else if(!depositsResult.data.length) depositsPanel.replaceChildren(makeEmpty("Sin depósitos todavía","Aquí encontrarás el historial de tus depósitos y movimientos de USDT."));
  else {
    const ledgerByDeposit=new Map((ledgerResult.data||[]).filter(x=>x.deposit_id).map(x=>[x.deposit_id,x.transaction_code]));
    const list=document.createElement("div"); list.className="history-list";
    depositsResult.data.forEach(deposit=>list.append(makeHistoryItem({
      title:"Depósito USDT",code:"Depósito "+deposit.deposit_code,transaction:ledgerByDeposit.get(deposit.id),
      amount:deposit.amount_usdt,status:deposit.status,date:deposit.created_at,kind:deposit.payment_method
    })));
    depositsPanel.replaceChildren(list);
  }
}
loadHistory();
</script>
</body>
</html>
