<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="Historial de compras de Internacional Web.">
<title>Mis compras — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0d;--orange:#ff7900;--white:#f5f4f1;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#ff790012,transparent 42%),var(--bg);color:var(--white);font-family:var(--font);padding-bottom:80px}
a{color:inherit;text-decoration:none}
main{width:min(92%,760px);margin:25px auto 38px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:25px}
.heading{min-width:0}
.page-kicker{color:var(--orange);font-size:9px;font-weight:800;letter-spacing:2px;margin:0 0 7px}
h1{font:900 clamp(39px,8vw,54px)/.92 var(--display);letter-spacing:.4px;margin:0}
.tabs{display:flex;align-items:center;gap:5px;padding:4px;border:1px solid #ffffff18;border-radius:13px;background:#111318;flex-shrink:0}
.tab{appearance:none;border:0;background:transparent;color:#8d9099;font:700 11px var(--font);padding:10px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:background .18s,color .18s,box-shadow .18s}
.tab.active{color:#fff;background:linear-gradient(105deg,#9b4808,#d96a08 58%,#ff8a18);box-shadow:0 0 14px #ff79002b}
.content-panel{min-height:320px;border:0;border-radius:0;background:transparent;box-shadow:none;display:grid;place-items:center;padding:18px 0;text-align:center}\n.history-list{width:100%;display:flex;flex-direction:column;gap:22px;text-align:left}\n.day-group{display:flex;flex-direction:column;gap:11px}\n.day-label{margin:0;color:#f5f4f1;font-size:13px;font-weight:800;letter-spacing:.2px}\n.transaction-card{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;border:1px solid #ff790078;border-radius:16px;background:linear-gradient(105deg,#17110c,#0d0e11 65%);box-shadow:inset 0 0 16px #ff79000b}\n.transaction-info{min-width:0;display:flex;flex-direction:column;gap:5px}\n.transaction-name{margin:0;font-size:12px;font-weight:800;color:#f5f4f1}\n.transaction-detail{margin:0;font-size:10px;line-height:1.5;color:#92959e}\n.transaction-amount{flex-shrink:0;font-size:13px;font-weight:800;color:#ff922e;white-space:nowrap}

.history-list{width:100%;display:flex;flex-direction:column;gap:13px;text-align:left}
.day-group{display:flex;flex-direction:column;gap:8px}
.day-label{margin:9px 2px 2px;color:#ff922e;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:capitalize}
.history-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0;border:1px solid #ff79005c;border-radius:13px;background:linear-gradient(105deg,#17110c,#0d0e11 65%);overflow:hidden}
.order-details{width:100%;min-width:0}
.order-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none;padding:11px 12px;cursor:pointer}
.order-summary::-webkit-details-marker{display:none}
.order-summary:after{content:"⌄";color:#ff922e;font-size:17px;transition:transform .2s}
.order-details[open] .order-summary:after{transform:rotate(180deg)}
.order-summary-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.order-summary-title{font-size:11px;font-weight:800;overflow-wrap:anywhere}
.order-summary-date{font-size:9px;color:#92959e}
.order-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;padding:10px 12px 12px;border-top:1px solid #ffffff12}
.order-detail{min-width:0;display:flex;flex-direction:column;gap:3px}
.order-detail label{font-size:8px;color:#858892;text-transform:uppercase;letter-spacing:.6px}
.order-detail strong{font-size:10px;color:#f5f4f1;overflow-wrap:anywhere}
.order-status{flex-shrink:0;align-self:center;margin-right:0}
.history-list .history-item:not(:has(.order-details)){padding:11px 12px}
.history-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid #ff790078;border-radius:15px;background:linear-gradient(105deg,#17110c,#0d0e11 65%)}
.history-main{min-width:0;display:flex;flex-direction:column;gap:5px}
.history-title{font-size:12px;font-weight:800;overflow-wrap:anywhere}
.history-meta{font-size:9px;color:#92959e;line-height:1.6;overflow-wrap:anywhere}
.history-right{flex-shrink:0;text-align:right}
.history-amount{font-size:13px;font-weight:800;color:#ff922e;white-space:nowrap}
.history-status{display:inline-block;margin-top:6px;padding:4px 7px;border:1px solid #ffffff20;border-radius:20px;color:#c5c6ca;font-size:8px;font-weight:800}
.history-status.completed,.history-status.confirmed{color:#69dba0;border-color:#277b50;background:#0c2118}
.history-status.failed,.history-status.rejected{color:#ff8585;border-color:#873b3b;background:#241010}
.history-status.pending{color:#ffc078;border-color:#77501e;background:#21180d}
.history-error{font-size:11px;color:#ff9c80;line-height:1.7}
.empty-state{max-width:340px;text-align:center}
.empty-icon{width:72px;height:72px;margin:0 auto 18px;border:1px solid #ff79005c;border-radius:22px;background:radial-gradient(circle,#ff790020,#111114 72%);display:grid;place-items:center;color:#ff922e;box-shadow:0 0 24px #ff790012}
.empty-icon svg{width:35px;height:35px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty-state h2{font-size:17px;margin:0 0 8px;font-weight:800}
.empty-state p{font-size:11px;line-height:1.7;color:#92959e;margin:0}
.content-panel[hidden]{display:none}
.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:65px;background:#101217f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;height:60px;color:#777}
.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav small{font-size:8px;letter-spacing:.2px}
.mobile-nav a.current{color:var(--orange)}
.mobile-nav a.current:before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:66px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#ff700059 0%,#ff700026 42%,transparent 75%);filter:blur(5px)}
.mobile-nav a.current svg{filter:drop-shadow(0 0 4px #ff7d00) drop-shadow(0 0 9px #ff690073)}
.mobile-nav a.current small{text-shadow:0 0 8px #ff780059}
@media(max-width:520px){main{width:90%;margin:20px auto 28px}.page-head{align-items:flex-start;gap:9px;margin-bottom:20px}h1{font-size:clamp(34px,9vw,44px)}.page-kicker{font-size:8px}.tabs{gap:2px;padding:3px;border-radius:11px;margin-top:15px}.tab{font-size:9px;padding:9px 9px}.content-panel{min-height:285px;padding:20px 0;border-radius:0}.transaction-card{padding:13px 12px;border-radius:14px}.history-list{gap:19px}.empty-icon{width:65px;height:65px}}
@media(max-width:370px){.page-head{flex-wrap:wrap}.tabs{margin-top:0;margin-left:auto}.page-head{align-items:center}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:5px 1%;height:76px;align-items:center}
.mobile-nav:before{content:"";position:absolute;z-index:0;top:9px;left:1%;width:19.6%;height:54px;border:1px solid #ff8700;border-radius:15px;box-shadow:0 0 13px #ff79002b,inset 0 0 12px #ff790018;transform:translateX(calc(var(--active-index,4)*100%));transition:transform .34s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.mobile-nav a{z-index:1;min-width:0;height:60px}
@media(prefers-reduced-motion:reduce){.mobile-nav:before{transition:none!important}}

/* Navegación inferior unificada: mismo diseño que Inicio */
@media(max-width:620px){
 .mobile-nav{position:fixed!important;z-index:10!important;left:0!important;right:0!important;bottom:0!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:0!important;height:76px!important;padding:5px 1%!important;padding-bottom:env(safe-area-inset-bottom)!important;align-items:center!important;justify-content:initial!important;background:#101217f5!important;border-top:1px solid rgba(255,255,255,.09)!important;backdrop-filter:blur(15px)!important}
 .mobile-nav:before{content:""!important;position:absolute!important;z-index:0!important;top:9px!important;left:1%!important;width:19.6%!important;height:54px!important;border:0!important;border-radius:50%!important;background:radial-gradient(ellipse,#ff790044 0%,#ff790020 48%,transparent 76%)!important;box-shadow:none!important;transform:translateX(calc(var(--active-index,0)*100%))!important;transition:transform .34s cubic-bezier(.2,.8,.2,1)!important;pointer-events:none!important}
 .mobile-nav a{position:relative!important;z-index:1!important;isolation:isolate!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:2px!important;min-width:0!important;height:60px!important;color:#777!important}
 .mobile-nav svg{width:23px!important;height:23px!important;fill:none!important;stroke:currentColor!important;stroke-width:2!important;stroke-linecap:round!important;stroke-linejoin:round!important}
 .mobile-nav small{font-size:8px!important;letter-spacing:.2px!important}
 .mobile-nav a:hover,.mobile-nav a.current{color:#ff6b24!important}
 .mobile-nav a.current:before{content:""!important;position:absolute!important;z-index:-1!important;top:3px!important;left:50%!important;width:66px!important;height:44px!important;inset:3px auto auto 50%!important;transform:translateX(-50%)!important;border:0!important;border-radius:50%!important;background:radial-gradient(ellipse at center,rgba(255,112,0,.34) 0%,rgba(255,112,0,.15) 38%,rgba(255,112,0,0) 74%)!important;box-shadow:none!important;filter:blur(5px)!important;opacity:1!important;pointer-events:none!important}
 .mobile-nav a.current svg{filter:drop-shadow(0 0 4px rgba(255,125,0,.9)) drop-shadow(0 0 10px rgba(255,105,0,.45))!important}
 .mobile-nav a.current small{text-shadow:0 0 8px rgba(255,120,0,.35)!important}
}
@media(prefers-reduced-motion:reduce){.mobile-nav:before{transition:none!important}}
</style>

<body>

<header class="page-head">
<div class="heading"><p class="page-kicker">TU ACTIVIDAD</p><h1>MIS COMPRAS</h1></div>

<a href="tienda.html" aria-label="Tienda"><svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11h-15L3 9Z"/><path d="M7 9 9 4h6l2 5M9 13v3m6-3v3"/></svg><small>Tienda</small></a>

<script>
const gamesTab=document.getElementById('games-tab');
const depositsTab=document.getElementById('deposits-tab');
const gamesPanel=document.getElementById('games-panel');
const depositsPanel=document.getElementById('deposits-panel');
function selectTab(showGames){
 gamesTab.classList.toggle('active',showGames);
 depositsTab.classList.toggle('active',!showGames);
 gamesTab.setAttribute('aria-selected',String(showGames));
 depositsTab.setAttribute('aria-selected',String(!showGames));
 gamesPanel.hidden=!showGames;
 depositsPanel.hidden=showGames;
}
gamesTab.addEventListener('click',()=>selectTab(true));
depositsTab.addEventListener('click',()=>selectTab(false));

</script>
<script type="module">
import { supabase, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-client.js";

const gamesPanel = document.getElementById("games-panel");
const depositsPanel = document.getElementById("deposits-panel");

function statusLabel(status) {
  return ({pending:"Pendiente",completed:"Completada",failed:"Reembolsada",confirmed:"Confirmado",rejected:"Rechazado",SIMULATED:"Prueba archivada"})[status] || status;
}
function dateLabel(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "Fecha no disponible" :
    date.toLocaleString("es", {day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function orderDateParts(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return {hour:"No disponible",date:"No disponible"};
  return {
    hour:date.toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"}),
    date:date.toLocaleDateString("es",{day:"2-digit",month:"long",year:"numeric"})
  };
}
function makeEmpty(title, description) {
  const box=document.createElement("div");
  box.className="empty-state";
  const h=document.createElement("h2"); h.textContent=title;
  const p=document.createElement("p"); p.textContent=description;
  box.append(h,p);
  return box;
}
function makeHistoryItem({title,code,transaction,amount,status,date,kind,isDeposit=false,isOrder=false,playerId=null}) {
  const item=document.createElement("article"); item.className="history-item";
  const main=document.createElement("div"); main.className="history-main";
  const name=document.createElement("strong"); name.className="history-title"; name.textContent=title;
  main.append(name);
  if(isOrder) {
    const parts=orderDateParts(date);
    const details=document.createElement("details"); details.className="order-details";
    const summary=document.createElement("summary"); summary.className="order-summary";
    const summaryMain=document.createElement("span"); summaryMain.className="order-summary-main";
    const summaryTitle=document.createElement("strong"); summaryTitle.className="order-summary-title"; summaryTitle.textContent=title||"Pedido de juego";
    const summaryDate=document.createElement("span"); summaryDate.className="order-summary-date"; summaryDate.textContent=parts.date+" · "+parts.hour;
    summaryMain.append(summaryTitle,summaryDate);
    const right=document.createElement("span"); right.className="history-right order-status";
    const badge=document.createElement("span"); badge.className="history-status "+String(status||"").toLowerCase(); badge.textContent=statusLabel(status);
    right.append(badge); summary.append(summaryMain,right);
    const grid=document.createElement("div"); grid.className="order-detail-grid";
    const fields=[
      ["Producto",title||"No disponible"],
      ["ID del jugador",playerId||"No indicado"],
      ["Precio",amount===null||amount===undefined?"No disponible":Number(amount).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:8})+" USDT"],
      ["Pedido",code||"No disponible"],
      ["Fecha y hora",parts.date+" · "+parts.hour]
    ];
    fields.forEach(([labelText,valueText])=>{
      const field=document.createElement("div");field.className="order-detail";
      const label=document.createElement("label");label.textContent=labelText;
      const value=document.createElement("strong");value.textContent=valueText;
      field.append(label,value);grid.append(field);
    });
    details.append(summary,grid); item.append(details);
    return item;
  }
  const meta=document.createElement("span"); meta.className="history-meta";
  meta.textContent=[code,transaction ? "Movimiento "+transaction : "",dateLabel(date),kind || ""].filter(Boolean).join(" · ");
  main.append(meta);
  const right=document.createElement("div"); right.className="history-right";
  const value=document.createElement("div"); value.className="history-amount";
  const sign=isDeposit?(status==="confirmed"?"+":""):(status==="failed"?"+":"−");
  value.textContent=amount===null || amount===undefined ? "PRUEBA" : sign+Number(amount).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:8})+" USDT";
  const badge=document.createElement("span"); badge.className="history-status "+status; badge.textContent=statusLabel(status);
  right.append(value,badge); item.append(main,right);
  return item;
}
function showLoading(panel,label) {
  panel.replaceChildren(makeEmpty("Cargando...",label));
}
function renderOrders(rows) {
  if (!Array.isArray(rows) || !rows.length) {
    gamesPanel.replaceChildren(makeEmpty("Sin recargas todavía","Aquí aparecerán tus compras."));
    return;
  }
  const list=document.createElement("div"); list.className="history-list";
  const days=new Map();
  rows.forEach(order=>{
    const date=new Date(order.created_at);
    const key=Number.isNaN(date.getTime())?"sin-fecha":date.toLocaleDateString("sv-SE");
    if(!days.has(key)) days.set(key,[]);
    days.get(key).push(order);
  });
  days.forEach((orders,key)=>{
    const group=document.createElement("section");group.className="day-group";
    const heading=document.createElement("h3");heading.className="day-label";
    if(key==="sin-fecha") {
      heading.textContent="Fecha no disponible";
    } else {
      const orderDate=new Date(orders[0].created_at);
      const today=new Date();
      const yesterday=new Date(today);
      yesterday.setDate(today.getDate()-1);
      const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
      if(sameDay(orderDate,today)) heading.textContent="Hoy";
      else if(sameDay(orderDate,yesterday)) heading.textContent="Ayer";
      else heading.textContent=orderDate.toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    }
    group.append(heading);
    orders.forEach(order=>group.append(makeHistoryItem({
      title:order.description,code:order.order_code,playerId:order.player_id,
      amount:order.amount_usdt,date:order.created_at,status:order.status,isOrder:true
    })));
    list.append(group);
  });
  gamesPanel.replaceChildren(list);
}
function renderDeposits(rows, ledgerRows) {
  if (!Array.isArray(rows) || !rows.length) {
    depositsPanel.replaceChildren(makeEmpty("Sin depósitos acreditados","Aquí aparecerán únicamente los depósitos que ya se hayan acreditado a tu saldo USDT."));
    return;
  }
  const ledgerByDeposit=new Map((ledgerRows||[]).filter(x=>x.deposit_id).map(x=>[x.deposit_id,x.transaction_code]));
  const list=document.createElement("div"); list.className="history-list";
  rows.forEach(deposit=>list.append(makeHistoryItem({
    title:"Depósito USDT",code:"Depósito "+deposit.deposit_code,transaction:ledgerByDeposit.get(deposit.id),
    amount:deposit.amount_usdt,status:deposit.status,date:deposit.created_at,kind:deposit.payment_method,isDeposit:true
  })));
  depositsPanel.replaceChildren(list);
}
async function loadHistory() {
  const {data:{session},error:authError}=await supabase.auth.getSession();
  if(authError || !session?.user) { window.location.replace("login.html"); return; }

  showLoading(gamesPanel,"Estamos buscando tus compras.");
  showLoading(depositsPanel,"Estamos buscando tus depósitos.");

  const cacheKey="iw-history:"+session.user.id;
  try {
    const cached=JSON.parse(localStorage.getItem(cacheKey)||"null");
    if(cached && Date.now()-cached.savedAt<24*60*60*1000) {
      if(Array.isArray(cached.orders)) renderOrders(cached.orders);
      if(Array.isArray(cached.deposits)) renderDeposits(cached.deposits,cached.ledger||[]);
    }
  } catch(cacheError) {
    console.warn("No se pudo leer el historial guardado:",cacheError);
  }

  const [ordersResult,depositsResult,ledgerResult]=await Promise.all([
    supabase.from("usdt_orders").select("id,order_code,description,player_id,amount_usdt,status,created_at").eq("user_id",session.user.id).order("created_at",{ascending:false}),
    supabase.from("usdt_deposits").select("id,deposit_code,amount_usdt,payment_method,status,created_at").eq("user_id",session.user.id).eq("status","confirmed").order("created_at",{ascending:false}),
    supabase.from("usdt_transactions").select("transaction_code,order_id,deposit_id,kind").eq("user_id",session.user.id)
  ]);

  if(!ordersResult.error) renderOrders(ordersResult.data||[]);
  else if(gamesPanel.querySelector(".history-list")===null) gamesPanel.replaceChildren(makeEmpty("No se pudo cargar el historial","Inténtalo de nuevo más tarde."));

  if(!depositsResult.error) renderDeposits(depositsResult.data||[],ledgerResult.data||[]);
  else if(depositsPanel.querySelector(".history-list")===null) depositsPanel.replaceChildren(makeEmpty("No se pudo cargar el historial","Inténtalo de nuevo más tarde."));

  if(!ordersResult.error&&!depositsResult.error&&!ledgerResult.error) {
    try {
      localStorage.setItem(cacheKey,JSON.stringify({
        savedAt:Date.now(),
        orders:ordersResult.data||[],
        deposits:depositsResult.data||[],
        ledger:ledgerResult.data||[]
      }));
    } catch(cacheError) {
      console.warn("No se pudo guardar el historial:",cacheError);
    }
  }
}
loadHistory();
</script>

<script>
(()=>{const nav=document.querySelector(".mobile-nav");if(!nav)return;const links=[...nav.querySelectorAll("a")];const file=location.pathname.split("/").pop()||"index.html";let active=links.findIndex(a=>{const target=(a.getAttribute("href")||"").split("#")[0];return target===file||(file==="mis-compras.html"&&target==="cuenta.html")});if(active<0)active=4;nav.style.setProperty("--active-index",active);links.forEach((a,i)=>{a.classList.toggle("current",i===active);if(i===active)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});links.forEach((a,i)=>a.addEventListener("click",()=>nav.style.setProperty("--active-index",i)))})();
</script>
