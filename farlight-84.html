<script type="module">
import { supabase, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-client.js";

const { data: { user: verifiedUser }, error: authError } = await supabase.auth.getUser();
if (authError || !verifiedUser) {
  window.location.replace("login.html");
  throw new Error("auth_required");
}
const { data: { session: entrySession }, error: sessionError } = await supabase.auth.getSession();
if (sessionError || !entrySession?.access_token || entrySession.user?.id !== verifiedUser.id) {
  window.location.replace("login.html");
  throw new Error("session_unavailable");
}
let activeSession = entrySession;
supabase.auth.onAuthStateChange((_event, session) => {
  activeSession = session;
  if (!session) window.location.replace("login.html");
});
const GAME="farlight-84";
const PRODUCT_ICON="💎";
const CATALOG_URL="https://fyyebxjysrhcxgmgperf.supabase.co/functions/v1/public-game-catalog";
const message=document.getElementById("message");
const packages=document.getElementById("packages");
const regions=document.getElementById("regions");
const buyButton=document.getElementById("buy-button");
const playerSection=document.getElementById("player-title").closest(".section");
const playerInput=document.getElementById("player-id");

function clearValidation(){}
let products=[];
let resellerDiscountPercent=0;
let resellerPricingLoaded=false;
let selectedProduct=null;
let selectedCategory="currency";
     buyButton.disabled=true;
let selectedRegion="";
function notify(text){message.textContent=text;message.classList.add("show")}
function safeText(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function normalizeGameRegion(region){
 const value=String(region||"global").trim().toLowerCase();
 const labels={global:"Global",malaysia:"Malasia",singapore:"Singapur",cambodia:"Camboya",indonesia:"Indonesia"};
 if(labels[value]) return labels[value];
 return value.split(/[\s_-]+/).filter(Boolean).map(part=>part.charAt(0).toUpperCase()+part.slice(1)).join(" ");
}
function regionEmoji(region){
 const flags={Global:"🌐",Malasia:"🇲🇾",Singapur:"🇸🇬",Camboya:"🇰🇭",Indonesia:"🇮🇩"};
 return flags[region]||"🌎";
}
function renderRegions(){
 const values=[...new Set(products.map(product=>product.region).filter(Boolean))];
 regions.innerHTML="";
 selectedRegion=values.includes(selectedRegion)?selectedRegion:(values[0]||"");
 values.forEach(region=>{
   const button=document.createElement("button");
   button.type="button";
   button.className="choice"+(region===selectedRegion?" selected":"");
   button.dataset.value=region;
   button.innerHTML='<span class="symbol" aria-hidden="true">'+regionEmoji(region)+'</span><span>'+safeText(region)+'</span>';
   button.addEventListener("click",()=>{
     selectedRegion=region;
     selectedProduct=null;
     buyButton.disabled=true;
     clearValidation();
     regions.querySelectorAll(".choice").forEach(el=>el.classList.toggle("selected",el===button));
     renderProducts();
     updateRequirements();
     scheduleNicknameValidation();
   });
   regions.append(button);
 });
}
function productAmount(product){
 const direct=[product.amount,product.quantity,product.denomination,product.value].find(value=>value!==null&&value!==undefined&&value!==""&&Number.isFinite(Number(value))&&Number(value)>0);
 if(direct!==undefined) return Number(direct);
 const match=String(product.name||"").replace(/,/g,"").match(/\d+(?:\.\d+)?/);
 return match?Number(match[0]):0;
}
function isCurrencyPack(product){
 const name=String(product?.name||"").toLowerCase();
 if(/subscription|pass|supplies|monthly card|weekly card|bazaar|upgrade/i.test(name)) return false;
 return /diamantes?|diamonds?|bonds?|lunite|delta\s*coins?|coins?|platinum|cash|fc\s*points?|silver|\bcp\b|tokens?|cristales\s+g[eé]nesis|genesis\s+crystals?|crystals?|\buc\b|robux|\bgold\b/i.test(name);
}
function priceForProduct(product){
 const base=Number(product?.priceUSDT);
 if(!Number.isFinite(base)||base<=0)return 0;
 return resellerDiscountPercent>0?Math.round((base*(1-resellerDiscountPercent/100))*100)/100:base;
}
function renderProducts(){
  packages.innerHTML="";
  const visible=products.filter(p=>!selectedRegion||p.region===selectedRegion);
  if(!selectedRegion){
    packages.innerHTML='<div class="catalog-state">Selecciona una región para cargar sus productos.</div>';
    return;
  }
  if(!visible.length){
    packages.innerHTML='<div class="catalog-state">No hay productos disponibles para esta región.</div>';
    return;
  }
  const currencyGroup=document.createElement("section");
  currencyGroup.className="package-group";
  currencyGroup.innerHTML='<div class="packages" id="currency-packages"></div>';
  const extraGroup=document.createElement("section");
  extraGroup.className="package-group";
  extraGroup.innerHTML='<div class="packages" id="extra-packages"></div>';
  const activeGroup=selectedCategory==="currency"?currencyGroup:extraGroup;
   packages.append(activeGroup);
   const activeContainer=activeGroup.querySelector(".packages");
  const currencyProducts=visible.filter(isCurrencyPack).sort((a,b)=>productAmount(a)-productAmount(b)||Number(a.priceUSDT||0)-Number(b.priceUSDT||0));
  const extraProducts=visible.filter(p=>!isCurrencyPack(p)).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"es"));
  function renderGroup(list,container){
    if(!list.length){
      const empty=document.createElement("div");
      empty.className="package-empty";
      empty.textContent="No hay productos disponibles.";
      container.append(empty);
      return;
    }
    list.forEach(product=>{
      const button=document.createElement("button");
      button.type="button";
      button.className="package"+(selectedProduct?.productId===product.productId?" selected":"");
      button.dataset.productId=product.productId;
      const icon=PRODUCT_ICON;
      button.innerHTML=(resellerDiscountPercent>0?'<span class="reseller-discount-badge">-'+resellerDiscountPercent+'%</span>':'')+'<span class="diamond">'+icon+'</span><strong>'+safeText(product.name)+'</strong>'+(typeof product.priceUSDT==="number"?(resellerDiscountPercent>0&&priceForProduct(product)<Number(product.priceUSDT)?'<span class="price-line"><del class="price-before">'+Number(product.priceUSDT).toFixed(2)+' USDT</del><small class="price-usdt price-current">'+priceForProduct(product).toFixed(2)+' USDT</small></span>':'<small class="price-usdt">'+priceForProduct(product).toFixed(2)+' USDT</small>'):'<small class="price-usdt">Precio no disponible</small>');
      const productTitle=button.querySelector("strong");
      if(productTitle){
        const titleLength=productTitle.textContent.trim().length;
        productTitle.style.fontSize=titleLength>36?"13px":titleLength>29?"14px":titleLength>22?"16px":"";
      }
      button.addEventListener("click",()=>{
        selectedProduct=product;
        clearValidation();
        buyButton.disabled=false;
        packages.querySelectorAll(".package").forEach(el=>el.classList.toggle("selected",el===button));
        updateRequirements();
        scheduleNicknameValidation();
      });
      container.append(button);
    });
  }
  renderGroup(selectedCategory==="currency"?currencyProducts:extraProducts,activeContainer);
}

function setProductCategory(category){
 if(!["currency","offers"].includes(category)||selectedCategory===category)return;
 selectedCategory=category;
 selectedProduct=null;
 clearValidation();
 buyButton.disabled=true;
 buyButton.textContent=category==="offers"?"Comprar oferta":"Recargar ahora";
 const currencyTab=document.getElementById("tab-currency");
 const offersTab=document.getElementById("tab-offers");
 currencyTab.classList.toggle("active",category==="currency");
 offersTab.classList.toggle("active",category==="offers");
 currencyTab.setAttribute("aria-selected",String(category==="currency"));
 offersTab.setAttribute("aria-selected",String(category==="offers"));
 renderProducts();
 updateRequirements();
}
document.getElementById("tab-currency").addEventListener("click",()=>setProductCategory("currency"));
document.getElementById("tab-offers").addEventListener("click",()=>setProductCategory("offers"));
buyButton.textContent="Recargar ahora";

function updateRequirements(){
 buyButton.textContent=selectedCategory==="offers"?"Comprar oferta":"Recargar ahora";
 const needsPlayer=selectedProduct ? !!selectedProduct.requiresPlayerId : products.some(p=>p.requiresPlayerId);
 playerSection.hidden=!needsPlayer;
 const zoneId=document.getElementById("provider-zone-id");
 const needsZone=selectedProduct ? !!selectedProduct.requiresZoneId : products.some(p=>p.requiresZoneId);
 if(needsZone){
   if(!zoneId){
     const field=document.createElement("div");
     field.id="provider-zone-wrap";field.className="player-field";field.style.flex="1";field.style.minWidth="0";
     field.innerHTML='<input class="player-input" id="provider-zone-id" type="text" autocomplete="off" placeholder="Ingresa tu Zone ID..." aria-label="Zone ID" style="width:100%;min-width:0">';
     playerSection.querySelector(".field-row").append(field);
   }
 }else{
   document.getElementById("provider-zone-wrap")?.remove();
 }
}
function applyCatalogProducts(rawProducts){
 products=Array.isArray(rawProducts)?rawProducts.filter(p=>p.type==="TOPUP"&&typeof p.priceUSDT==="number"&&p.priceUSDT>0&&p.currency==="USDT").map(p=>({...p,providerRegion:String(p.region||"global"),region:normalizeGameRegion(p.region),supportsPlayerValidation:false})):[];
 if(!products.length){
   packages.innerHTML='<div class="catalog-state">No hay productos disponibles en este momento. Vuelve a intentarlo más tarde.</div>';
   regions.innerHTML="";
   playerSection.hidden=true;
   document.getElementById("tab-offers").hidden=true;
   buyButton.disabled=true;
   return;
 }
 const hasOffers=products.some(p=>!isCurrencyPack(p));
 document.getElementById("tab-offers").hidden=!hasOffers;
 if(!hasOffers&&selectedCategory==="offers") selectedCategory="currency";
 playerSection.hidden=false;
 renderRegions();
 renderProducts();
 updateRequirements();
}
function readPrefetchedCatalog(){
 for(const storage of [localStorage,sessionStorage]){
  try{
   const cached=JSON.parse(storage.getItem("iw_catalog_"+GAME)||"null");
   if(cached&&Array.isArray(cached.products)&&Date.now()-cached.savedAt<24*60*60*1000) return cached.products;
  }catch(error){}
 }
 return null;
}
async function loadCatalog(){
 buyButton.textContent="Recargar ahora";
 const cachedProducts=readPrefetchedCatalog();
 if(cachedProducts) applyCatalogProducts(cachedProducts);
 else { packages.replaceChildren(); buyButton.disabled=true; }
 try{
   const response=await fetch(CATALOG_URL+"?game="+encodeURIComponent(GAME),{method:"GET",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Accept:"application/json",Authorization:"Bearer "+(activeSession?.access_token||"")}});
   const data=await response.json();
   if(!response.ok||!data.ok) throw new Error(data.error||"catalog_unavailable");
   resellerDiscountPercent=Number(data.reseller?.discountPercent)||0;
    resellerPricingLoaded=true;
    const freshProducts=Array.isArray(data.products)?data.products:[];
   const cacheEntry=JSON.stringify({products:freshProducts,savedAt:Date.now()});try{localStorage.setItem("iw_catalog_"+GAME,cacheEntry);}catch(error){}try{sessionStorage.setItem("iw_catalog_"+GAME,cacheEntry);}catch(error){}
   applyCatalogProducts(freshProducts);
 }catch(error){
   console.error("GAME_CATALOG_LOAD_FAILED",GAME,error);
   if(!cachedProducts){
     packages.innerHTML='<div class="catalog-state">No pudimos cargar el catálogo. Comprueba tu conexión e inténtalo de nuevo.</div>';
     regions.innerHTML='<div class="catalog-state">No se pudieron cargar las regiones. <button type="button" id="retry-catalog" style="margin-top:10px;padding:10px 16px;border:1px solid #25d1ff;border-radius:10px;background:#081a35;color:#fff;font-weight:800">Reintentar</button></div>';
     document.getElementById("retry-catalog")?.addEventListener("click",loadCatalog);
     buyButton.disabled=true;
     notify("No se pudo conectar con el catálogo de Supabase.");
   }
 }
}
let purchaseInProgress=false;
let pendingClientReference="";
const pendingStorageKey="gg-rechargegames-pending:"+GAME+":"+verifiedUser.id;
let activePendingReferenceKey="";
function getPendingClientReference(product,playerId,serverId){
 const key=[product?.productId||"",playerId||"",serverId||""].join("|");
 activePendingReferenceKey=key;
 let saved={};
 try{saved=JSON.parse(localStorage.getItem(pendingStorageKey)||"{}");if(!saved||typeof saved!=="object"||Array.isArray(saved))saved={};}catch(error){saved={};}
 if(!saved[key]) saved[key]="IW-"+crypto.randomUUID().replace(/-/g,"");
 pendingClientReference=String(saved[key]);
 try{localStorage.setItem(pendingStorageKey,JSON.stringify(saved));}catch(error){}
 return pendingClientReference;
}
function clearPendingReference(){
 if(activePendingReferenceKey){
  try{
   const saved=JSON.parse(localStorage.getItem(pendingStorageKey)||"{}");
   if(saved&&typeof saved==="object") delete saved[activePendingReferenceKey];
   localStorage.setItem(pendingStorageKey,JSON.stringify(saved||{}));
  }catch(error){}
 }
 pendingClientReference="";
 activePendingReferenceKey="";
}

buyButton.addEventListener("click",async()=>{
 if(purchaseInProgress) return;
 if(!selectedProduct){notify("Selecciona primero un producto.");return;}
 const playerId=playerInput?.value.trim()||"";
 const zoneId=document.getElementById("provider-zone-id")?.value.trim()||"";
 if(selectedProduct.requiresPlayerId&&!playerId){notify("Ingresa tu Player ID antes de continuar.");playerInput?.focus();return;}
 if(selectedProduct.requiresZoneId&&!zoneId){notify("Ingresa tu Zone ID antes de continuar.");document.getElementById("provider-zone-id")?.focus();return;}
 if(!resellerPricingLoaded){notify("No se pudo comprobar tu nivel de revendedor. Actualiza el catálogo antes de comprar.");return;}
  const price=priceForProduct(selectedProduct);
 if(!Number.isFinite(price)||price<=0){notify("No se pudo comprobar el precio. Actualiza el catálogo.");return;}
 const accepted=window.confirm("¿Confirmas "+selectedProduct.name+" por "+price.toFixed(2)+" USDT? Se descontará de tu saldo.");
 if(!accepted) return;
 purchaseInProgress=true;
 buyButton.disabled=true;
 buyButton.textContent="Enviando pedido…";
 notify("Enviando el pedido de forma segura. No cierres esta página.");
 try{
   const accessToken=activeSession?.access_token;
   if(!accessToken) throw new Error("Tu sesión ya no está activa. Vuelve a iniciar sesión.");
   const clientReference=getPendingClientReference(selectedProduct,playerId,zoneId);
   const response=await fetch(SUPABASE_URL+"/functions/v1/rechargegames-comprar",{
     method:"POST",
     headers:{
       apikey:SUPABASE_PUBLISHABLE_KEY,
       Authorization:"Bearer "+accessToken,
       "Content-Type":"application/json",
       Accept:"application/json"
     },
     body:JSON.stringify({
       product_key:selectedProduct.productId,
       game:GAME,
       player_id:playerId,server_id:zoneId,client_reference:clientReference,expected_amount:price
     })
   });
   const data=await response.json().catch(()=>({}));
   if(response.status===402&&data.error==="insufficient_usdt_balance"){
     clearPendingReference();
     notify("Saldo USDT insuficiente. No se realizó el pedido.");
   }else if(data.refunded===true){clearPendingReference();window.location.assign("checkout.html?order="+encodeURIComponent(data.order?.code||"")+"&received=0");return;}else if(response.status===202||data.error==="provider_submission_pending_confirmation"){window.location.assign("checkout.html?order="+encodeURIComponent(data.order?.code||"")+"&received=0");return;}else if(!response.ok||!data.ok){
     throw new Error(data.error==="wallet_not_found"?"No encontramos tu monedero USDT.":data.error==="price_changed"?"El precio cambió. Actualiza el catálogo y confirma de nuevo.":(data.error||"No se pudo crear el pedido."));
   }else{const status=data.order?.status||"pending";if(["completed","delivered","failed"].includes(status))clearPendingReference();window.location.assign("checkout.html?order="+encodeURIComponent(data.order?.code||"")+"&received=1");return;}
  }catch(error){
   notify(error instanceof Error?error.message:"Error al procesar el pedido. Si no sabes si se creó, consulta soporte antes de reintentar.");
 }finally{
   purchaseInProgress=false;
   buyButton.disabled=!selectedProduct;
   buyButton.textContent=selectedCategory==="offers"?"Comprar oferta":"Recargar ahora";
 }
});

function scheduleNicknameValidation(){}\nconst pasteButton=document.getElementById("player-paste");
pasteButton?.addEventListener("click",async()=>{
 try{
  if(!navigator.clipboard?.readText) throw new Error("Tu navegador no permite leer el portapapeles. Mantén pulsado el campo y selecciona Pegar.");
  const pastedText=await navigator.clipboard.readText();
  const value=String(pastedText||"").trim();
  if(!value){notify("El portapapeles está vacío.");return;}
  playerInput.value=value;
  playerInput.dispatchEvent(new Event("input",{bubbles:true}));
  playerInput.focus();
 }catch(error){
  notify(error?.message||"No se pudo pegar. Mantén pulsado el campo y selecciona Pegar.");
 }
});
playerInput?.addEventListener("input",()=>{
 message.classList.remove("show");
 scheduleNicknameValidation();
});
document.addEventListener("input",(event)=>{
 if(event.target?.id==="provider-zone-id") scheduleNicknameValidation();
});

loadCatalog();
</script>
