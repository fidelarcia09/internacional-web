<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="Métodos de acceso de tu cuenta de Internacional Web.">
<title>Métodos de acceso — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0d;--orange:#ff7900;--white:#f5f4f1;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#ff790012,transparent 42%),var(--bg);color:var(--white);font-family:var(--font);padding-bottom:80px}
a{color:inherit;text-decoration:none}
main{width:min(90%,510px);margin:22px auto 35px}
.page-kicker{text-align:center;color:var(--orange);font-size:9px;font-weight:800;letter-spacing:2px;margin:0 0 8px}
h1{font:900 clamp(39px,10vw,56px)/.95 var(--display);text-align:center;letter-spacing:.4px;margin:0 0 26px}
.methods{display:grid;gap:13px}
.method{min-height:91px;display:grid;grid-template-columns:54px minmax(0,1fr) 22px;align-items:center;gap:14px;padding:15px 17px;border:1px solid #ff790078;border-radius:17px;background:linear-gradient(105deg,#17110c,#0d0e11 65%);box-shadow:inset 0 0 16px #ff79000b;transition:border-color .18s,box-shadow .18s,transform .18s}
.method:hover{border-color:#ff9a22;box-shadow:0 0 15px #ff790020;transform:translateY(-2px)}
.method-icon{width:49px;height:49px;border-radius:14px;display:grid;place-items:center;background:#ffffff08;border:1px solid #ffffff12}
.method-icon svg{width:29px;height:29px;display:block}
.method-copy strong{display:block;font-size:14px;font-weight:700;letter-spacing:.1px;margin-bottom:5px}
.method-copy small{display:block;color:#9699a2;font-size:10px;line-height:1.4}
.method-arrow{font-size:29px;line-height:1;color:var(--orange);text-align:right;font-weight:400}
.google-icon{width:28px;height:28px}
.mail-icon{fill:none;stroke:#e8e9ed;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.telegram-icon{fill:none;stroke:#ff922e;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:65px;background:#101217f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;height:60px;color:#777}
.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav small{font-size:8px;letter-spacing:.2px}
.mobile-nav a.current{color:var(--orange)}
.mobile-nav a.current:before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:66px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#ff700059 0%,#ff700026 42%,transparent 75%);filter:blur(5px)}
.mobile-nav a.current svg{filter:drop-shadow(0 0 4px #ff7d00) drop-shadow(0 0 9px #ff690073)}
.mobile-nav a.current small{text-shadow:0 0 8px #ff780059}
@media(max-width:620px){main{margin:22px auto 28px;width:90%}h1{margin-bottom:22px}.methods{gap:10px}.method{min-height:82px;padding:12px 13px;grid-template-columns:48px minmax(0,1fr) 18px;gap:12px;border-radius:15px}.method-icon{width:44px;height:44px;border-radius:12px}.method-copy strong{font-size:13px}.method-copy small{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
<p class="page-kicker">TU PERFIL</p>
<h1>MÉTODOS DE ACCESO</h1>
<section class="methods" aria-label="Métodos de acceso disponibles">
<div class="method">
<span class="method-icon" aria-hidden="true">
<svg class="google-icon" viewBox="0 0 48 48"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.9 1.3-4.1 2-6.8 2-5.2 0-9.6-3.5-11.2-8.2H5.9v5.2A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.8 27.8a12 12 0 0 1 0-7.6V15H5.9a20 20 0 0 0 0 18Z"/><path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.9 15l6.9 5.2c1.6-4.7 6-8.1 11.2-8.1Z"/></svg>
</span>
<span class="method-copy"><strong>Google</strong><small>Acceso con tu cuenta de Google</small></span>
<span class="method-arrow" aria-hidden="true">›</span>
</div>
<div class="method">
<span class="method-icon" aria-hidden="true"><svg class="mail-icon" viewBox="0 0 32 32"><rect x="3.5" y="6" width="25" height="20" rx="3"/><path d="m5 9 11 9 11-9"/><path d="m5 23 7-6m15 6-7-6" opacity=".65"/></svg></span>
<span class="method-copy"><strong>Correo electrónico</strong><small>Acceso con tu dirección de correo</small></span>
<span class="method-arrow" aria-hidden="true">›</span>
</div>
<div class="method">
<span class="method-icon" aria-hidden="true"><svg class="telegram-icon" viewBox="0 0 32 32"><path d="m28 5-4.2 22-8.1-6.2-4.5 4.3.6-7.3L25 8.2 9.2 18.1 4 16.3 28 5Z"/><path d="m11.8 17.8 4 3"/></svg></span>
<span class="method-copy"><strong>Telegram</strong><small>Acceso mediante tu cuenta de Telegram</small></span>
<span class="method-arrow" aria-hidden="true">›</span>
</div>
</section>
</main>
<nav class="mobile-nav" aria-label="Navegación inferior">

<a class="current" href="cuenta.html" aria-label="Cuenta" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.4-6 8-6s7.3 2 8 6"/></svg><small>Cuenta</small></a>
</nav>
</body>
</html>
