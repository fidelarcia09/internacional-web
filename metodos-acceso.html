<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<meta name="description" content="Métodos de acceso de tu cuenta de Internacional Web.">
<title>Métodos de acceso — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b18;--orange:#00c6ff;--white:#f5f4f1;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#00c6ff12,transparent 42%),var(--bg);color:var(--white);font-family:var(--font);padding-bottom:80px}
a{color:inherit;text-decoration:none}
.back{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid #34363d;border-radius:13px;color:#bbb;font-size:12px;font-weight:800;white-space:nowrap;margin:0 0 20px}.back svg{width:18px;height:18px;fill:none;stroke:var(--orange);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
main{width:min(90%,510px);margin:22px auto 35px}
.page-kicker{text-align:center;color:var(--orange);font-size:9px;font-weight:800;letter-spacing:2px;margin:0 0 8px}
h1{font:900 clamp(39px,10vw,56px)/.95 var(--display);text-align:center;letter-spacing:.4px;margin:0 0 26px}
.methods{display:grid;gap:13px}
.method{min-height:91px;display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;gap:14px;padding:15px 17px;border:1px solid #00c6ff78;border-radius:17px;background:linear-gradient(105deg,#0d2342,#081a35 65%);box-shadow:inset 0 0 16px #00c6ff0b;transition:border-color .18s,box-shadow .18s,transform .18s}
.method:hover{border-color:#22beff;box-shadow:0 0 15px #00c6ff20;transform:translateY(-2px)}
.method-icon{width:49px;height:49px;border-radius:14px;display:grid;place-items:center;background:#ffffff08;border:1px solid #ffffff12}
.method-icon svg{width:29px;height:29px;display:block}
.method-copy strong{display:block;font-size:14px;font-weight:700;letter-spacing:.1px;margin-bottom:5px}
.method-copy small{display:block;color:#9699a2;font-size:10px;line-height:1.4}
.method-status{justify-self:end;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.1px;border:1px solid #ffffff20;background:#ffffff08;color:#aeb0b8;text-align:center;min-height:34px}
.method-status svg{width:16px;height:16px;flex:0 0 16px;display:block}
.method-status{font-family:var(--font);cursor:pointer}.method-status:disabled{cursor:default}.method-status.is-unverified:hover{border-color:#8afaff;background:#5bf9ff20;box-shadow:0 0 12px #5bf9ff20}
.method-status.is-verified{color:#55e69a;border-color:#35c98270;background:#35c98218;box-shadow:0 0 12px #35c98212}
.method-status.is-unverified{color:#86f6ff;border-color:#5bf9ff55;background:#5bf9ff12}
.method-status.is-loading{color:#aeb0b8;border-color:#ffffff20;background:#ffffff08}
.google-icon{width:28px;height:28px}
.mail-icon{width:30px;height:30px;display:block;filter:drop-shadow(0 0 2px #ffffff20)}
.telegram-icon{fill:none;stroke:#2AABEE;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:65px;background:#101217f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;height:60px;color:#777}
.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav small{font-size:8px;letter-spacing:.2px}
.mobile-nav a.current{color:var(--orange)}
.mobile-nav a.current:before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:66px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#00cfff59 0%,#00cfff26 42%,transparent 75%);filter:blur(5px)}
.mobile-nav a.current svg{filter:drop-shadow(0 0 4px #00c2ff) drop-shadow(0 0 9px #00d6ff73)}
.mobile-nav a.current small{text-shadow:0 0 8px #00c7ff59}
@media(max-width:620px){main{margin:22px auto 28px;width:94%}h1{margin-bottom:22px}.methods{gap:10px}.method{min-height:82px;padding:12px 13px;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;border-radius:15px}.method-icon{width:44px;height:44px;border-radius:12px}.method-copy strong{font-size:13px}.method-copy small{font-size:9px}.method-status{font-size:10px;padding:7px 9px;gap:6px;min-height:32px}.method-status svg{width:15px;height:15px;flex-basis:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
<style id="mobile-nav-final-unified">
@media(max-width:620px){
.mobile-nav{position:fixed!important;z-index:10!important;left:0!important;right:0!important;bottom:0!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:0!important;height:calc(64px + env(safe-area-inset-bottom))!important;box-sizing:border-box!important;padding:3px 1% env(safe-area-inset-bottom)!important;align-items:center!important;justify-content:initial!important;background:#080808f5!important;border:0!important;border-top:1px solid #292929!important;backdrop-filter:blur(15px)!important;isolation:isolate!important}
.mobile-nav:before{content:""!important;position:absolute!important;z-index:0!important;top:5px!important;left:1%!important;width:19.6%!important;height:39px!important;border:0!important;border-radius:50%!important;outline:0!important;background:radial-gradient(ellipse at center,rgba(255,112,0,.30) 0%,rgba(255,112,0,.14) 42%,rgba(255,112,0,0) 76%)!important;box-shadow:none!important;filter:blur(2px)!important;transform:translateX(calc(var(--active-index,0)*100%))!important;transition:transform .62s cubic-bezier(.22,1.38,.42,1)!important;pointer-events:none!important}
.mobile-nav a{position:relative!important;z-index:1!important;isolation:isolate!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:1px!important;min-width:0!important;height:50px!important;color:#858585!important;transition:color .22s ease!important}
.mobile-nav svg{width:20px!important;height:20px!important;fill:none!important;stroke:currentColor!important;stroke-width:2!important;stroke-linecap:round!important;stroke-linejoin:round!important;filter:none!important}
.mobile-nav small{font-size:7.5px!important;letter-spacing:.2px!important;color:inherit!important;text-shadow:none!important}
.mobile-nav a:hover,.mobile-nav a.current{color:#00b8ff!important}.mobile-nav a.current:before{content:none!important;display:none!important}.mobile-nav a.current svg{filter:drop-shadow(0 0 2px rgba(255,135,0,.35))!important}
}
@media(prefers-reduced-motion:reduce){.mobile-nav:before{transition:none!important}}
</style>

<style id="GG_BOTTOM_GLOW_BLUE">.mobile-nav:before{background:radial-gradient(ellipse at center,rgba(0,184,255,.34) 0%,rgba(0,184,255,.15) 42%,rgba(0,184,255,0) 76%)!important}</style>

<style id="gg-bottom-nav-edge-fix">
/* Extiende la barra hasta el borde físico inferior, incluida la zona segura */
.mobile-nav{position:fixed!important;left:0!important;right:0!important;bottom:calc(-1 * env(safe-area-inset-bottom,0px))!important;inset-block-end:calc(-1 * env(safe-area-inset-bottom,0px))!important;margin:0!important;box-sizing:border-box!important;height:64px!important;padding:3px 1%!important;padding-bottom:3px!important;}
</style>
</head>
<body>
<main>
<a class="back" href="cuenta.html" aria-label="Atrás"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span>Atrás</span></a>
<p class="page-kicker">TU PERFIL</p>
<h1>MÉTODOS DE ACCESO</h1>
<section class="methods" aria-label="Métodos de acceso disponibles">
<div class="method">
<span class="method-icon" aria-hidden="true">
<svg class="google-icon" viewBox="0 0 48 48"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.9 1.3-4.1 2-6.8 2-5.2 0-9.6-3.5-11.2-8.2H5.9v5.2A20 20 0 0 0 24 44Z"/><path fill="#0582fb" d="M12.8 27.8a12 12 0 0 1 0-7.6V15H5.9a20 20 0 0 0 0 18Z"/><path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.9 15l6.9 5.2c1.6-4.7 6-8.1 11.2-8.1Z"/></svg>
</span>
<span class="method-copy"><strong>Google</strong><small>Acceso con tu cuenta de Google</small></span>
<button class="method-status is-loading" type="button" data-method-status="google" disabled>Comprobando...</button>
</div>
<div class="method">
<span class="method-icon" aria-hidden="true"><svg class="mail-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 25V8.5a2 2 0 0 1 3.2-1.6L16 13.5" fill="none" stroke="#EA4335" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 13.5 24.8 6.9A2 2 0 0 1 28 8.5V25" fill="none" stroke="#4285F4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 25V15" fill="none" stroke="#0481fb" stroke-width="3.4" stroke-linecap="round"/><path d="M28 15v10" fill="none" stroke="#34A853" stroke-width="3.4" stroke-linecap="round"/></svg></span>
<span class="method-copy"><strong>Correo electrónico</strong><small>Acceso con tu dirección de correo</small></span>
<button class="method-status is-loading" type="button" data-method-status="email" disabled>Comprobando...</button>
</div>
<div class="method">
<span class="method-icon" aria-hidden="true"><svg class="telegram-icon" viewBox="0 0 32 32"><path d="m28 5-4.2 22-8.1-6.2-4.5 4.3.6-7.3L25 8.2 9.2 18.1 4 16.3 28 5Z"/><path d="m11.8 17.8 4 3"/></svg></span>
<span class="method-copy"><strong>Telegram</strong><small>Acceso mediante tu cuenta de Telegram</small></span>
<button class="method-status is-loading" type="button" data-method-status="telegram" disabled>Comprobando...</button>
</div>
</section>
</main>
<nav class="mobile-nav" aria-label="Navegación inferior">
<a href="index.html" aria-label="Inicio"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><small>Inicio</small></a>
<a href="tienda.html" aria-label="Tienda"><svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11h-15L3 9Z"/><path d="M7 9 9 4h6l2 5M9 13v3m6-3v3"/></svg><small>Tienda</small></a>
<a href="revendedores.html" aria-label="Revendedores"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.4-5 6-5s6 1.7 6 5m1-10 2 2 4-4m-5 9h5"/></svg><small>Revendedores</small></a>
<a href="soporte.html" aria-label="Soporte"><svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 12H2v6h4v-6H4Zm16 0h2v6h-4v-6h2ZM18 19c-1 2-3 3-6 3"/></svg><small>Soporte</small></a>
<a class="current" href="cuenta.html" aria-label="Cuenta" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.4-6 8-6s7.3 2 8 6"/></svg><small>Cuenta</small></a>
</nav>
<script type="module">
import { supabase, SITE_URL } from "./supabase-client.js";

const statusElements = {
  google: document.querySelector('[data-method-status="google"]'),
  email: document.querySelector('[data-method-status="email"]'),
  telegram: document.querySelector('[data-method-status="telegram"]')
};

let currentUser = null;

function setStatus(method, verified) {
  const element = statusElements[method];
  if (!element) return;
  element.disabled = Boolean(verified);
  element.innerHTML = verified
    ? '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8.25" stroke="currentColor" stroke-width="1.7"/><path d="m6.1 10.1 2.5 2.5 5.3-5.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Verificado</span>'
    : '<span>Verificar</span>';
  element.classList.remove("is-loading", "is-verified", "is-unverified");
  element.classList.add(verified ? "is-verified" : "is-unverified");
}

function setBusy(method, message) {
  const element = statusElements[method];
  if (!element) return;
  element.disabled = true;
  element.textContent = message;
  element.classList.remove("is-unverified");
  element.classList.add("is-loading");
}

async function loadAccessMethods() {
  const { data: { user }, error } = await supabase.auth.getUser();

  if (error || !user) {
    Object.values(statusElements).forEach(element => {
      if (!element) return;
      element.textContent = "Inicia sesión";
      element.disabled = true;
      element.classList.remove("is-loading");
    });
    return;
  }

  currentUser = user;
  const identities = Array.isArray(user.identities) ? user.identities : [];
  const providers = Array.isArray(user.app_metadata?.providers)
    ? user.app_metadata.providers
    : [];
  const hasProvider = (...names) =>
    identities.some(identity => names.includes(identity.provider)) ||
    providers.some(provider => names.includes(provider));

  setStatus("google", hasProvider("google"));
  setStatus("email", Boolean(user.email_confirmed_at));
  setStatus("telegram", hasProvider("telegram", "custom:telegram"));
}

async function verifyMethod(method) {
  if (!currentUser) return;

  const element = statusElements[method];
  const redirectTo = SITE_URL + "metodos-acceso.html";

  try {
    if (method === "email") {
      let email = currentUser.email || "";
      if (!email) {
        email = (window.prompt("Escribe el correo electrónico que quieres vincular a tu cuenta:") || "").trim().toLowerCase();
        if (!email) return;
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          window.alert("Escribe una dirección de correo válida.");
          return;
        }
        setBusy(method, "Enviando...");
        const { error } = await supabase.auth.updateUser(
          { email },
          { emailRedirectTo: redirectTo }
        );
        if (error) throw error;
        window.alert("Te enviamos un enlace de verificación al nuevo correo. Ábrelo para confirmar la dirección.");
        return;
      }

      setBusy(method, "Enviando...");
      const { error } = await supabase.auth.resend({
        type: "signup",
        email,
        options: { emailRedirectTo: redirectTo }
      });
      if (error) throw error;
      window.alert("Te enviamos nuevamente el correo de verificación. Revisa tu bandeja de entrada y spam.");
      return;
    }

    const provider = method === "google" ? "google" : "custom:telegram";
    setBusy(method, "Abriendo...");
    const { error } = await supabase.auth.linkIdentity({
      provider,
      options: { redirectTo }
    });
    if (error) throw error;
  } catch (error) {
    console.error("Error al verificar método de acceso:", error);
    window.alert(error.message || "No se pudo iniciar la verificación. Inténtalo nuevamente.");
    await loadAccessMethods();
  } finally {
    if (element && element.classList.contains("is-loading")) {
      element.disabled = false;
      element.textContent = "Verificar";
      element.classList.remove("is-loading");
      element.classList.add("is-unverified");
    }
  }
}

Object.entries(statusElements).forEach(([method, element]) => {
  element.addEventListener("click", () => verifyMethod(method));
});

loadAccessMethods();
</script>
</body>
</html>
