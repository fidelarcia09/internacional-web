<style>
:root{--bg:#050b18;--orange:#00c6ff;--white:#f5f4f1;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#00c6ff12,transparent 42%),var(--bg);color:var(--white);font-family:var(--font);padding-bottom:80px}

.notice-card{display:flex;align-items:flex-start;gap:13px;padding:16px;border:1px solid #00c6ff78;border-radius:16px;background:linear-gradient(105deg,#0d2342,#081a35 65%);box-shadow:inset 0 0 16px #00c6ff0b}

<script type="module" id="notifications-runtime">
import { supabase } from "./supabase-client.js";

const list = document.getElementById("notice-list");

const pushToggle = document.getElementById("push-toggle");
const clearButton = document.getElementById("clear-notifications");
const clearStatus = document.getElementById("clear-status");
const pushStatus = document.getElementById("push-status");
const VAPID_PUBLIC_KEY = "BHTV5yJXTfvalz80W5gPYe9-T_-tTU1b6QmSRvYhfNENLq26R4QmjMzMHqkSqK8J66Ykeg54zslk4jQLFpeibjU";

function base64UrlToUint8Array(value) {
  const padding = "=".repeat((4 - value.length % 4) % 4);
  const base64 = (value + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from(raw, char => char.charCodeAt(0));
}

function setPushStatus(message, buttonText, disabled = false, hideButton = false, hideStatus = false) {
  pushStatus.textContent = message;
  pushStatus.hidden = hideStatus;
  pushToggle.textContent = buttonText;
  pushToggle.disabled = disabled;
  pushToggle.hidden = hideButton;
}

async function getPushRegistration() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    setPushStatus("Este navegador no admite notificaciones push web.", "No compatible", true);
    return null;
  }
  const registration = await navigator.serviceWorker.register("./sw.js");
  await navigator.serviceWorker.ready;
  return registration;
}

async function saveBrowserSubscription(subscription) {
  const data = subscription.toJSON();
  const { error } = await supabase.rpc("save_web_push_subscription", {
    p_endpoint: data.endpoint,
    p_p256dh: data.keys?.p256dh,
    p_auth: data.keys?.auth
  });
  if (error) throw error;
}

async function refreshPushStatus() {
  if (!currentUserId) return;
  // Mantener oculto cualquier texto de estado mientras se comprueba el dispositivo.
  setPushStatus("", "Activar notificaciones", false, true, true);
  if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
    setPushStatus("Tu navegador no permite recibir notificaciones push web.", "No compatible", true, false);
    return;
  }

  if (Notification.permission === "denied") {
    setPushStatus("El permiso está bloqueado. Cámbialo en los ajustes del navegador para recibir avisos.", "Permiso bloqueado", true, false);
    return;
  }

  try {
    const registration = await getPushRegistration();
    if (!registration) return;

    // Solo ocultamos el botón si el navegador conserva la suscripción
    // y Supabase confirma el registro de este dispositivo para la cuenta.
    if (Notification.permission !== "granted") {
      setPushStatus("Activa los avisos para recibir novedades de tu cuenta directamente en el teléfono.", "Activar notificaciones", false, false);
      return;
    }

    const subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      setPushStatus("Este dispositivo todavía no tiene una suscripción push activa.", "Activar notificaciones", false, false);
      return;
    }

    await saveBrowserSubscription(subscription);
    setPushStatus("", "Activar notificaciones", false, true, true);
  } catch (error) {
    console.error("No se pudo comprobar el registro push del dispositivo:", error);
    setPushStatus("No pudimos confirmar el registro de este dispositivo en Supabase. Puedes reintentarlo.", "Reintentar", false, false);
  }
}

async function enablePush() {
  pushToggle.disabled = true;
  try {
    if (!("Notification" in window)) {
      setPushStatus("Este navegador no admite notificaciones.", "No compatible", true);
      return;
    }

    const permission = Notification.permission === "granted"
      ? "granted"
      : await Notification.requestPermission();

    if (permission !== "granted") {
      if (permission === "denied") {
        setPushStatus("El permiso fue bloqueado. Actívalo desde los ajustes del navegador.", "Permiso bloqueado", true);
      } else {
        setPushStatus("No se activaron los avisos. Puedes permitirlos cuando quieras.", "Activar notificaciones");
      }
      return;
    }

    const registration = await getPushRegistration();
    if (!registration) return;

    let subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: base64UrlToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    await saveBrowserSubscription(subscription);
    setPushStatus("", "Activar notificaciones", false, true, true);
  } catch (error) {
    console.error("No se pudieron activar las notificaciones push:", error);
    setPushStatus("No se pudieron activar los avisos. Comprueba la conexión e inténtalo otra vez.", "Reintentar");
  } finally {
    if ("Notification" in window && Notification.permission !== "denied" && pushToggle.textContent !== "No compatible") {
      pushToggle.disabled = false;
    }
  }
}

async function disablePush() {
  pushToggle.disabled = true;
  try {
    const registration = await getPushRegistration();
    if (!registration) return;
    const subscription = await registration.pushManager.getSubscription();
    if (subscription) {
      const { error } = await supabase.rpc("remove_web_push_subscription", {
        p_endpoint: subscription.endpoint
      });
      if (error) throw error;
      await subscription.unsubscribe();
    }
    setPushStatus("Los avisos push están desactivados en este dispositivo.", "Activar notificaciones", false, false);
  } catch (error) {
    console.error("No se pudieron desactivar las notificaciones push:", error);
    setPushStatus("No se pudo desactivar este dispositivo. Inténtalo otra vez.", "Reintentar");
  } finally {
    pushToggle.disabled = false;
  }
}


let currentUserId = null;
let channel = null;

function makeEmpty(title, description) {
  const box = document.createElement("div");
  box.className = "empty-state";
  const icon = document.createElement("div");
  icon.className = "empty-icon";
  icon.setAttribute("aria-hidden", "true");
  icon.innerHTML = '<svg viewBox="0 0 36 36"><path d="M27 14a9 9 0 0 0-18 0c0 10-4 10-4 13h26c0-3-4-3-4-13ZM15 31h6"/></svg>';
  const heading = document.createElement("h2");
  heading.textContent = title;
  const copy = document.createElement("p");
  copy.textContent = description;
  box.append(icon, heading, copy);
  return box;
}

function formatTime(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "Fecha no disponible";
  return date.toLocaleString("es", {
    day: "2-digit", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });
}

function dayKey(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "sin-fecha" : date.toLocaleDateString("sv-SE");
}

function dayTitle(value) {
  if (value === "sin-fecha") return "Fecha no disponible";
  const date = new Date(value + "T12:00:00");
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);
  const same = (a, b) => a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (same(date, today)) return "Hoy";
  if (same(date, yesterday)) return "Ayer";
  return date.toLocaleDateString("es", {
    day: "numeric", month: "long", year: "numeric"
  });
}

function rechargeNotificationKind(row) {
  const type = String(row?.event_type || "").toLowerCase();
  const title = String(row?.title || "").toLowerCase();
  const text = type + " " + title;

  if (/(purchase|recharge|recarga)[_-]?(completed|complete|completad[oa])/.test(type) ||
      /recarga\s+completad[oa]|compra\s+completad[oa]/.test(title)) return "completed";
  if (/(purchase|recharge|recarga)[_-]?(failed|fallid[oa]|error)/.test(type) ||
      /recarga\s+fallid[oa]|compra\s+fallid[oa]/.test(title)) return "failed";
  if (/(purchase|recharge|recarga)[_-]?(received|created|pending|processing)/.test(type) ||
      /recarga\s+(recibida|recibido)|pedido\s+recibido|compra\s+recibida/.test(title)) return "received";
  return "";
}

function iconFor(type, kind = "") {
  if (kind === "received") {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m-4-4 4 4 4-4"/><path d="M4 15v5h16v-5"/></svg>';
  }
  if (kind === "completed" || type === "purchase_completed") {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.6 2.6L16.5 9"/></svg>';
  }
  if (kind === "failed" || type === "purchase_failed") {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg>';
  }
  if (type.startsWith("deposit_")) {
    return '<svg viewBox="0 0 24 24"><path d="M12 3v18m6-14H9a3 3 0 0 0 0 6h6a3 3 0 0 1 0 6H6"/></svg>';
  }
  if (type === "password_changed" || type.startsWith("two_factor_")) {
    return '<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 4v3"/></svg>';
  }
  return '<svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 1.9-1.4L22 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>';
}

function formatDepositMessage(value) {
  return String(value || "").replace(/(\\d+)[.,](\\d+)(?=\\s*(?:USDT|BSC-USD)\\b)/gi, (match, whole, fraction) => {
    const cleanFraction = fraction.replace(/0+$/, "");
    return cleanFraction ? whole + "." + cleanFraction : whole;
  });
}

function renderNotifications(rows) {
  clearButton.disabled = rows.length === 0;
  if (!rows.length) {
    list.replaceChildren(makeEmpty(
      "Todo al día",
      "Cuando haya novedades sobre tus compras, depósitos o la seguridad de tu cuenta, aparecerán aquí."
    ));
    return;
  }

  const groups = new Map();
  rows.forEach(row => {
    const key = dayKey(row.created_at);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  });

  const fragment = document.createDocumentFragment();
  groups.forEach((items, key) => {
    const group = document.createElement("section");
    group.className = "day-group";
    const heading = document.createElement("h2");
    heading.className = "day-label";
    heading.textContent = dayTitle(key);
    group.append(heading);

    items.forEach(row => {
      const card = document.createElement("article");
      card.className = "notice-card";
      const icon = document.createElement("div");
      const rechargeKind = rechargeNotificationKind(row);
      icon.className = "notice-icon" + (rechargeKind ? " is-recharge is-" + rechargeKind : "");
      icon.setAttribute("aria-hidden", "true");
      icon.innerHTML = iconFor(row.event_type, rechargeKind);

      const copy = document.createElement("div");
      copy.className = "notice-copy";
      const title = document.createElement("h3");
      title.className = "notice-title";
      title.textContent = row.title || "Actualización de compra";
      const message = document.createElement("p");
      message.className = "notice-message";
      message.textContent = row.event_type?.startsWith("deposit_") ? formatDepositMessage(row.message) : (row.message || "");
      const time = document.createElement("time");
      time.className = "notice-time";
      time.dateTime = row.created_at;
      time.textContent = formatTime(row.created_at);
      copy.append(title, message, time);
      card.append(icon, copy);
      group.append(card);
    });
    fragment.append(group);
  });
  list.replaceChildren(fragment);
}

async function loadNotifications(userId) {
  const { data, error } = await supabase
    .from("user_notifications")
    .select("id,event_type,title,message,created_at,read_at")
    .eq("user_id", userId)
    .order("created_at", { ascending: false })
    .limit(100);

  if (error) {
    console.error("No se pudieron cargar las notificaciones:", error);
    list.replaceChildren(makeEmpty(
      "No se pudieron cargar",
      "No fue posible consultar tus notificaciones. Inténtalo de nuevo en unos momentos."
    ));
    return;
  }
  renderNotifications(data || []);

  // Al entrar en Notificaciones, marcar como leídas todas las pendientes
  // del usuario autenticado. La política RLS limita la actualización a sus filas.
  const { error: readError } = await supabase
    .from("user_notifications")
    .update({ read_at: new Date().toISOString() })
    .eq("user_id", userId)
    .is("read_at", null);

  if (readError) {
    console.warn("No se pudieron marcar las notificaciones como leídas:", readError);
  }
}

async function init() {
  list.replaceChildren(makeEmpty("Cargando...", "Estamos buscando tus notificaciones."));
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error || !session?.user?.id) {
    window.location.replace("login.html");
    return;
  }

  currentUserId = session.user.id;
  await loadNotifications(currentUserId);
  await refreshPushStatus();

  channel = supabase
    .channel("user-notifications-page-" + currentUserId)
    .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "user_notifications",
      filter: "user_id=eq." + currentUserId
    }, () => loadNotifications(currentUserId))
    .subscribe();
}

clearButton.addEventListener("click", async () => {
  if (!currentUserId || clearButton.disabled) return;
  const confirmed = window.confirm("¿Quieres eliminar todas tus notificaciones? Esta acción no se puede deshacer.");
  if (!confirmed) return;

  clearButton.disabled = true;
  clearButton.textContent = "Limpiando...";
  clearStatus.textContent = "";
  try {
    const { error } = await supabase
      .from("user_notifications")
      .delete()
      .eq("user_id", currentUserId);
    if (error) throw error;
    list.replaceChildren(makeEmpty(
      "Todo al día",
      "Has limpiado tus notificaciones. Las próximas novedades aparecerán aquí."
    ));
    clearStatus.textContent = "Tus notificaciones se limpiaron correctamente.";
  } catch (error) {
    console.error("No se pudieron limpiar las notificaciones:", error);
    clearStatus.textContent = "No se pudieron limpiar tus notificaciones. Inténtalo de nuevo.";
    clearButton.disabled = false;
  } finally {
    clearButton.textContent = "Limpiar";
  }
});

pushToggle.addEventListener("click", async () => {
  if (pushToggle.textContent.includes("Desactivar")) {
    await disablePush();
  } else {
    await enablePush();
  }
});

init();
</script>
