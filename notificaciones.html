<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="Notificaciones de Internacional Web.">
<title>Notificaciones — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#090a0d;--orange:#ff7900;--white:#f5f4f1;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#ff790012,transparent 42%),var(--bg);color:var(--white);font-family:var(--font);padding-bottom:80px}
a{color:inherit;text-decoration:none}
main{width:min(92%,760px);margin:25px auto 38px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:27px}
.page-kicker{color:var(--orange);font-size:9px;font-weight:800;letter-spacing:2px;margin:0 0 7px}
h1{font:900 clamp(39px,8vw,54px)/.92 var(--display);letter-spacing:.4px;margin:0}
.notice-list{display:flex;flex-direction:column;gap:24px}
.day-group{display:flex;flex-direction:column;gap:11px}
.day-label{margin:0;color:#f5f4f1;font-size:13px;font-weight:800;letter-spacing:.2px}
.notice-card{display:flex;align-items:flex-start;gap:13px;padding:16px;border:1px solid #ff790078;border-radius:16px;background:linear-gradient(105deg,#17110c,#0d0e11 65%);box-shadow:inset 0 0 16px #ff79000b}
.notice-icon{width:39px;height:39px;flex:0 0 39px;border:1px solid #ff79005c;border-radius:12px;background:radial-gradient(circle,#ff790020,#111114 72%);display:grid;place-items:center;color:#ff922e}
.notice-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.notice-copy{min-width:0;flex:1}
.notice-title{margin:1px 0 5px;font-size:12px;font-weight:800;color:#f5f4f1}
.notice-message{margin:0;color:#92959e;font-size:10px;line-height:1.65}
.notice-time{display:block;margin-top:8px;color:#777b85;font-size:9px}
.push-description{margin:9px 0 0;color:#92959e;font-size:10px;line-height:1.6;max-width:390px}
.push-button{flex:0 0 auto;min-height:42px;padding:0 15px;border:1px solid #ff790078;border-radius:12px;background:linear-gradient(110deg,#ff7900,#ff9b35);color:#17100a;font:800 10px var(--font);letter-spacing:.2px;cursor:pointer;box-shadow:0 5px 18px #ff79001c}
.push-button:disabled{opacity:.65;cursor:default}.push-button[hidden]{display:none!important}
@media(max-width:520px){.page-head{align-items:flex-start;flex-direction:column}.push-button{width:100%}.push-description{max-width:none}}

.empty-state{min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 18px}
.empty-icon{width:74px;height:74px;margin:0 auto 18px;border:1px solid #ff79005c;border-radius:23px;background:radial-gradient(circle,#ff790020,#111114 72%);display:grid;place-items:center;color:#ff922e;box-shadow:0 0 24px #ff790012}
.empty-icon svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty-state h2{font-size:17px;margin:0 0 8px;font-weight:800}
.empty-state p{max-width:300px;font-size:11px;line-height:1.7;color:#92959e;margin:0}
.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:65px;background:#101217f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;height:60px;color:#777}
.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav small{font-size:8px;letter-spacing:.2px}
.mobile-nav a.current{color:var(--orange)}
.mobile-nav a.current:before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:66px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#ff700059 0%,#ff700026 42%,transparent 75%);filter:blur(5px)}
.mobile-nav a.current svg{filter:drop-shadow(0 0 4px #ff7d00) drop-shadow(0 0 9px #ff690073)}
.mobile-nav a.current small{text-shadow:0 0 8px #ff780059}
@media(max-width:520px){main{width:90%;margin:20px auto 28px}.page-head{margin-bottom:22px}h1{font-size:clamp(37px,10vw,46px)}.page-kicker{font-size:8px}.empty-state{min-height:290px}.notice-card{padding:13px 12px;border-radius:14px}.notice-icon{width:36px;height:36px;flex-basis:36px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
<style id="mobile-nav-final-unified">
@media(max-width:620px){
.mobile-nav{position:fixed!important;z-index:10!important;left:0!important;right:0!important;bottom:0!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:0!important;height:calc(64px + env(safe-area-inset-bottom))!important;box-sizing:border-box!important;padding:3px 1% env(safe-area-inset-bottom)!important;align-items:center!important;justify-content:initial!important;background:#080808f5!important;border:0!important;border-top:1px solid #292929!important;backdrop-filter:blur(15px)!important;isolation:isolate!important}
.mobile-nav:before{content:""!important;position:absolute!important;z-index:0!important;top:5px!important;left:1%!important;width:19.6%!important;height:39px!important;border:0!important;border-radius:50%!important;outline:0!important;background:radial-gradient(ellipse at center,rgba(255,112,0,.30) 0%,rgba(255,112,0,.14) 42%,rgba(255,112,0,0) 76%)!important;box-shadow:none!important;filter:blur(2px)!important;transform:translateX(calc(var(--active-index,0)*100%))!important;transition:transform .62s cubic-bezier(.22,1.38,.42,1)!important;pointer-events:none!important}
.mobile-nav a{position:relative!important;z-index:1!important;isolation:isolate!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:1px!important;min-width:0!important;height:50px!important;color:#858585!important;transition:color .22s ease!important}
.mobile-nav svg{width:20px!important;height:20px!important;fill:none!important;stroke:currentColor!important;stroke-width:2!important;stroke-linecap:round!important;stroke-linejoin:round!important;filter:none!important}
.mobile-nav small{font-size:7.5px!important;letter-spacing:.2px!important;color:inherit!important;text-shadow:none!important}
.mobile-nav a:hover,.mobile-nav a.current{color:#ff8700!important}.mobile-nav a.current:before{content:none!important;display:none!important}.mobile-nav a.current svg{filter:drop-shadow(0 0 2px rgba(255,135,0,.35))!important}
}
@media(prefers-reduced-motion:reduce){.mobile-nav:before{transition:none!important}}
</style>
</head>
<body>
<main>
<header class="page-head">
<div><h1>NOTIFICACIONES</h1><p class="push-description" id="push-status" aria-live="polite">Comprobando si este dispositivo ya tiene las notificaciones activadas.</p></div>
<button class="push-button" id="push-toggle" type="button" hidden>Activar notificaciones</button>
</header>
<section class="notice-list" id="notice-list" aria-live="polite">
<div class="empty-state" id="empty-state">
<div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M27 14a9 9 0 0 0-18 0c0 10-4 10-4 13h26c0-3-4-3-4-13ZM15 31h6"/></svg></div>
<h2>Todo al día</h2>
<p>Cuando tengas novedades, avisos o actualizaciones, aparecerán aquí organizados por día.</p>
</div>
</section>
</main>
<nav class="mobile-nav" aria-label="Navegación inferior">
<a href="index.html" aria-label="Inicio"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><small>Inicio</small></a>
<a href="tienda.html" aria-label="Tienda"><svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11h-15L3 9Z"/><path d="M7 9 9 4h6l2 5M9 13v3m6-3v3"/></svg><small>Tienda</small></a>
<a href="revendedores.html" aria-label="Revendedores"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.4-5 6-5s6 1.7 6 5m1-10 2 2 4-4m-5 9h5"/></svg><small>Revendedores</small></a>
<a href="soporte.html" aria-label="Soporte"><svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2"/><path d="M4 12H2v6h4v-6H4Zm16 0h2v6h-4v-6h2ZM18 19c-1 2-3 3-6 3"/></svg><small>Soporte</small></a>
<a href="cuenta.html" aria-label="Cuenta"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.4-6 8-6s7.3 2 8 6"/></svg><small>Cuenta</small></a>
</nav>

<script type="module" id="notifications-runtime">
import { supabase } from "./supabase-client.js";

const list = document.getElementById("notice-list");

const pushToggle = document.getElementById("push-toggle");
const pushStatus = document.getElementById("push-status");
const VAPID_PUBLIC_KEY = "BHTV5yJXTfvalz80W5gPYe9-T_-tTU1b6QmSRvYhfNENLq26R4QmjMzMHqkSqK8J66Ykeg54zslk4jQLFpeibjU";

function base64UrlToUint8Array(value) {
  const padding = "=".repeat((4 - value.length % 4) % 4);
  const base64 = (value + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from(raw, char => char.charCodeAt(0));
}

function setPushStatus(message, buttonText, disabled = false, hideButton = false) {
  pushStatus.textContent = message;
  pushToggle.textContent = buttonText;
  pushToggle.disabled = disabled;
  pushToggle.hidden = hideButton;
}

async function getPushRegistration() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    setPushStatus("Este navegador no admite notificaciones push web.", "No compatible", true);
    return null;
  }
  const registration = await navigator.serviceWorker.register("./sw.js");
  await navigator.serviceWorker.ready;
  return registration;
}

async function saveBrowserSubscription(subscription) {
  const data = subscription.toJSON();
  const { error } = await supabase.rpc("save_web_push_subscription", {
    p_endpoint: data.endpoint,
    p_p256dh: data.keys?.p256dh,
    p_auth: data.keys?.auth
  });
  if (error) throw error;
}

async function refreshPushStatus() {
  if (!currentUserId) return;
  if (!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)) {
    setPushStatus("Tu navegador no permite recibir notificaciones push web.", "No compatible", true, false);
    return;
  }

  if (Notification.permission === "denied") {
    setPushStatus("El permiso está bloqueado. Cámbialo en los ajustes del navegador para recibir avisos.", "Permiso bloqueado", true, false);
    return;
  }

  try {
    const registration = await getPushRegistration();
    if (!registration) return;

    // Solo ocultamos el botón si el navegador conserva la suscripción
    // y Supabase confirma el registro de este dispositivo para la cuenta.
    if (Notification.permission !== "granted") {
      setPushStatus("Activa los avisos para recibir novedades de tu cuenta directamente en el teléfono.", "Activar notificaciones", false, false);
      return;
    }

    const subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      setPushStatus("Este dispositivo todavía no tiene una suscripción push activa.", "Activar notificaciones", false, false);
      return;
    }

    await saveBrowserSubscription(subscription);
    setPushStatus("Este dispositivo ya tiene las notificaciones activadas y registradas.", "Activar notificaciones", false, true);
  } catch (error) {
    console.error("No se pudo comprobar el registro push del dispositivo:", error);
    setPushStatus("No pudimos confirmar el registro de este dispositivo en Supabase. Puedes reintentarlo.", "Reintentar", false, false);
  }
}

async function enablePush() {
  pushToggle.disabled = true;
  try {
    if (!("Notification" in window)) {
      setPushStatus("Este navegador no admite notificaciones.", "No compatible", true);
      return;
    }

    const permission = Notification.permission === "granted"
      ? "granted"
      : await Notification.requestPermission();

    if (permission !== "granted") {
      if (permission === "denied") {
        setPushStatus("El permiso fue bloqueado. Actívalo desde los ajustes del navegador.", "Permiso bloqueado", true);
      } else {
        setPushStatus("No se activaron los avisos. Puedes permitirlos cuando quieras.", "Activar notificaciones");
      }
      return;
    }

    const registration = await getPushRegistration();
    if (!registration) return;

    let subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: base64UrlToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    await saveBrowserSubscription(subscription);
    setPushStatus("Este dispositivo ya tiene las notificaciones activadas y registradas.", "Activar notificaciones", false, true);
  } catch (error) {
    console.error("No se pudieron activar las notificaciones push:", error);
    setPushStatus("No se pudieron activar los avisos. Comprueba la conexión e inténtalo otra vez.", "Reintentar");
  } finally {
    if ("Notification" in window && Notification.permission !== "denied" && pushToggle.textContent !== "No compatible") {
      pushToggle.disabled = false;
    }
  }
}

async function disablePush() {
  pushToggle.disabled = true;
  try {
    const registration = await getPushRegistration();
    if (!registration) return;
    const subscription = await registration.pushManager.getSubscription();
    if (subscription) {
      const { error } = await supabase.rpc("remove_web_push_subscription", {
        p_endpoint: subscription.endpoint
      });
      if (error) throw error;
      await subscription.unsubscribe();
    }
    setPushStatus("Los avisos push están desactivados en este dispositivo.", "Activar notificaciones", false, false);
  } catch (error) {
    console.error("No se pudieron desactivar las notificaciones push:", error);
    setPushStatus("No se pudo desactivar este dispositivo. Inténtalo otra vez.", "Reintentar");
  } finally {
    pushToggle.disabled = false;
  }
}


let currentUserId = null;
let channel = null;

function makeEmpty(title, description) {
  const box = document.createElement("div");
  box.className = "empty-state";
  const icon = document.createElement("div");
  icon.className = "empty-icon";
  icon.setAttribute("aria-hidden", "true");
  icon.innerHTML = '<svg viewBox="0 0 36 36"><path d="M27 14a9 9 0 0 0-18 0c0 10-4 10-4 13h26c0-3-4-3-4-13ZM15 31h6"/></svg>';
  const heading = document.createElement("h2");
  heading.textContent = title;
  const copy = document.createElement("p");
  copy.textContent = description;
  box.append(icon, heading, copy);
  return box;
}

function formatTime(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "Fecha no disponible";
  return date.toLocaleString("es", {
    day: "2-digit", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });
}

function dayKey(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "sin-fecha" : date.toLocaleDateString("sv-SE");
}

function dayTitle(value) {
  if (value === "sin-fecha") return "Fecha no disponible";
  const date = new Date(value + "T12:00:00");
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);
  const same = (a, b) => a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (same(date, today)) return "Hoy";
  if (same(date, yesterday)) return "Ayer";
  return date.toLocaleDateString("es", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });
}

function iconFor(type) {
  if (type.startsWith("deposit_")) {
    return '<svg viewBox="0 0 24 24"><path d="M12 3v18m6-14H9a3 3 0 0 0 0 6h6a3 3 0 0 1 0 6H6"/></svg>';
  }
  if (type === "password_changed" || type.startsWith("two_factor_")) {
    return '<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 4v3"/></svg>';
  }
  if (type === "purchase_completed") {
    return '<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/><circle cx="12" cy="12" r="9"/></svg>';
  }
  if (type === "purchase_failed") {
    return '<svg viewBox="0 0 24 24"><path d="M12 8v5m0 4h.01"/><path d="M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>';
  }
  return '<svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 1.9-1.4L22 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>';
}

function renderNotifications(rows) {
  if (!rows.length) {
    list.replaceChildren(makeEmpty(
      "Todo al día",
      "Cuando haya novedades sobre tus compras, depósitos o la seguridad de tu cuenta, aparecerán aquí."
    ));
    return;
  }

  const groups = new Map();
  rows.forEach(row => {
    const key = dayKey(row.created_at);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  });

  const fragment = document.createDocumentFragment();
  groups.forEach((items, key) => {
    const group = document.createElement("section");
    group.className = "day-group";
    const heading = document.createElement("h2");
    heading.className = "day-label";
    heading.textContent = dayTitle(key);
    group.append(heading);

    items.forEach(row => {
      const card = document.createElement("article");
      card.className = "notice-card";
      const icon = document.createElement("div");
      icon.className = "notice-icon";
      icon.setAttribute("aria-hidden", "true");
      icon.innerHTML = iconFor(row.event_type);

      const copy = document.createElement("div");
      copy.className = "notice-copy";
      const title = document.createElement("h3");
      title.className = "notice-title";
      title.textContent = row.title || "Actualización de compra";
      const message = document.createElement("p");
      message.className = "notice-message";
      message.textContent = row.message || "";
      const time = document.createElement("time");
      time.className = "notice-time";
      time.dateTime = row.created_at;
      time.textContent = formatTime(row.created_at);
      copy.append(title, message, time);
      card.append(icon, copy);
      group.append(card);
    });
    fragment.append(group);
  });
  list.replaceChildren(fragment);
}

async function loadNotifications(userId) {
  const { data, error } = await supabase
    .from("user_notifications")
    .select("id,event_type,title,message,created_at,read_at")
    .eq("user_id", userId)
    .order("created_at", { ascending: false })
    .limit(100);

  if (error) {
    console.error("No se pudieron cargar las notificaciones:", error);
    list.replaceChildren(makeEmpty(
      "No se pudieron cargar",
      "No fue posible consultar tus notificaciones. Inténtalo de nuevo en unos momentos."
    ));
    return;
  }
  renderNotifications(data || []);

  // Al entrar en Notificaciones, marcar como leídas todas las pendientes
  // del usuario autenticado. La política RLS limita la actualización a sus filas.
  const { error: readError } = await supabase
    .from("user_notifications")
    .update({ read_at: new Date().toISOString() })
    .eq("user_id", userId)
    .is("read_at", null);

  if (readError) {
    console.warn("No se pudieron marcar las notificaciones como leídas:", readError);
  }
}

async function init() {
  list.replaceChildren(makeEmpty("Cargando...", "Estamos buscando tus notificaciones."));
  const { data: { session }, error } = await supabase.auth.getSession();
  if (error || !session?.user?.id) {
    window.location.replace("login.html");
    return;
  }

  currentUserId = session.user.id;
  await loadNotifications(currentUserId);
  await refreshPushStatus();

  channel = supabase
    .channel("user-notifications-page-" + currentUserId)
    .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "user_notifications",
      filter: "user_id=eq." + currentUserId
    }, () => loadNotifications(currentUserId))
    .subscribe();
}

pushToggle.addEventListener("click", async () => {
  if (pushToggle.textContent.includes("Desactivar")) {
    await disablePush();
  } else {
    await enablePush();
  }
});

init();
</script>

</body>
