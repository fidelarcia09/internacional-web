<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="Tu cuenta de Internacional Web.">
<title>Mi cuenta — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0d;--panel:#111318;--orange:#ff7900;--white:#f5f4f1;--muted:#9699a2;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#ff790012,transparent 42%),var(--bg);color:var(--white);font-family:var(--font);padding-bottom:75px}
a{color:inherit;text-decoration:none}
.topbar{height:76px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#090a0deF;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;letter-spacing:1px}.brand small{display:block;color:#888;font-size:8px;letter-spacing:2px;margin-top:4px}
.mark{width:36px;height:36px;border:1px solid var(--orange);display:grid;place-items:center;font:800 20px var(--display);letter-spacing:-2px;transform:skew(-7deg)}.mark span{color:var(--orange)}
.back{font-size:10px;color:#bbb;border:1px solid #34363d;border-radius:22px;padding:10px 15px}.back b{color:var(--orange);margin-right:7px}
main{width:min(90%,510px);margin:22px auto 35px}
.page-kicker{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--orange);text-align:center;margin:0 0 9px}
h1{font:900 clamp(42px,10vw,58px)/.95 var(--display);text-align:center;margin:0 0 25px;letter-spacing:.5px}
.account-panel{position:relative;isolation:isolate;overflow:hidden;padding:4px 0 0;border:0;border-radius:0;background:transparent;box-shadow:none}
.account-panel:before{content:"";position:absolute;z-index:-1;inset:-2px;background:radial-gradient(ellipse at 50% 0%,#ff79002b,transparent 54%);pointer-events:none}
.profile{display:flex;align-items:center;gap:17px;padding:2px 3px 22px}
.avatar{width:92px;height:92px;flex:0 0 92px;border:2px solid var(--orange);border-radius:50%;display:grid;place-items:center;color:var(--orange);background:radial-gradient(circle,#ff790022,#08090c 70%);box-shadow:0 0 18px #ff790022}
.avatar svg{width:58px;height:58px;fill:currentColor}
.profile h2{font-size:clamp(19px,5vw,25px);margin:0 0 7px;letter-spacing:-.7px;overflow-wrap:anywhere}
.profile p{font-size:13px;color:#aeb0b7;margin:0}
.balance{min-height:116px;display:flex;align-items:center;gap:17px;padding:17px;border:1px solid #ff7900;border-radius:20px;background:linear-gradient(110deg,#17110b,#0c0c0e 65%);box-shadow:inset 0 0 22px #ff790018,0 0 15px #ff790018}
.diamond{width:58px;height:58px;flex:0 0 58px;color:#ff9a16;filter:drop-shadow(0 0 7px #ff790055)}
.balance small{display:block;color:#ddd;font-size:14px;margin-bottom:5px}
.balance strong{display:block;font-size:clamp(22px,6vw,31px);letter-spacing:.2px;white-space:nowrap}
.balance strong span{color:#ff941c}
.account-links{display:grid;gap:11px;margin-top:20px}
.account-links a{min-height:66px;display:grid;grid-template-columns:44px 1fr 22px;align-items:center;gap:14px;padding:10px 16px;border:1px solid #ff790078;border-radius:16px;background:linear-gradient(100deg,#17110c,#0d0e11 60%);box-shadow:inset 0 0 13px #ff79000b;transition:transform .18s,border-color .18s,box-shadow .18s}
.account-links a:hover{transform:translateY(-2px);border-color:#ff9a22;box-shadow:0 0 14px #ff790020}
.link-icon{width:39px;height:39px;display:grid;place-items:center;color:#ff8a00}
.link-icon svg{width:31px;height:31px;fill:currentColor;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.account-links a>span:nth-child(2){font-size:15px;font-weight:600}
.arrow{font-size:31px;line-height:1;color:#ff8a00;text-align:right;font-weight:400}
.account-links .logout{background:#111114;border-color:#ffffff25;box-shadow:none}
.account-links .logout .link-icon,.account-links .logout .arrow{color:#b6b6bb}
.note{text-align:center;color:#737680;font-size:9px;line-height:1.6;margin:17px 10px 0}
.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:65px;background:#101217f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;height:60px;color:#777}
.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav small{font-size:8px;letter-spacing:.2px}
.mobile-nav a.current{color:var(--orange)}
.mobile-nav a.current:before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:66px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse, #ff700059 0%,#ff700026 42%,transparent 75%);filter:blur(5px)}
.mobile-nav a.current svg{filter:drop-shadow(0 0 4px #ff7d00) drop-shadow(0 0 9px #ff690073)}
.mobile-nav a.current small{text-shadow:0 0 8px #ff780059}
@media(max-width:620px){body{padding-bottom:75px}main{margin:16px auto 28px;width:90%}.account-panel{padding:2px 0 0}.profile{gap:13px;padding-bottom:17px}.avatar{width:76px;height:76px;flex-basis:76px}.avatar svg{width:49px;height:49px}.balance{min-height:100px;padding:13px;gap:12px;border-radius:17px}.diamond{width:48px;height:48px;flex-basis:48px}.account-links{gap:9px;margin-top:15px}.account-links a{min-height:60px;padding:8px 12px;border-radius:14px}.account-links a>span:nth-child(2){font-size:13px}.link-icon{width:35px;height:35px}.link-icon svg{width:28px;height:28px}}
@media(min-width:800px){main{margin-top:28px}.account-panel{padding:4px 0 0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

</div>
</section>
