<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<meta name="description" content="Tu cuenta de Internacional Web.">
<title>Mi cuenta — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b18;--panel:#081a35;--orange:#00c6ff;--white:#f5f4f1;--muted:#9699a2;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#00c6ff12,transparent 42%),var(--bg);color:var(--white);font-family:var(--font);padding-bottom:75px}
a{color:inherit;text-decoration:none}
.topbar{height:76px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#090a0deF;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;letter-spacing:1px}.brand small{display:block;color:#888;font-size:8px;letter-spacing:2px;margin-top:4px}
.mark{width:36px;height:36px;border:1px solid var(--orange);display:grid;place-items:center;font:800 20px var(--display);letter-spacing:-2px;transform:skew(-7deg)}.mark span{color:var(--orange)}
.back{font-size:10px;color:#bbb;border:1px solid #34363d;border-radius:22px;padding:10px 15px}.back b{color:var(--orange);margin-right:7px}
main{width:min(90%,510px);margin:22px auto 35px}
.account-heading{display:table;width:auto;font:900 clamp(39px,10vw,56px)/.95 var(--display);letter-spacing:.4px;color:var(--white);text-align:left;text-transform:uppercase;margin:0 0 16px;padding:0}
.page-kicker{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--orange);text-align:center;margin:0 0 9px}
h1{font:900 clamp(42px,10vw,58px)/.95 var(--display);text-align:center;margin:0 0 25px;letter-spacing:.5px}
.account-panel{position:relative;isolation:isolate;overflow:hidden;padding:17px;border:1px solid #24efff;border-radius:24px;background:linear-gradient(145deg,#0d2342 0%,#081a35 58%,#0e1617 100%);box-shadow:0 14px 34px #0008,0 0 22px #24efff18,inset 0 1px 0 #ffffff0c}
.account-panel:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 12% 0%,#24efff26,transparent 52%);pointer-events:none}
.profile{display:flex;align-items:center;gap:17px;padding:2px 2px 19px}
.avatar{position:relative;width:82px;height:82px;flex:0 0 82px;border:1.5px solid var(--orange);border-radius:50%;display:grid;place-items:center;overflow:visible;color:var(--orange);background:radial-gradient(circle,#24efff30,#050b18 72%);box-shadow:0 0 22px #24efff26,inset 0 0 13px #24efff12}
.avatar svg{width:53px;height:53px;fill:currentColor}
.avatar-image{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}.avatar-image[hidden]{display:none}
.avatar-upload{position:absolute;right:-4px;bottom:-3px;width:29px;height:29px;display:grid;place-items:center;border:2px solid #081a35;border-radius:50%;background:linear-gradient(135deg,#2eacff,#00c6ff);color:#081a35;cursor:pointer;box-shadow:0 2px 9px #0009;z-index:2}
.avatar-upload svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar-upload:disabled{opacity:.55;cursor:wait}
.profile-info{min-width:0;flex:1}
.profile h2{font-size:clamp(19px,5vw,25px);margin:0 0 8px;letter-spacing:-.7px;overflow-wrap:anywhere}
.profile-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.user-id{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#b5b7bf;margin:0;letter-spacing:.35px}
.copy-id{width:27px;height:27px;display:inline-grid;place-items:center;border:1px solid #ffffff20;border-radius:8px;background:#ffffff08;color:#45e9ff;cursor:pointer}
.copy-id svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.account-status{display:inline-flex;align-items:center;gap:6px;margin-top:0;margin-left:auto;padding:6px 10px;border:1px solid #26a17b55;border-radius:20px;background:#26a17b15;color:#63d5a9;font-size:10px;font-weight:700;letter-spacing:.35px}
.account-status:before{display:none}.account-status svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.account-status.pending{border-color:#3ba6e455;background:#3ba6e412;color:#68bcef}
.balance{min-height:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px 0;border:0;border-top:1px solid #ffffff19;border-radius:0;background:transparent;box-shadow:none}
.balance small{display:block;color:#bfc0c5;font-size:12px;margin-bottom:5px}
.balance strong{display:block;font-size:clamp(23px,6vw,31px);letter-spacing:.2px;white-space:nowrap}
.balance strong span{color:#45e9ff}
.add-usdt{display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;gap:6px;width:auto;min-height:34px;margin:0;padding:0 11px;border:1px solid #42d6ff;border-radius:10px;background:linear-gradient(100deg,#2eacff,#21d7ff 60%,#25bdff);color:#081a35;font-size:10px;font-weight:800;white-space:nowrap;box-shadow:0 0 12px #00c6ff18}.add-usdt svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.copy-feedback{font-size:10px;color:#63d5a9;min-height:12px;margin-top:4px}
.account-links{display:grid;gap:11px;margin-top:20px}
.account-links a[hidden]{display:none!important}
.account-links a{min-height:66px;display:grid;grid-template-columns:44px 1fr 22px;align-items:center;gap:14px;padding:10px 16px;border:1px solid #00c6ff78;border-radius:16px;background:linear-gradient(100deg,#0d2342,#081a35 60%);box-shadow:inset 0 0 13px #00c6ff0b;transition:transform .18s,border-color .18s,box-shadow .18s}
.account-links a:hover{transform:translateY(-2px);border-color:#22beff;box-shadow:0 0 14px #00c6ff20}
.link-icon{width:39px;height:39px;display:grid;place-items:center;color:#c8cbd2}
.link-icon svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.link-icon svg .accent{stroke:#2ecfff}
.link-icon svg .soft{stroke:#858b96}
.account-links a>span:nth-child(2){font-size:15px;font-weight:600}
.arrow{font-size:31px;line-height:1;color:#00b5ff;text-align:right;font-weight:400}
.account-links .logout{background:#081a35;border-color:#ffffff25;box-shadow:none}
.account-links .logout .link-icon,.account-links .logout .arrow{color:#b6b6bb}
.note{text-align:center;color:#737680;font-size:9px;line-height:1.6;margin:17px 10px 0}
.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:65px;background:#101217f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;height:60px;color:#777}
.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav small{font-size:8px;letter-spacing:.2px}
.mobile-nav a.current{color:var(--orange)}
.mobile-nav a.current:before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:66px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse, #00cfff59 0%,#00cfff26 42%,transparent 75%);filter:blur(5px)}
.mobile-nav a.current svg{filter:drop-shadow(0 0 4px #00c2ff) drop-shadow(0 0 9px #00d6ff73)}
.mobile-nav a.current small{text-shadow:0 0 8px #00c7ff59}
@media(max-width:620px){body{padding-top:9px;padding-bottom:75px}main{margin:16px auto 28px;width:94%}.account-heading{font-size:clamp(39px,10vw,56px);margin-bottom:14px}.account-panel{padding:14px;border-radius:20px}.profile{gap:13px;padding-bottom:15px}.avatar{width:70px;height:70px;flex-basis:70px}.avatar svg{width:45px;height:45px}.avatar-upload{width:27px;height:27px;right:-3px;bottom:-3px}.balance{min-height:0;padding:12px 1px 0;gap:10px}.add-usdt{min-height:32px;padding:0 9px;font-size:9px}.profile-meta{gap:6px}.account-links{gap:9px;margin-top:15px}.account-links a{min-height:60px;padding:8px 12px;border-radius:14px}.account-links a>span:nth-child(2){font-size:13px}.link-icon{width:35px;height:35px}.link-icon svg{width:28px;height:28px}}
@media(min-width:800px){main{margin-top:28px}.account-panel{padding:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

@media(max-width:620px){.mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:5px 1%;align-items:center}.mobile-nav:before{content:"";position:absolute;z-index:0;top:9px;left:1%;width:19.6%;height:54px;border:1px solid #00b8ff;border-radius:15px;box-shadow:0 0 13px #00c6ff2b,inset 0 0 12px #00c6ff18;transform:translateX(calc(var(--active-index,4)*100%));transition:transform .34s cubic-bezier(.2,.8,.2,1);pointer-events:none}.mobile-nav a{z-index:1;min-width:0}}
@media(prefers-reduced-motion:reduce){.mobile-nav:before{transition:none!important}}

/* Navegación inferior unificada: mismo diseño que Inicio */
@media(max-width:620px){
 .mobile-nav{position:fixed!important;z-index:10!important;left:0!important;right:0!important;bottom:0!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:0!important;height:76px!important;padding:5px 1%!important;padding-bottom:env(safe-area-inset-bottom)!important;align-items:center!important;justify-content:initial!important;background:#101217f5!important;border-top:1px solid rgba(255,255,255,.09)!important;backdrop-filter:blur(15px)!important}
 .mobile-nav:before{content:""!important;position:absolute!important;z-index:0!important;top:9px!important;left:1%!important;width:19.6%!important;height:54px!important;border:0!important;border-radius:50%!important;background:radial-gradient(ellipse,#00c6ff44 0%,#00c6ff20 48%,transparent 76%)!important;box-shadow:none!important;transform:translateX(calc(var(--active-index,0)*100%))!important;transition:transform .34s cubic-bezier(.2,.8,.2,1)!important;pointer-events:none!important}
 .mobile-nav a{position:relative!important;z-index:1!important;isolation:isolate!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:2px!important;min-width:0!important;height:60px!important;color:#777!important}
 .mobile-nav svg{width:23px!important;height:23px!important;fill:none!important;stroke:currentColor!important;stroke-width:2!important;stroke-linecap:round!important;stroke-linejoin:round!important}
 .mobile-nav small{font-size:8px!important;letter-spacing:.2px!important}
 .mobile-nav a:hover,.mobile-nav a.current{color:#24efff!important}
 .mobile-nav a.current:before{content:""!important;position:absolute!important;z-index:-1!important;top:3px!important;left:50%!important;width:66px!important;height:44px!important;inset:3px auto auto 50%!important;transform:translateX(-50%)!important;border:0!important;border-radius:50%!important;background:radial-gradient(ellipse at center,rgba(255,112,0,.34) 0%,rgba(255,112,0,.15) 38%,rgba(255,112,0,0) 74%)!important;box-shadow:none!important;filter:blur(5px)!important;opacity:1!important;pointer-events:none!important}
 .mobile-nav a.current svg{filter:drop-shadow(0 0 4px rgba(255,125,0,.9)) drop-shadow(0 0 10px rgba(255,105,0,.45))!important}
 .mobile-nav a.current small{text-shadow:0 0 8px rgba(255,120,0,.35)!important}
}
@media(prefers-reduced-motion:reduce){.mobile-nav:before{transition:none!important}}

/* El brillo móvil es una única pieza que viaja; nunca quedan dos selecciones */
@media(max-width:620px){
 .mobile-nav a.current:before{content:none!important;display:none!important}
 .mobile-nav:before{transition:transform .36s cubic-bezier(.22,.75,.25,1)!important;will-change:transform}
}

/* Foto de perfil: control compacto estilo Facebook */
.avatar{cursor:pointer; -webkit-tap-highlight-color:transparent}
.avatar.has-photo{cursor:pointer}
.avatar-upload{right:-2px;bottom:-2px;width:30px;height:30px;border:3px solid #081a35;background:#f5f5f5;color:#242424;box-shadow:0 2px 8px #0009}
.avatar-upload svg{width:15px;height:15px}
.avatar-upload[hidden]{display:none!important}
.avatar-actions{position:absolute;z-index:5;left:50%;top:calc(100% + 10px);transform:translateX(-50%);width:174px;padding:6px;border:1px solid #ffffff20;border-radius:12px;background:#0d2342;box-shadow:0 10px 28px #000b}
.avatar-actions[hidden]{display:none!important}
.avatar-actions button{width:100%;display:flex;align-items:center;gap:9px;padding:10px;border:0;border-radius:8px;background:transparent;color:#f5f4f1;text-align:left;font:600 11px var(--font);cursor:pointer}
.avatar-actions button:active,.avatar-actions button:hover{background:#ffffff12}
.avatar-actions svg{width:16px;height:16px;fill:none;stroke:#2ecfff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.avatar-actions .remove-avatar{color:#ff9b91}
.avatar-actions .remove-avatar svg{stroke:#ff8175}
@media(max-width:620px){.avatar-actions{left:auto;right:-6px;transform:none}}

</style>

<style id="avatar-photo-circle-frame">
/* La fotografía queda recortada al círculo y conserva un marco exterior */
.avatar{isolation:isolate}
.avatar-image{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  border-radius:50%!important;
  object-fit:cover!important;
  object-position:center!important;
  clip-path:circle(50% at 50% 50%)!important;
  z-index:0!important;
}
.avatar:has(.avatar-image:not([hidden]))::before{
  content:"";
  position:absolute;
  inset:-5px;
  border:1.5px solid #1994ff;
  border-radius:50%;
  box-shadow:0 0 0 2px #24efff26,0 0 15px #1994ff40;
  pointer-events:none;
  z-index:1;
}
.avatar-upload{z-index:3}
</style>

<style id="avatar-instant-cache">
#accountAvatar{overflow:hidden}
#accountAvatarImage{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  border-radius:50%!important;
  object-fit:cover!important;
  object-position:center!important;
  clip-path:circle(50% at 50% 50%)!important;
  z-index:0!important;
}
#accountAvatarImage[hidden]{display:none!important}
#accountAvatarFallback{position:relative;z-index:0}
#accountAvatar:has(#accountAvatarImage:not([hidden]))::before{
  content:"";
  position:absolute;
  inset:-5px;
  border:1.5px solid #1994ff;
  border-radius:50%;
  box-shadow:0 0 0 2px #24efff26,0 0 15px #1994ff40;
  pointer-events:none;
  z-index:1;
}
#accountAvatarUpload{z-index:3}
/* Marco dorado visible alrededor de la foto de perfil. */
#accountAvatar.has-photo{
  outline:2px solid #1994ff;
  outline-offset:4px;
  box-shadow:0 0 0 2px #24efff26,0 0 18px #1994ff55,inset 0 0 12px #1994ff18;
}
</style>

 width:40px!important;height:40px!important;min-width:40px!important;min-height:40px!important;
 border-radius:12px!important;background:#00c6ff14!important;

<body>
<main>
<h1 class="account-heading">Mi Cuenta</h1>

<script type="module">
import { supabase } from "./supabase-client.js";

const usernameElement = document.querySelector(".username");
const userIdElement = document.getElementById("account-user-code");
const avatarImage = document.getElementById("accountAvatarImage");
const avatarFallback = document.getElementById("accountAvatarFallback");

function showAvatar(url, refreshImage = false) {
  const avatar = document.getElementById("accountAvatar");
  const uploadButton = document.getElementById("accountAvatarUpload");
  const actions = document.getElementById("avatarActions");
  if (url) {
    avatarImage.src = refreshImage ? url + (url.includes("?") ? "&" : "?") + "v=" + Date.now() : url;
    avatarImage.hidden = false;
    avatarFallback.hidden = true;
    avatar?.classList.add("has-photo");
    if (uploadButton) uploadButton.hidden = true;
    if (avatar) avatar.setAttribute("aria-label", "Foto de perfil. Toca para cambiarla o quitarla.");
  } else {
    avatarImage.removeAttribute("src");
    avatarImage.hidden = true;
    avatarFallback.hidden = false;
    avatar?.classList.remove("has-photo");
    if (uploadButton) uploadButton.hidden = false;
    if (actions) actions.hidden = true;
    if (avatar) avatar.setAttribute("aria-label", "Añadir foto de perfil");
  }
}

function showIdentity(identity) {
  usernameElement.textContent = identity.username || "Usuario";
  userIdElement.textContent = identity.user_code || "No disponible";
  showAvatar(identity.avatar_url || null);
}

async function loadAccountIdentity() {
  const { data: { session }, error: sessionError } = await supabase.auth.getSession();

  if (sessionError || !session?.user) {
    window.location.replace("login.html");
    return;
  }

  const user = session.user;

  // Control Admin solo aparece cuando Supabase confirma el rol en user_roles.
  const adminPanelLink = document.getElementById("adminPanelLink");
  if (adminPanelLink) {
    const { data: assignedRoles, error: rolesError } = await supabase
      .from("user_roles")
      .select("role_id")
      .eq("user_id", user.id);
    adminPanelLink.hidden = Boolean(rolesError || !assignedRoles?.some(role => role.role_id === "admin"));
  }

  // Estado activo significa que Supabase confirmó el correo de esta cuenta.
  const statusElement = document.getElementById("accountStatus");
  const emailVerified = Boolean(user.email_confirmed_at || user.confirmed_at);
  if (statusElement) {
    const statusLabel = document.getElementById("accountStatusLabel");
    if (statusLabel) statusLabel.textContent = emailVerified ? "Activo" : "Pendiente";
    statusElement.classList.toggle("pending", !emailVerified);
  }

  // El saldo siempre se consulta en Supabase; nunca se toma de una caché editable.
  const balanceElement = document.getElementById("usdt-balance-value");
  const { data: wallet, error: walletError } = await supabase
    .from("usdt_wallets")
    .select("balance")
    .eq("user_id", user.id)
    .maybeSingle();

  if (!walletError && wallet) {
    const balance = Number(wallet.balance);
    if (Number.isFinite(balance)) {
      const formatted = balance.toLocaleString("en-US", {
        maximumFractionDigits: 2
      });
      balanceElement.textContent = formatted;
      try { localStorage.setItem("iw-account-balance:" + user.id, String(balance)); } catch (cacheError) {}
    }
  } else if (walletError) {
    console.warn("No se pudo cargar el saldo USDT:", walletError);
    if (balanceElement.textContent === "—") balanceElement.textContent = "No disponible";
  } else {
    balanceElement.textContent = "0.00";
    try { localStorage.setItem("iw-account-balance:" + user.id, "0"); } catch (cacheError) {}
  }

  const cacheKey = `iw-account-identity:${user.id}`;

  // La caché local se lee inmediatamente al volver a Cuenta.
  let hasCachedIdentity = false;
  try {
    const cachedIdentity = localStorage.getItem(cacheKey);
    if (cachedIdentity) {
      showIdentity(JSON.parse(cachedIdentity));
      hasCachedIdentity = true;
    }
  } catch (cacheError) {
    console.warn("No se pudo leer la identidad guardada:", cacheError);
  }

  // Actualizamos la identidad en segundo plano para corregir cualquier dato antiguo.
  const { data: profile, error } = await supabase
    .from("profiles")
    .select("username, user_code, avatar_url")
    .eq("id", user.id)
    .single();

  if (error || !profile) return;

  const identity = {
    username: profile.username || "Usuario",
    user_code: profile.user_code || "No disponible",
    avatar_url: profile.avatar_url || null
  };

  showIdentity(identity);
  try {
    localStorage.setItem(cacheKey, JSON.stringify(identity));
  } catch (cacheError) {
    console.warn("No se pudo guardar la identidad:", cacheError);
  }
}

loadAccountIdentity();

const avatarButton = document.getElementById("accountAvatarUpload");
const avatarInput = document.getElementById("accountAvatarInput");
const avatarFeedback = document.getElementById("copyFeedback");

const avatar = document.getElementById("accountAvatar");
const avatarActions = document.getElementById("avatarActions");
const changeAvatarAction = document.getElementById("changeAvatarAction");
const removeAvatarAction = document.getElementById("removeAvatarAction");
let avatarUploadInProgress = false;

function openAvatarPicker(event) {
  event?.preventDefault();
  event?.stopPropagation();
  if (!avatarInput || avatarButton?.disabled) return;
  avatarInput.value = "";
  try {
    if (typeof avatarInput.showPicker === "function") avatarInput.showPicker();
    else avatarInput.click();
  } catch (pickerError) {
    avatarInput.click();
  }
}
avatarButton?.addEventListener("click", openAvatarPicker);
avatar?.addEventListener("click", event => {
  if (!avatarImage.hidden && !event.target.closest(".avatar-actions")) {
    avatarActions.hidden = !avatarActions.hidden;
  }
});
changeAvatarAction?.addEventListener("click", event => {
  avatarActions.hidden = true;
  openAvatarPicker(event);
});
document.addEventListener("click", event => {
  if (avatarActions && !avatar.contains(event.target)) avatarActions.hidden = true;
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && avatarActions) avatarActions.hidden = true;
});

removeAvatarAction?.addEventListener("click", async () => {
  avatarActions.hidden = true;
  removeAvatarAction.disabled = true;
  if (avatarFeedback) avatarFeedback.textContent = "Quitando foto...";
  try {
    const { data: { user }, error: userError } = await supabase.auth.getUser();
    if (userError || !user) throw userError || new Error("Inicia sesión para quitar tu foto.");
    const { error: profileError } = await supabase
      .from("profiles")
      .update({ avatar_url: null })
      .eq("id", user.id);
    if (profileError) throw profileError;

    showAvatar(null);
    const cacheKey = "iw-account-identity:" + user.id;
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey) || "{}");
      localStorage.setItem(cacheKey, JSON.stringify({ ...cached, avatar_url: null }));
    } catch (cacheError) {}
    const paths = ["jpg", "png", "webp"].map(extension => user.id + "/avatar." + extension);
    const { error: storageError } = await supabase.storage.from("profile-photos").remove(paths);
    if (storageError) console.warn("La foto se quitó del perfil, pero no se pudo limpiar el archivo:", storageError);
    if (avatarFeedback) avatarFeedback.textContent = "Foto de perfil quitada";
  } catch (error) {
    console.error("No se pudo quitar la foto de perfil:", error);
    if (avatarFeedback) avatarFeedback.textContent = error?.message || "No se pudo quitar la foto.";
  } finally {
    removeAvatarAction.disabled = false;
  }
});

avatarInput?.addEventListener("change", async () => {
  const file = avatarInput.files?.[0];
  if (!file || avatarUploadInProgress) return;

  const allowedTypes = ["image/jpeg", "image/png", "image/webp"];
  if (!allowedTypes.includes(file.type)) {
    if (avatarFeedback) avatarFeedback.textContent = "Usa una imagen JPG, PNG o WEBP.";
    avatarInput.value = "";
    return;
  }
  if (file.size > 3 * 1024 * 1024) {
    if (avatarFeedback) avatarFeedback.textContent = "La foto debe pesar 3 MB o menos.";
    avatarInput.value = "";
    return;
  }

  avatarUploadInProgress = true;
  avatarButton.disabled = true;
  if (avatarFeedback) avatarFeedback.textContent = "Guardando foto...";
  try {
    const { data: { user }, error: userError } = await supabase.auth.getUser();
    if (userError || !user) throw userError || new Error("Inicia sesión para cambiar tu foto.");

    const extension = file.type === "image/png" ? "png" : file.type === "image/webp" ? "webp" : "jpg";
    const filePath = user.id + "/avatar." + extension;
    const { error: uploadError } = await supabase.storage
      .from("profile-photos")
      .upload(filePath, file, {
        cacheControl: "60",
        upsert: true,
        contentType: file.type
      });
    if (uploadError) throw uploadError;

    const { data: publicData } = supabase.storage.from("profile-photos").getPublicUrl(filePath);
    const publicUrl = publicData?.publicUrl;
    if (!publicUrl) throw new Error("No se pudo obtener la dirección de la foto.");

    const { error: profileError } = await supabase
      .from("profiles")
      .update({ avatar_url: publicUrl })
      .eq("id", user.id);
    if (profileError) throw profileError;

    showAvatar(publicUrl, true);
    const cacheKey = "iw-account-identity:" + user.id;
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey) || "{}");
      localStorage.setItem(cacheKey, JSON.stringify({ ...cached, avatar_url: publicUrl }));
    } catch (cacheError) {}
    if (avatarFeedback) avatarFeedback.textContent = "Foto guardada correctamente";
  } catch (error) {
    console.error("No se pudo guardar la foto de perfil:", error);
    if (avatarFeedback) avatarFeedback.textContent = error?.message || "No se pudo guardar la foto.";
  } finally {
    avatarButton.disabled = false;
    avatarInput.value = "";
    avatarUploadInProgress = false;
  }
});

const copyButton = document.getElementById("copyAccountId");
copyButton?.addEventListener("click", async () => {
  const code = document.getElementById("account-user-code")?.textContent?.trim();
  const feedback = document.getElementById("copyFeedback");
  if (!code || code === "—" || code === "No disponible") return;
  try {
    await navigator.clipboard.writeText(code);
    if (feedback) feedback.textContent = "ID copiado";
  } catch (error) {
    const helper = document.createElement("textarea");
    helper.value = code;
    helper.style.position = "fixed";
    helper.style.opacity = "0";
    document.body.appendChild(helper);
    helper.select();
    const copied = document.execCommand("copy");
    helper.remove();
    if (feedback) feedback.textContent = copied ? "ID copiado" : "No se pudo copiar el ID";
  }
});

const logoutButton = document.getElementById("logoutButton");
logoutButton?.addEventListener("click", async event => {
  event.preventDefault();
  if (logoutButton.dataset.loading === "true") return;

  logoutButton.dataset.loading = "true";
  const label = logoutButton.querySelector("span:nth-child(2)");
  const originalLabel = label?.textContent || "Cerrar sesión";
  if (label) label.textContent = "Cerrando sesión...";

  try {
    const { data: { session } } = await supabase.auth.getSession();
    const userId = session?.user?.id;

    if ("serviceWorker" in navigator && "PushManager" in window) {
      try {
        const registration = await navigator.serviceWorker.getRegistration();
        const subscription = await registration?.pushManager.getSubscription();
        if (subscription) {
          const { error: pushError } = await supabase.rpc("remove_web_push_subscription", {
            p_endpoint: subscription.endpoint
          });
          if (pushError) {
            console.warn("No se pudo retirar la suscripción push antes de cerrar sesión:", pushError);
          } else {
            await subscription.unsubscribe();
          }
        }
      } catch (pushCleanupError) {
        console.warn("No se pudo limpiar la suscripción push al cerrar sesión:", pushCleanupError);
      }
    }

    const { error } = await supabase.auth.signOut();

    if (error) throw error;

    if (userId) {
      try {
        localStorage.removeItem("iw-account-identity:" + userId);
        localStorage.removeItem("iw-account-balance:" + userId);
        localStorage.removeItem("iw-history:" + userId);
      } catch (cacheError) {
        console.warn("No se pudo limpiar la caché de la cuenta:", cacheError);
      }
    }

    window.location.replace("login.html");
  } catch (error) {
    console.error("No se pudo cerrar la sesión:", error);
    logoutButton.dataset.loading = "false";
    if (label) label.textContent = originalLabel;
    alert("No se pudo cerrar la sesión. Comprueba tu conexión e inténtalo de nuevo.");
  }
});
</script>

<script>
(()=>{
 const nav=document.querySelector(".mobile-nav");if(!nav)return;
 const links=[...nav.querySelectorAll("a")];
 const file=location.pathname.split("/").pop()||"index.html";
 let active=links.findIndex(a=>{const target=(a.getAttribute("href")||"").split("#")[0];return target===file||(file==="mis-compras.html"&&target==="cuenta.html")});
 if(active<0)active=0;
 const select=(index)=>{nav.style.setProperty("--active-index",index);links.forEach((a,i)=>{a.classList.toggle("current",i===index);if(i===index)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})};
 select(active);
 links.forEach((a,index)=>a.addEventListener("click",event=>{
   if(event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
   const href=a.getAttribute("href")||"";
   if(a.hasAttribute("download")||a.target&&a.target!=="_self")return;
   event.preventDefault();
   if(index===active){if(href==="#")window.scrollTo({top:0,behavior:"smooth"});return;}
   select(index);
   if(href==="#"){window.scrollTo({top:0,behavior:"smooth"});return;}
   const delay=window.matchMedia&&window.matchMedia("(max-width:620px)").matches?650:0;
   window.setTimeout(()=>{window.location.href=a.href},delay);
 }));
})();
</script>
