<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="Administra tus datos personales en Internacional Web.">
<title>Datos personales — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0d;--panel:#111318;--orange:#ff7900;--white:#f5f4f1;--muted:#9699a2;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#ff790012,transparent 42%),var(--bg);color:var(--white);font-family:var(--font);padding-bottom:80px}
a{color:inherit;text-decoration:none}
main{width:min(90%,510px);margin:19px auto 35px}
.page-kicker{text-align:center;color:var(--orange);font-size:9px;font-weight:800;letter-spacing:2px;margin:0 0 8px}
h1{font:900 clamp(39px,10vw,56px)/.95 var(--display);text-align:center;letter-spacing:.4px;margin:0 0 10px}
.profile-card{display:flex;align-items:center;gap:14px;padding:15px;margin-bottom:20px;border:1px solid #ff790078;border-radius:17px;background:linear-gradient(105deg,#17110c,#0d0e11 65%);box-shadow:inset 0 0 16px #ff79000b}
.avatar{width:52px;height:52px;flex:0 0 52px;border:1.5px solid var(--orange);border-radius:50%;display:grid;place-items:center;color:var(--orange);background:radial-gradient(circle,#ff790022,#08090c 72%)}
.avatar svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.profile-card strong{display:block;font-size:14px;margin-bottom:4px}
.profile-card small{display:block;color:#9699a2;font-size:10px}
.fields{display:grid;gap:12px}
.field{position:relative;min-height:83px;padding:13px 15px 12px 58px;border:1px solid #ffffff20;border-radius:15px;background:linear-gradient(100deg,#15161b,#0e0f13 75%);transition:border-color .18s,box-shadow .18s}
.field:focus-within{border-color:#ff7900a8;box-shadow:0 0 13px #ff790018}
.field-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:29px;height:29px;color:#c5c7ce}
.field-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .field-icon .accent{stroke:#ff922e}
label{display:block;color:#aeb0b8;font-size:10px;font-weight:700;letter-spacing:.35px;margin:0 0 8px}
.field input{display:block;width:100%;padding:0;border:0;outline:0;background:transparent;color:#f5f4f1;font:600 13px var(--font);min-width:0}
.field input::placeholder{color:#62656e;opacity:1}
.field input:focus::placeholder{color:#777b84}
.field-hint{margin:17px 4px 0;color:#777b84;font-size:10px;line-height:1.65;text-align:center}
.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:65px;background:#101217f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;height:60px;color:#777}
.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav small{font-size:8px;letter-spacing:.2px}
.mobile-nav a.current{color:var(--orange)}
.mobile-nav a.current:before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:66px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#ff700059 0%,#ff700026 42%,transparent 75%);filter:blur(5px)}
.mobile-nav a.current svg{filter:drop-shadow(0 0 4px #ff7d00) drop-shadow(0 0 9px #ff690073)}
.mobile-nav a.current small{text-shadow:0 0 8px #ff780059}
@media(max-width:620px){main{margin:22px auto 28px;width:90%}.profile-card{padding:13px;margin-bottom:16px}.field{min-height:78px;padding-left:55px}.field-icon{left:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
<p class="page-kicker">TU PERFIL</p>
<h1>DATOS PERSONALES</h1>

<section class="profile-card" aria-label="Perfil de usuario">
<div class="avatar" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="22" r="11"/><path d="M11 55c1.8-11.5 9.2-17 21-17s19.2 5.5 21 17"/></svg></div>
<div><strong>Información de tu perfil</strong><small>Estos datos identifican tu cuenta</small></div>
</section>

<section class="fields" aria-label="Datos personales">
<div class="field">
<span class="field-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="10" r="5.2"/><path d="M5.5 27c1-5.6 4.7-8.4 10.5-8.4s9.5 2.8 10.5 8.4"/><path class="accent" d="M22.3 6.8a5.2 5.2 0 0 1 0 6.4"/></svg></span>
<label for="full-name">Nombre y apellidos</label>
<input id="full-name" type="text" placeholder="No especificado" autocomplete="name">
</div>
<div class="field">
<span class="field-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="10" r="4.5"/><path d="M3.8 26c.7-4.8 3.6-7.2 8.2-7.2 2 0 3.8.5 5.1 1.5"/><path class="accent" d="M21 17.5a4.8 4.8 0 1 0 0 9.5 4.8 4.8 0 0 0 0-9.5Zm0 2.3v2.5l1.7 1"/></svg></span>
<label for="username">Usuario</label>
<input id="username" type="text" placeholder="@tu_usuario" autocomplete="username">
</div>
<div class="field">
<span class="field-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="8" y="3.5" width="16" height="25" rx="3"/><path d="M13 7h6m-5 17h4"/><path class="accent" d="M12 13h8"/></svg></span>
<label for="phone">Número de teléfono</label>
<input id="phone" type="tel" placeholder="No especificado" autocomplete="tel">
</div>
<div class="field">
<span class="field-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3.5" y="6.5" width="25" height="19" rx="3"/><path d="m5 9 11 9 11-9"/><path class="accent" d="M5.5 23.5 12 17.8m14.5 5.7L20 17.8"/></svg></span>
<label for="email">Correo electrónico</label>
<input id="email" type="email" placeholder="No especificado" autocomplete="email">
</div>
</section>
</main>

<nav class="mobile-nav" aria-label="Navegación inferior">
<a href="index.html" aria-label="Inicio"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><small>Inicio</small></a>
<a href="tienda.html" aria-label="Tienda"><svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11h-15L3 9Z"/><path d="M7 9 9 4h6l2 5M9 13v3m6-3v3"/></svg><small>Tienda</small></a>
<a href="revendedores.html" aria-label="Revendedores"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.4-5 6-5s6 1.7 6 5m1-10 2 2 4-4m-5 9h5"/></svg><small>Revendedores</small></a>
<a href="soporte.html" aria-label="Soporte"><svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 12H2v6h4v-6H4Zm16 0h2v6h-4v-6h2ZM18 19c-1 2-3 3-6 3"/></svg><small>Soporte</small></a>
<a class="current" href="cuenta.html" aria-label="Cuenta" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.4-6 8-6s7.3 2 8 6"/></svg><small>Cuenta</small></a>
</nav>
</body>
</html>
