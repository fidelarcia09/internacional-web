<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<meta name="description" content="Administra tus datos personales en Internacional Web.">
<title>Datos personales — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b18;--panel:#081a35;--orange:#00c6ff;--white:#f5f4f1;--muted:#9699a2;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#00c6ff12,transparent 42%),var(--bg);color:var(--white);font-family:var(--font);padding-bottom:80px}
a{color:inherit;text-decoration:none}
.back{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid #34363d;border-radius:13px;color:#bbb;font-size:12px;font-weight:800;white-space:nowrap;margin:0 0 20px}.back svg{width:18px;height:18px;fill:none;stroke:var(--orange);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
main{width:min(90%,510px);margin:19px auto 35px}
.page-kicker{text-align:center;color:var(--orange);font-size:9px;font-weight:800;letter-spacing:2px;margin:0 0 8px}
h1{font:900 clamp(39px,10vw,56px)/.95 var(--display);text-align:center;letter-spacing:.4px;margin:0 0 10px}
.profile-card{display:flex;align-items:center;gap:14px;padding:15px;margin-bottom:20px;border:1px solid #00c6ff78;border-radius:17px;background:linear-gradient(105deg,#0d2342,#081a35 65%);box-shadow:inset 0 0 16px #00c6ff0b}
.avatar{width:52px;height:52px;flex:0 0 52px;border:1.5px solid var(--orange);border-radius:50%;display:grid;place-items:center;color:var(--orange);background:radial-gradient(circle,#00c6ff22,#050b18 72%)}
.avatar svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.profile-card strong{display:block;font-size:14px;margin-bottom:4px}
.profile-card small{display:block;color:#9699a2;font-size:10px}
.fields{display:grid;gap:12px}
.field{position:relative;min-height:83px;padding:13px 15px 12px 58px;border:1px solid #00c6ff78;border-radius:17px;background:linear-gradient(105deg,#0d2342,#081a35 65%);box-shadow:inset 0 0 16px #00c6ff0b;transition:border-color .18s,box-shadow .18s}
.field:focus-within{border-color:#00c6ffa8;box-shadow:0 0 13px #00c6ff18}
.field-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:29px;height:29px;color:#c5c7ce}
.field-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .field-icon .accent{stroke:#2ecfff}
label{display:block;color:#aeb0b8;font-size:10px;font-weight:700;letter-spacing:.35px;margin:0 0 8px}
.field input{display:block;width:100%;padding:0;border:0;outline:0;background:transparent;color:#f5f4f1;font:600 13px var(--font);min-width:0}
.field input::placeholder{color:#62656e;opacity:1}
.field input:focus::placeholder{color:#777b84}
.field-hint{margin:17px 4px 0;color:#777b84;font-size:10px;line-height:1.65;text-align:center}
.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:65px;background:#101217f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;height:60px;color:#777}
.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav small{font-size:8px;letter-spacing:.2px}
.mobile-nav a.current{color:var(--orange)}
.mobile-nav a.current:before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:66px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#00cfff59 0%,#00cfff26 42%,transparent 75%);filter:blur(5px)}
.mobile-nav a.current svg{filter:drop-shadow(0 0 4px #00c2ff) drop-shadow(0 0 9px #00d6ff73)}
.mobile-nav a.current small{text-shadow:0 0 8px #00c7ff59}
@media(max-width:620px){main{margin:22px auto 28px;width:94%}.profile-card{padding:13px;margin-bottom:16px}.field{min-height:78px;padding-left:55px}.field-icon{left:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
.save-button{width:100%;min-height:54px;margin-top:18px;border:1px solid #5cc4ff;border-radius:15px;background:linear-gradient(100deg,#2eacff,#21d7ff 55%,#25bdff);color:#081a35;font:900 14px var(--font);cursor:pointer;box-shadow:0 0 16px #00c6ff28}
.save-button:disabled{opacity:.65;cursor:wait}
.save-button[hidden]{display:none!important}
.save-notice{display:none;margin:12px 0 0;padding:12px;border:1px solid #2bc5ff70;border-radius:12px;background:#2cd5ff12;color:#9de3ff;text-align:center;font-size:11px;line-height:1.5}
.save-notice.show{display:block}
.field input[readonly]{color:#aeb0b8;cursor:not-allowed}
</style>

  .mobile-nav{

    display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;

<script>
/* Pintar los datos personales desde el almacenamiento local antes de iniciar Supabase. */
(() => {
  try {
    const auth = JSON.parse(localStorage.getItem("sb-fyyebxjysrhcxgmgperf-auth-token") || "null");
    const userId = auth?.user?.id || auth?.currentSession?.user?.id;
    if (!userId) return;
    const cached = localStorage.getItem("iw-personal-data:" + userId);
    if (!cached) return;
    const data = JSON.parse(cached);
    const fields = {
      "full-name": data.full_name || "",
      username: data.username || "",
      phone: data.phone || "",
      email: data.email || ""
    };
    for (const [id, value] of Object.entries(fields)) {
      const field = document.getElementById(id);
      if (field) field.value = value;
    }
    const profileHint = document.querySelector(".profile-card small");
    if (profileHint) profileHint.textContent = "ID: " + (data.user_code || "No disponible");
  } catch (error) { console.warn("No se pudieron precargar los datos personales:", error); }
})();
</script>
<script type="module">
import { supabase } from "./supabase-client.js";

const fullNameField = document.getElementById("full-name");
const usernameField = document.getElementById("username");
const phoneField = document.getElementById("phone");
const emailField = document.getElementById("email");
const saveButton = document.getElementById("save-profile");
const notice = document.getElementById("save-notice");
const profileHint = document.querySelector(".profile-card small");
let currentUser = null;
let profileCacheKey = null;
let originalEditableData = { full_name: "", username: "" };

function updateSaveVisibility() {
  const changed = fullNameField.value.trim() !== originalEditableData.full_name || usernameField.value.trim() !== originalEditableData.username;
  saveButton.hidden = !changed;
}

function showNotice(message, isError = false) {
  notice.textContent = message;
  notice.style.borderColor = isError ? "#ff5d5d99" : "#2bc5ff70";
  notice.style.color = isError ? "#ffb5b5" : "#9de3ff";
  notice.classList.add("show");
}

function showPersonalData(data) {
  fullNameField.value = data.full_name || "";
  usernameField.value = data.username || "";
  phoneField.value = data.phone || "";
  emailField.value = data.email || "";
  profileHint.textContent = "ID: " + (data.user_code || "No disponible");
  originalEditableData = { full_name: data.full_name || "", username: data.username || "" };
  updateSaveVisibility();
}

async function loadPersonalData() {
  // getSession lee la sesión persistida localmente y evita una consulta de red innecesaria.
  const { data: { session }, error: authError } = await supabase.auth.getSession();
  if (authError || !session?.user) {
    window.location.replace("login.html");
    return;
  }

  currentUser = session.user;
  profileCacheKey = `iw-personal-data:${currentUser.id}`;

  // Mostrar la caché inmediatamente para que la pantalla no quede vacía.
  let cachedData = null;
  try {
    const cached = localStorage.getItem(profileCacheKey);
    if (cached) {
      cachedData = JSON.parse(cached);
      showPersonalData(cachedData);
    }
  } catch (cacheError) {
    console.warn("No se pudieron leer los datos guardados:", cacheError);
  }

  // Actualizar siempre desde Supabase: el código de usuario puede haber cambiado.
  const { data: profile, error } = await supabase
    .from("profiles")
    .select("full_name, username, phone, user_code")
    .eq("id", currentUser.id)
    .single();

  if (error || !profile) {
    if (!cachedData) showNotice("No se pudieron cargar tus datos. Actualiza la página.", true);
    return;
  }

  const personalData = {
    full_name: profile.full_name || "",
    username: profile.username || "",
    phone: profile.phone || "",
    user_code: profile.user_code || "No disponible",
    email: currentUser.email || ""
  };

  showPersonalData(personalData);
  try {
    localStorage.setItem(profileCacheKey, JSON.stringify(personalData));
    localStorage.setItem(`iw-account-identity:${currentUser.id}`, JSON.stringify({
      username: personalData.username || "Usuario",
      user_code: personalData.user_code
    }));
  } catch (cacheError) {
    console.warn("No se pudieron actualizar los datos guardados:", cacheError);
  }
}

fullNameField.addEventListener("input", updateSaveVisibility);
usernameField.addEventListener("input", updateSaveVisibility);

saveButton.addEventListener("click", async () => {
  if (!currentUser) return;

  const full_name = fullNameField.value.trim();
  const username = usernameField.value.trim();

  if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {
    showNotice("El usuario debe tener entre 3 y 24 caracteres: letras, números o guion bajo.", true);
    usernameField.focus();
    return;
  }
  if (full_name.length > 120) {
    showNotice("El nombre no puede superar los 120 caracteres.", true);
    fullNameField.focus();
    return;
  }

  saveButton.disabled = true;
  saveButton.textContent = "GUARDANDO...";
  notice.classList.remove("show");

  const { error } = await supabase
    .from("profiles")
    .update({
      full_name: full_name || null,
      username
    })
    .eq("id", currentUser.id);

  saveButton.disabled = false;
  saveButton.textContent = "GUARDAR CAMBIOS";

  if (error) {
    if (error.code === "23505") showNotice("Ese nombre de usuario ya está ocupado. Prueba con otro.", true);
    else showNotice("No se pudieron guardar los cambios. Inténtalo de nuevo.", true);
    return;
  }

  const updatedData = {
    full_name,
    username,
    phone: phoneField.value.trim(),
    email: currentUser.email || "",
    user_code: profileHint.textContent.replace(/^ID:\s*/, "") || "No disponible"
  };
  showPersonalData(updatedData);
  try {
    localStorage.setItem(profileCacheKey, JSON.stringify(updatedData));
    localStorage.setItem(`iw-account-identity:${currentUser.id}`, JSON.stringify({
      username: updatedData.username || "Usuario",
      user_code: updatedData.user_code
    }));
  } catch (cacheError) {
    console.warn("No se pudieron actualizar los datos guardados:", cacheError);
  }
  showNotice("Tus datos personales se guardaron correctamente.");
});

loadPersonalData();
</script>
