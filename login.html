<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b18">
<meta name="description" content="Inicia sesión en INTERNACIONAL WEB.">
<title>Iniciar sesión — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b18;--orange:#28e4ff;--gold:#32b7ff;--white:#f5f5f5;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;min-height:100svh;padding:24px 16px 30px;display:flex;align-items:center;justify-content:center;overflow-x:hidden;background:var(--bg);color:var(--white);font-family:var(--font);position:relative;isolation:isolate}
body:before{content:"";position:fixed;z-index:-2;inset:-8%;background-image:url("fuentes/personaje_gamer_cuadrado.webp");background-size:cover;background-position:center 34%;transform:scale(1.22);filter:brightness(.32) saturate(.88);opacity:.62}
body:after{content:"";position:fixed;z-index:-1;inset:0;background:radial-gradient(ellipse at 50% 42%,#090a0d40 0%,#090a0dba 62%,#090a0df2 100%),linear-gradient(180deg,#090a0d9c,#090a0dce)}
a{color:inherit}
.page{width:min(100%,490px);margin:auto}
.login-card{position:relative;overflow:hidden;padding:clamp(25px,5vw,38px);border:1px solid #28e4ffb8;border-radius:27px;background:linear-gradient(155deg,#090a0df2 0%,#0a0b0eef 55%,#0a0f10f2 100%);box-shadow:0 0 0 1px #28e4ff20,inset 0 0 34px #28e4ff0c,0 0 42px #28e4ff2b}
.login-card:before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse at 50% 0%,#28e4ff20,transparent 42%),radial-gradient(ellipse at 0% 100%,#28e4ff1b,transparent 30%)}
.card-content{position:relative;z-index:1}
.emblem{width:55px;height:55px;margin:0 auto 11px;display:grid;place-items:center;border:1px solid #2bc5ff9c;border-radius:17px;background:linear-gradient(145deg,#2dc7ff22,#13dded10);box-shadow:0 0 22px #28e4ff3d;color:var(--gold)}
.emblem svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0;text-align:center;font:800 clamp(39px,9vw,53px)/.98 var(--display);letter-spacing:.2px;text-shadow:0 2px 18px #000}
.subtitle{margin:10px 0 27px;text-align:center;color:var(--gold);font-size:14px;font-weight:700;letter-spacing:.25px}
.fields{display:grid;gap:14px}
.field{height:59px;display:flex;align-items:center;gap:13px;padding:0 16px;border:1px solid #28e4ffa8;border-radius:17px;background:linear-gradient(100deg,#090a0df5,#101014ed);box-shadow:0 0 11px #28e4ff32,inset 0 0 14px #28e4ff0c;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:#32b7ff;box-shadow:0 0 0 2px #2bc5ff22,0 0 18px #28e4ff5a}
.field>svg{width:21px;height:21px;flex:0 0 21px;fill:none;stroke:#f0f0f2;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.field input{width:100%;min-width:0;height:100%;border:0;outline:0;background:transparent;color:#fff;font:500 14px var(--font)}
.field input::placeholder{color:#b7b8bf;opacity:1}
.toggle-pass{width:29px;height:36px;flex:0 0 29px;display:grid;place-items:center;border:0;background:transparent;color:#c7c7cd;cursor:pointer;padding:0}
.toggle-pass svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.options{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 2px 22px;font-size:11px}
.remember{display:flex;align-items:center;gap:8px;color:#dedee1;cursor:pointer}
.remember input{appearance:none;-webkit-appearance:none;width:17px;height:17px;margin:0;border:1px solid #2cd6ff;border-radius:5px;background:#081a35;display:grid;place-items:center}
.remember input:checked{background:linear-gradient(145deg,#32b7ff,#21e7ff);border-color:#32b7ff}
.remember input:checked:after{content:"✓";font-size:12px;font-weight:900;color:#111}
.forgot{color:var(--gold);font-weight:700;text-decoration:none}
.forgot:hover{text-decoration:underline;text-underline-offset:3px}
.submit{width:100%;min-height:59px;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid #5cc4ff;border-radius:17px;background:linear-gradient(100deg,#2eacff 0%,#21d7ff 52%,#25bdff 100%);box-shadow:0 0 10px #2cd5ff85,0 0 25px #28e4ff4c,inset 0 1px 0 #fff7;color:#081a35;font:900 18px var(--font);cursor:pointer;transition:transform .18s,filter .18s}
.submit:active{transform:scale(.985);filter:brightness(.95)}
.submit svg{width:22px;height:22px;fill:none;stroke:#081a35;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.divider{display:flex;align-items:center;gap:13px;margin:23px 0 16px;color:#c5c5ca;font-size:11px;font-weight:700;white-space:nowrap}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#2cd6ff99)}
.divider:after{background:linear-gradient(90deg,#2cd6ff99,transparent)}
.google{width:100%;height:54px;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid #ffffff30;border-radius:15px;background:linear-gradient(145deg,#081a35,#050b18);color:#f1f1f3;font:700 13px var(--font);cursor:pointer;transition:border-color .2s,box-shadow .2s}
.google:hover{border-color:#28e4ffa8;box-shadow:0 0 13px #28e4ff2b}
.google svg{width:21px;height:21px}
.socials{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;background:transparent;box-shadow:none}
.socials .google{flex:1 1 0;width:auto;min-width:0;height:52px;padding:0 8px;border-radius:13px;border:1px solid #ffffff24;box-shadow:none;font-size:12px;gap:8px}
.socials .google:hover{border-color:#28e4ffa8;box-shadow:0 0 12px #28e4ff20}
@media(max-width:420px){.socials{gap:8px}.socials .google{height:49px;padding:0 5px;font-size:11px;gap:6px}.socials .google svg{width:19px;height:19px}}
.notice{display:none;margin:14px 0 0;padding:11px 13px;border:1px solid #2bc5ff70;border-radius:12px;background:#2cd5ff12;color:#9de3ff;text-align:center;font-size:11px;line-height:1.5}
.notice.show{display:block}
.register{text-align:center;margin:23px 0 0;color:#dedee1;font-size:13px}
.register a{color:var(--gold);font-weight:800;text-decoration:none;margin-left:5px}
.register a:hover{text-decoration:underline;text-underline-offset:3px}
@media(max-width:420px){body{padding:15px 12px 22px}.login-card{padding:25px 18px;border-radius:23px}.field{height:56px;border-radius:15px}.fields{gap:12px}.subtitle{margin-bottom:22px}}
@media(prefers-reduced-motion:no-preference){.login-card{animation:card-in .55s ease both}@keyframes card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<main class="page">
<section class="login-card" aria-labelledby="title">
<div class="card-content">
<div class="emblem" aria-hidden="true">
<svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5m5 5H3"/></svg>
</div>
<h1 id="title">INICIAR SESIÓN</h1>
<p class="subtitle">Qué bueno tenerte de vuelta</p>
<form id="loginForm">
<div class="fields">
<label class="field">
<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
<input name="email" type="email" autocomplete="username" placeholder="Correo electrónico" aria-label="Correo electrónico" required>
</label>
<label class="field">
<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg>
<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" required>
<button class="toggle-pass" type="button" aria-label="Mostrar contraseña">
<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="m3 3 18 18"/></svg>
</button>
</label>
</div>
<div class="options">
<label class="remember"><input type="checkbox" name="remember"> Recordarme</label>
<a class="forgot" href="#recuperar" id="forgot">¿Olvidaste tu contraseña?</a>
</div>
<button class="submit" type="submit">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5m5 5H3"/></svg>
INICIAR SESIÓN
</button>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
</form>
<div class="divider">O CONTINÚA CON</div>
<div class="socials" aria-label="Otras opciones de acceso">
<button class="google telegram" id="telegramButton" type="button" aria-label="Telegram">
<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#2AABEE" d="M21.7 4.4 18.4 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L5.8 13.6.9 12c-1.1-.3-1.1-1 .2-1.5L20.2 3c.9-.3 1.7.2 1.5 1.4Z"/></svg>
Telegram
</button>
<button class="google" id="googleButton" type="button" aria-label="Google">
<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.7a12 12 0 0 1 0-7.4V15H5.8a20 20 0 0 0 0 18l6.8-5.3Z"/><path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.8 15l6.8 5.3c1.6-4.8 6.1-8.2 11.4-8.2Z"/></svg>
Google
</button>
</div>
<p class="register">¿Todavía no tienes cuenta? <a href="registro.html">Regístrate</a></p>
</div>
</section>
</main>
<script type="module">
import { supabase, SITE_URL } from "./supabase-client.js";

const notice = document.getElementById("notice");
const form = document.getElementById("loginForm");
const submit = form.querySelector(".submit");
function showNotice(message, isError = false) {
  notice.textContent = message;
  notice.classList.add("show");
  notice.style.borderColor = isError ? "#ff5d5d99" : "#2bc5ff70";
  notice.style.color = isError ? "#ffb5b5" : "#9de3ff";
}

document.querySelector(".toggle-pass").addEventListener("click", button => {
  const field = document.getElementById("password");
  const visible = field.type === "password";
  field.type = visible ? "text" : "password";
  button.currentTarget.setAttribute("aria-label", visible ? "Ocultar contraseña" : "Mostrar contraseña");
  const slash = button.currentTarget.querySelector(".slash");
  if (slash) slash.style.display = visible ? "none" : "block";
});

form.addEventListener("submit", async event => {
  event.preventDefault();
  const email = form.elements.email.value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  submit.disabled = true;
  submit.style.opacity = ".7";
  submit.textContent = "INICIANDO SESIÓN...";
  notice.classList.remove("show");

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  submit.disabled = false;
  submit.style.opacity = "";
  submit.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5m5 5H3"/></svg> INICIAR SESIÓN';

  if (error) {
    const message = error.message.toLowerCase();
    if (message.includes("email not confirmed")) showNotice("Primero confirma tu correo electrónico desde el enlace que te enviamos.", true);
    else if (message.includes("invalid login credentials")) showNotice("Correo o contraseña incorrectos.", true);
    else showNotice("No se pudo iniciar sesión. Comprueba tus datos e inténtalo otra vez.", true);
    return;
  }
  const requestedPage = new URLSearchParams(window.location.search).get("next");
  const returnPage = requestedPage === "resenas.html" ? "resenas.html" : "index.html";
  const { data: assurance, error: assuranceError } = await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
  if (!assuranceError && assurance?.nextLevel === "aal2" && assurance?.currentLevel !== "aal2") {
    sessionStorage.setItem("mfa_return_to", returnPage);
    window.location.assign(SITE_URL + "verificar-2fa.html");
    return;
  }
  showNotice("¡Sesión iniciada! Entrando...");
  window.location.assign(SITE_URL + returnPage);
});

document.getElementById("forgot").addEventListener("click", event => {
  event.preventDefault();
  showNotice("La recuperación de contraseña la conectaremos en el siguiente paso.", true);
});

document.getElementById("telegramButton").addEventListener("click", async () => {
  showNotice("Conectando con Telegram...");
  const { error } = await supabase.auth.signInWithOAuth({
    provider: "custom:telegram",
    options: { redirectTo: SITE_URL + "index.html" }
  });
  if (error) showNotice("No se pudo conectar con Telegram. Inténtalo nuevamente.", true);
});

document.getElementById("googleButton").addEventListener("click", async () => {
  showNotice("Conectando con Google...");
  const { error } = await supabase.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: SITE_URL + "index.html" }
  });
  if (error) showNotice("Google aún no está habilitado en Supabase. Configura el proveedor Google para activarlo.", true);
});

// La confirmación del correo puede dejar una sesión activa en este navegador.
 // Aun así, mostramos el formulario para que el usuario introduzca sus credenciales.



</script>
<script src="idioma.js" defer></script>
</body>
</html>
