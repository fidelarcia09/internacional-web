<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<meta name="description" content="Panel administrativo de Gamers Gold TopUp.">
<title>Control Admin — Gamers Gold TopUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b18;--panel:#081a35;--panel2:#0b2343;--cyan:#00c6ff;--gold:#ffd000;--white:#f5f7fb;--muted:#9aa8bc;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 60% 0%,#00c6ff13,transparent 38%),var(--bg);color:var(--white);font-family:var(--font)}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.topbar{height:72px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:#050b18ed;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:11px;font-size:12px;font-weight:900;letter-spacing:1px}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:2px;margin-top:3px}.logo{width:38px;height:38px;border:1px solid var(--cyan);display:grid;place-items:center;color:var(--cyan);font:900 23px var(--display);transform:skew(-7deg);box-shadow:0 0 16px #00c6ff20}
.top-actions{display:flex;align-items:center;gap:12px}.admin-pill{border:1px solid #ffd00055;background:#ffd00012;color:var(--gold);padding:8px 11px;border-radius:30px;font-size:10px;font-weight:800}.back{border:1px solid #ffffff25;padding:9px 13px;border-radius:10px;color:#cbd5e1;font-size:11px}.back svg{width:18px;height:18px;fill:none;stroke:var(--cyan);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}.page-back{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border-radius:13px;font-size:12px;font-weight:800;white-space:nowrap;margin:0}.top-navigation{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}.home-options{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid #00c6ff55;border-radius:12px;background:linear-gradient(110deg,#00c6ff18,#00c6ff08);color:#55dfff;font-size:11px;font-weight:800;transition:.18s ease}.home-options:hover{border-color:#00c6ffb0;background:#00c6ff20;box-shadow:0 0 16px #00c6ff16}.home-options svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}.detail-toolbar{display:flex;justify-content:flex-end;align-items:center;margin:12px 0 14px}.detail-toolbar .refresh{min-width:112px;min-height:39px}
.layout{width:min(1120px,94%);margin:24px auto;display:flex;flex-direction:column;gap:16px}
.sidebar{order:0;padding:12px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,#0b2343,#081a35)}
.side-title{padding:4px 5px 11px;color:#71839c;font-size:9px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}
.sidebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.side-title{grid-column:1/-1}
.nav-btn{width:100%;min-height:66px;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:13px 14px;border:1px solid #ffffff17;border-radius:13px;background:#07162c;color:#c5d2e2;text-align:left;font-size:12px;font-weight:750;margin:0;transition:.18s ease}
.nav-btn svg{width:21px;height:21px;flex:0 0 21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover,.nav-btn.active{background:linear-gradient(110deg,#00c6ff20,#00c6ff09);border-color:#00c6ff75;color:#42dcff;box-shadow:0 0 18px #00c6ff12}
.main{min-width:0}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin:3px 0 2px}.eyebrow{font-size:9px;color:var(--cyan);font-weight:800;letter-spacing:2px;text-transform:uppercase}.heading h1{font:900 clamp(34px,5vw,48px)/.95 var(--display);margin:5px 0 0;text-transform:uppercase}.sub{font-size:11px;color:var(--muted);margin-top:7px}
.heading-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.back{border:1px solid #ffffff25;border-radius:10px;padding:10px 13px;color:#cbd5e1;font-size:11px}.refresh{border:1px solid #00c6ff5a;border-radius:10px;padding:10px 13px;background:#00c6ff12;color:#50dfff;font-size:11px;font-weight:750}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat{padding:16px;border:1px solid #00c6ff27;border-radius:15px;background:linear-gradient(145deg,#0d2546,#081a35);box-shadow:inset 0 0 20px #00c6ff08}.stat-label{color:#9baec3;font-size:10px;font-weight:650}.stat-value{font:800 30px/1.1 var(--display);margin-top:9px;letter-spacing:.3px}.stat-foot{color:#71839b;font-size:9px;margin-top:5px}
.panel{border:1px solid var(--line);border-radius:17px;background:linear-gradient(150deg,#0b203c,#081a35);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 17px;border-bottom:1px solid var(--line)}.panel-head h2{font:800 24px var(--display);margin:0;text-transform:uppercase;letter-spacing:.3px}.search{width:min(300px,55vw);padding:10px 12px;border:1px solid #ffffff22;border-radius:10px;background:#050f20;color:white;outline:none;font-size:11px}.search:focus{border-color:var(--cyan)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid #ffffff0d;font-size:10px;white-space:nowrap}th{color:#8294aa;font-size:9px;letter-spacing:.7px;text-transform:uppercase;font-weight:800;background:#ffffff04}td{color:#dce5f1}tr:last-child td{border-bottom:0}.muted{color:#8192a8}.primary{color:#44dfff;font-weight:700}.money{color:#ffd84b;font-weight:800}.status{display:inline-flex;padding:5px 8px;border-radius:20px;background:#ffffff10;color:#cbd5e1;font-size:9px;font-weight:800;text-transform:uppercase}.status.completed,.status.confirmed,.status.delivered{background:#1d9e6b20;color:#69ddb0}.status.pending,.status.submitting,.status.processing{background:#e9ae2820;color:#ffd36b}.status.failed,.status.rejected,.status.cancelled{background:#e84b5720;color:#ff8d98}.action{border:1px solid #00c6ff55;border-radius:8px;background:#00c6ff12;color:#4bdfff;padding:7px 9px;font-size:9px;font-weight:800}.delete-btn{border:1px solid #ff667055;border-radius:8px;background:#ff667012;color:#ff9aa4;padding:7px 9px;font-size:9px;font-weight:800}.empty,.loading,.error{padding:35px 18px;text-align:center;color:#9aabc0;font-size:12px}.error{color:#ff9aa4}.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);color:#8294aa;font-size:10px}.pager button{padding:7px 10px;border:1px solid #ffffff22;border-radius:8px;background:#ffffff08;color:#dce5f1}.pager button:disabled{opacity:.35;cursor:not-allowed}
.recent{margin-top:16px}.settings{padding:20px;line-height:1.7;color:#b7c5d7;font-size:12px}.settings strong{color:#fff}.notice{padding:12px 14px;border:1px solid #ffd00030;border-radius:11px;background:#ffd0000b;color:#d9c98d;font-size:10px;line-height:1.6;margin-top:14px}
.modal-backdrop{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:18px;background:#000a;backdrop-filter:blur(7px)}.modal-backdrop.open{display:grid}.modal{width:min(430px,100%);padding:20px;border:1px solid #00c6ff55;border-radius:18px;background:#0b203c;box-shadow:0 20px 70px #000b}.modal h3{font:800 27px var(--display);margin:0 0 5px}.modal p{font-size:11px;color:#9aabc0;line-height:1.6}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:10px;color:#b7c5d7;font-weight:700}.field input{width:100%;padding:12px;border:1px solid #ffffff24;border-radius:10px;background:#050f20;color:#fff;outline:none}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.cancel{border:1px solid #ffffff25;border-radius:9px;padding:10px 13px;background:transparent;color:#c5d0df}.confirm{border:1px solid #00c6ff;border-radius:9px;padding:10px 14px;background:linear-gradient(100deg,#19a9f5,#00d2ff);color:#06162b;font-weight:900}.toast{position:fixed;right:18px;bottom:18px;z-index:40;max-width:min(380px,calc(100% - 36px));padding:12px 15px;border:1px solid #00c6ff55;border-radius:11px;background:#0b2343;color:#dff8ff;font-size:11px;box-shadow:0 8px 35px #0008}
.status.maintenance{background:#9a6b4326;color:#d7a16b;border:1px solid #a8784555}.status.open{background:#1b8e5526;color:#66dfa0;border:1px solid #249b6255}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.layout{width:94%;margin:15px auto}.top-navigation{margin-bottom:15px}.home-options{min-height:40px;padding:0 11px;font-size:10px}.detail-toolbar{margin:10px 0 12px}.detail-toolbar .refresh{min-height:38px}.heading{align-items:center}.heading h1{font-size:38px}.heading-actions{gap:6px}.back,.refresh{padding:9px 10px;font-size:10px}.sidebar{padding:9px;gap:7px}.nav-btn{min-height:58px;font-size:10px;padding:10px}.nav-btn svg{width:18px;height:18px;flex-basis:18px}.cards{gap:8px}.stat{padding:12px}.stat-value{font-size:25px}.panel-head{align-items:flex-start;flex-direction:column}.search{width:100%}}

/* Inicio del panel: accesos grandes en cuadrícula */
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.admin-tile{position:relative;min-height:158px;display:flex;align-items:center;gap:18px;padding:22px;border:1px solid #ffffff18;border-radius:18px;background:linear-gradient(135deg,#0d2749 0%,#081a35 72%);color:var(--white);text-align:left;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.admin-tile:before{content:"";position:absolute;width:150px;height:150px;right:-55px;top:-65px;border-radius:50%;background:#00c6ff0b;transition:transform .25s}
.admin-tile:hover{transform:translateY(-3px);border-color:#00c6ff75;box-shadow:0 12px 32px #0004,0 0 24px #00c6ff10}
.tile-icon{position:relative;z-index:1;width:62px;height:62px;flex:0 0 62px;display:grid;place-items:center;border:1px solid #00c6ff55;border-radius:17px;background:linear-gradient(145deg,#00c6ff20,#00c6ff08);color:#49d9ff;box-shadow:inset 0 0 18px #00c6ff0b}
.tile-icon svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.tile-copy{position:relative;z-index:1;min-width:0}.tile-copy strong{display:block;font:800 27px/1 var(--display);letter-spacing:.4px;text-transform:uppercase}.tile-copy small{display:block;margin-top:8px;color:#9aabc0;font-size:10px;line-height:1.5}.tile-arrow{position:absolute;right:18px;bottom:16px;color:#4bdfff;font-size:19px}
.detail-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:13px}
[hidden]{display:none!important}
@media(max-width:560px){.menu-grid{gap:9px}.admin-tile{min-height:132px;padding:14px;gap:11px;border-radius:15px;align-items:flex-start;flex-direction:column}.tile-icon{width:45px;height:45px;flex-basis:45px;border-radius:13px}.tile-icon svg{width:24px;height:24px}.tile-copy strong{font-size:22px}.tile-copy small{font-size:9px;margin-top:5px}.tile-arrow{right:13px;bottom:12px}}
 .balance-mode{display:grid;grid-template-columns:1fr 1fr;gap:9px}.balance-mode-btn{min-height:43px;border:1px solid #ffffff24;border-radius:10px;background:#050f20;color:#aebed1;font-size:11px;font-weight:800;transition:.18s}.balance-mode-btn.active.increase{border-color:#32c99088;background:#32c99016;color:#6ce0b0;box-shadow:inset 0 0 14px #32c9900c}.balance-mode-btn.active.decrease{border-color:#ff778588;background:#ff778516;color:#ff9ba5;box-shadow:inset 0 0 14px #ff77850c}</style>
</head>
<body>
<div class="layout">
  <main class="main">
    <div class="top-navigation">
      <a class="back page-back" href="cuenta.html" aria-label="Atrás"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span>Atrás</span></a>
      <button class="home-options" id="homeBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg><span>Todas las opciones</span></button>
    </div>
    <div class="heading"><div><h1 id="pageTitle">Control Admin</h1></div></div>
    <div class="detail-toolbar" id="detailToolbar" hidden><button class="refresh" id="refreshBtn">↻ Actualizar</button></div>
    <section id="content"><div class="loading">Cargando panel administrativo...</div></section>
  </main>
</div>
<div class="modal-backdrop" id="balanceModal">
  <div class="modal">
    <h3>Ajustar saldo USDT</h3>
    <p id="balanceUserLabel">Selecciona el importe que deseas sumar o restar. El movimiento quedará registrado en el historial.</p>
    <div class="field"><label>Tipo de ajuste</label><div class="balance-mode" role="group" aria-label="Tipo de ajuste"><button type="button" class="balance-mode-btn active increase" id="increaseBalance">＋ Aumentar saldo</button><button type="button" class="balance-mode-btn" id="decreaseBalance">− Restar saldo</button></div></div><div class="field"><label for="balanceDelta">Importe en USDT</label><input id="balanceDelta" type="number" min="0.01" step="0.01" placeholder="Ej. 5"></div>
    <div class="field"><label for="balanceReason">Motivo obligatorio</label><input id="balanceReason" maxlength="140" placeholder="Describe el motivo del ajuste"></div>
    <div class="modal-actions"><button class="cancel" id="cancelBalance">Cancelar</button><button class="confirm" id="saveBalance">Guardar ajuste</button></div>
  </div>
</div>
<script type="module">
import { supabase } from "./supabase-client.js";
const $ = s => document.querySelector(s);
const content = $("#content");
const titles = {overview:["Resumen general","Actividad y estado de la tienda en tiempo real."],users:["Usuarios","Cuentas registradas, saldo y actividad."],orders:["Ventas","Pedidos de la tienda y su estado."],recharges:["Recargas","Operaciones enviadas al proveedor RechargeGames."],deposits:["Depósitos","Solicitudes de depósito y su estado."],stats:["Estadísticas","Indicadores generales de Gamers Gold TopUp."],settings:["Configuración","Acceso y controles del panel administrativo."],maintenance:["Mantenimiento global","Activa o desactiva las compras y nuevas recargas de toda la tienda."]};
let section="home", page=0, search="", total=0, selectedUser=null, searchTimer=null, balanceMode="increase";
const menuItems=[
{key:"overview",title:"Resumen",desc:"Vista general de la actividad y los indicadores principales.",icon:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/>'},
{key:"users",title:"Usuarios",desc:"Cuentas, perfiles, roles, saldos y movimientos.",icon:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.7 2.7-5.6 6.5-5.6s6 1.9 6.5 5.6M16 5.2a3.5 3.5 0 0 1 0 6.7M17 14.7c2.6.5 4 2.2 4.5 5.3"/>'},
{key:"orders",title:"Ventas",desc:"Consulta pedidos, importes y estados de las ventas.",icon:'<path d="M4 5h2l2.1 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 9H7"/><circle cx="11" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/><path d="M10 9h8"/>'},
{key:"recharges",title:"Recargas",desc:"Historial de recargas procesadas con RechargeGames.",icon:'<path d="M13.5 2 5 13h6l-.5 9L19 11h-6l.5-9Z"/>'},
{key:"deposits",title:"Depósitos",desc:"Revisa solicitudes y gestiona su resolución.",icon:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4M7 3h10"/>'},
{key:"stats",title:"Estadísticas",desc:"Indicadores y rendimiento general de la tienda.",icon:'<path d="M4 20V11m5 9V5m5 15v-7m5 7V3"/><path d="M2 20h20"/>'},
{key:"maintenance",title:"Mantenimiento",desc:"Bloquea o habilita compras y nuevas recargas en toda la web.",icon:'<path d="M12 3 4.5 6v5.5c0 4.6 3.1 7.8 7.5 9.5 4.4-1.7 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m9 12 2 2 4-4"/>'}
];
function renderMenu(){return '<div class="menu-grid">'+menuItems.map(x=>'<button class="admin-tile" data-open-section="'+x.key+'"><span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true">'+x.icon+'</svg></span><span class="tile-copy"><strong>'+x.title+'</strong><small>'+x.desc+'</small></span><span class="tile-arrow" aria-hidden="true">↗</span></button>').join('')+'</div>'}
function showHome(){section="home";page=0;search="";$("#pageTitle").textContent="Control Admin";$("#homeBtn").hidden=true;$("#detailToolbar").hidden=true;content.innerHTML=renderMenu();content.querySelectorAll("[data-open-section]").forEach(b=>b.addEventListener("click",()=>openSection(b.dataset.openSection)));}
function openSection(key){section=key;page=0;search="";$("#homeBtn").hidden=false;$("#detailToolbar").hidden=false;loadSection();}

const PAGE_SIZE=30;
const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => Number(v||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+" USDT";
const date = v => v ? new Date(v).toLocaleString("es-ES",{dateStyle:"short",timeStyle:"short"}) : "—";
const status = v => '<span class="status '+esc(String(v||"").toLowerCase())+'">'+esc(v||"—")+'</span>';
function toast(message){const n=document.createElement("div");n.className="toast";n.textContent=message;document.body.append(n);setTimeout(()=>n.remove(),3600)}
function table(headers, rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join("")+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
function pager(){return '<div class="pager"><span>'+total+' registros · Página '+(page+1)+'</span><span><button id="prevPage" '+(page===0?'disabled':'')+'>Anterior</button> <button id="nextPage" '+((page+1)*PAGE_SIZE>=total?'disabled':'')+'>Siguiente</button></span></div>'}
function attachPager(){ $("#prevPage")?.addEventListener("click",()=>{page=Math.max(0,page-1);loadSection()}); $("#nextPage")?.addEventListener("click",()=>{page++;loadSection()})}
function renderStats(d){const items=[["Usuarios registrados",d.users_total,"Cuentas creadas"],["Saldo total en billeteras",money(d.wallets_total),"Suma de saldos actuales"],["Ventas completadas",money(d.sales_total),d.sales_count+" pedidos completados"],["Depósitos confirmados",money(d.deposits_total),"Total acreditado"],["Pedidos pendientes",d.orders_pending,"Ventas por resolver"],["Depósitos pendientes",d.deposits_pending,"Solicitudes por revisar"]];return '<div class="cards">'+items.map(x=>'<article class="stat"><div class="stat-label">'+x[0]+'</div><div class="stat-value">'+x[1]+'</div><div class="stat-foot">'+x[2]+'</div></article>').join("")+'</div>'}
function renderOverview(d){const rows=(d.recent_transactions||[]).map(x=>'<tr><td class="primary">'+esc(x.code)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.kind)+'</td><td class="money">'+money(x.amount)+'</td><td>'+date(x.created_at)+'</td></tr>').join("");return renderStats(d)+'<div class="panel recent"><div class="panel-head"><h2>Movimientos recientes</h2></div>'+(rows?table(["Referencia","Usuario","Tipo","Importe","Fecha"],rows):'<div class="empty">Todavía no hay movimientos registrados.</div>')+'</div>'}
function renderUsers(d){total=d.total||0;const rows=(d.items||[]).map(x=>'<tr><td><strong>'+esc(x.username||x.full_name||"Usuario")+'</strong><br><span class="muted">'+esc(x.user_code||"Sin código")+'</span></td><td>'+esc(x.email)+'</td><td class="money">'+money(x.balance)+'</td><td>'+esc(x.orders_count)+' · '+money(x.spent_total)+'</td><td>'+esc((x.roles||[]).join(", ")||"cliente")+'</td><td><button class="action adjust-btn" data-id="'+esc(x.id)+'" data-email="'+esc(x.email)+'" data-balance="'+esc(x.balance)+'">Ajustar saldo</button> <button class="delete-btn delete-user-btn" data-id="'+esc(x.id)+'" data-email="'+esc(x.email)+'" '+(x.id===awaitUser?.id?'disabled title="No puedes eliminar tu propia cuenta"':'')+'>Eliminar</button></td></tr>').join("");return '<div class="panel"><div class="panel-head"><h2>Directorio de usuarios</h2><input class="search" id="searchInput" placeholder="Buscar email, usuario o ID..." value="'+esc(search)+'"></div>'+(rows?table(["Usuario","Correo","Saldo","Compras · Total","Roles","Acción"],rows):'<div class="empty">No se encontraron usuarios.</div>')+pager()+'</div>'}
function renderOrders(d){total=d.total||0;const rows=(d.items||[]).map(x=>'<tr><td class="primary">'+esc(x.code)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.game||x.description)+'</td><td class="money">'+money(x.amount)+'</td><td>'+status(x.status)+'</td><td>'+date(x.created_at)+'</td></tr>').join("");return '<div class="panel"><div class="panel-head"><h2>Ventas registradas</h2><input class="search" id="searchInput" placeholder="Buscar pedido, juego o correo..." value="'+esc(search)+'"></div>'+(rows?table(["Pedido","Usuario","Juego / Descripción","Importe","Estado","Fecha"],rows):'<div class="empty">No hay ventas para mostrar.</div>')+pager()+'</div>'}
function renderRecharges(d){total=d.total||0;const rows=(d.items||[]).map(x=>'<tr><td class="primary">'+esc(x.buyer_ref)+'</td><td>'+esc(x.email||"—")+'</td><td>'+esc(x.product_name)+'</td><td>'+esc(x.game)+'</td><td>'+esc(x.player_id||"—")+'</td><td class="money">'+money(x.price_usdt)+'</td><td>'+status(x.status)+'</td><td>'+date(x.created_at)+'</td></tr>').join("");return '<div class="panel"><div class="panel-head"><h2>Historial de recargas</h2><input class="search" id="searchInput" placeholder="Buscar juego, producto o correo..." value="'+esc(search)+'"></div>'+(rows?table(["Referencia","Usuario","Producto","Juego","Player ID","Precio","Estado","Fecha"],rows):'<div class="empty">No hay recargas registradas.</div>')+pager()+'</div>'}
function renderDeposits(d){total=d.total||0;const rows=(d.items||[]).map(x=>'<tr><td class="primary">'+esc(x.code)+'</td><td>'+esc(x.email)+'</td><td class="money">'+money(x.amount)+'</td><td>'+esc(x.method)+'</td><td>'+esc(x.reference||"—")+'</td><td>'+status(x.status)+'</td><td>'+date(x.created_at)+'</td><td>'+(x.status==="pending"?'<button class="action deposit-action" data-id="'+esc(x.id)+'" data-approved="true">Confirmar</button> <button class="action deposit-action" data-id="'+esc(x.id)+'" data-approved="false">Rechazar</button>':'—')+'</td></tr>').join("");return '<div class="panel"><div class="panel-head"><h2>Solicitudes de depósito</h2><input class="search" id="searchInput" placeholder="Buscar código o correo..." value="'+esc(search)+'"></div>'+(rows?table(["Código","Usuario","Importe","Método","Referencia","Estado","Fecha","Acción"],rows):'<div class="empty">No hay depósitos registrados.</div>')+pager()+'</div>'}
function renderSettings(){return '<div class="panel"><div class="panel-head"><h2>Seguridad y configuración</h2></div><div class="settings"><p><strong>Control de acceso:</strong> el panel comprueba el rol <code>admin</code> en Supabase y cada consulta administrativa vuelve a validar ese permiso en el servidor.</p><p><strong>Cuenta administradora:</strong> '+esc((awaitUser?.email)||"Sesión autorizada")+'</p><p><strong>Registro de ajustes:</strong> cada cambio de saldo exige un motivo y genera un movimiento de tipo <code>adjustment</code> con saldo anterior y posterior.</p><div class="notice">La eliminación irreversible solo se permite si la cuenta no conserva saldo, pedidos, depósitos, transacciones ni recompensas. El servidor verifica estas condiciones y bloquea la eliminación cuando existe historial financiero.</div></div></div>'}
async function renderMaintenanceSettings(){
  content.innerHTML='<div class="loading">Comprobando el estado global de la tienda...</div>';
  const {data,error}=await supabase.from("store_maintenance").select("enabled,updated_at").eq("id",true).maybeSingle();
  if(error||!data)throw error||new Error("No se encontró la configuración de mantenimiento.");
  const enabled=Boolean(data.enabled);
  const label=enabled?"Tienda en Mantenimiento":"Tienda Abierta";
  const statusClass=enabled?"maintenance":"open";
  const action=enabled?"Desactivar mantenimiento":"Activar mantenimiento";
  const description=enabled
    ?"Las compras de juegos, Gift Cards y ofertas, además de las nuevas recargas USDT, están bloqueadas. Los pedidos y verificaciones pendientes siguen funcionando."
    :"La tienda está disponible. Al activar el mantenimiento se bloquearán en tiempo real las compras y las nuevas recargas.";
  content.innerHTML='<div class="panel"><div class="panel-head"><h2>Estado de la tienda</h2><span class="status '+statusClass+'">'+(enabled?"ACTIVO":"ABIERTA")+'</span></div><div class="settings"><p><strong>'+label+'</strong></p><p>'+description+'</p><p class="muted">Último cambio: '+date(data.updated_at)+'</p><button class="confirm" id="maintenance-toggle" type="button">'+action+'</button><p class="muted" style="margin-top:12px">El cambio se aplica por Realtime y se envía como notificación interna y push a los usuarios con avisos habilitados.</p></div></div>';
  $("#maintenance-toggle").addEventListener("click",async event=>{
    const button=event.currentTarget;
    if(!confirm(enabled
      ?"¿Desactivar el mantenimiento y volver a abrir la tienda?"
      :"¿Activar el mantenimiento y bloquear las nuevas compras y recargas?"))return;
    button.disabled=true;
    button.textContent=enabled?"Abriendo tienda...":"Activando mantenimiento...";
    try{
      const {data:result,error:toggleError}=await supabase.rpc("set_store_maintenance",{p_enabled:!enabled});
      if(toggleError)throw toggleError;
      toast(result?.changed
        ?(enabled?"Tienda abierta. Se notificó a los usuarios.":"Mantenimiento activado. Se bloquearon las nuevas operaciones y se notificó a los usuarios.")
        :"La tienda ya tenía ese estado.");
      await renderMaintenanceSettings();
    }catch(error){
      toast(error.message||"No se pudo cambiar el estado de la tienda.");
      button.disabled=false;
      button.textContent=action;
    }
  });
}
window.addEventListener("gg:store-maintenance-change", event => {
  if(section==="maintenance" && event.detail?.ready){
    renderMaintenanceSettings().catch(error=>{
      content.innerHTML='<div class="error">No se pudo actualizar el estado de mantenimiento. '+esc(error.message||"Comprueba la conexión.")+'</div>';
    });
  }
});
let awaitUser=null;
async function loadSection(){if(section==="home"){showHome();return}const t=titles[section];$("#pageTitle").textContent=t[0];content.innerHTML='<div class="loading">Cargando información segura...</div>';$("#refreshBtn").disabled=true;
try{if(section==="settings"){content.innerHTML=renderSettings();return}
if(section==="maintenance"){await renderMaintenanceSettings();return}
const {data,error}=await supabase.rpc("admin_panel_data",{p_section:section==="overview"?"overview":section==="stats"?"stats":section,p_search:search||null,p_limit:PAGE_SIZE,p_offset:page*PAGE_SIZE});
if(error)throw error;
if(section==="overview"||section==="stats")content.innerHTML=renderOverview(data||{});
else if(section==="users")content.innerHTML=renderUsers(data||{});
else if(section==="orders")content.innerHTML=renderOrders(data||{});
else if(section==="recharges")content.innerHTML=renderRecharges(data||{});
else if(section==="deposits")content.innerHTML=renderDeposits(data||{});
attachPager();$("#searchInput")?.addEventListener("input",e=>{search=e.target.value;page=0;clearTimeout(searchTimer);searchTimer=setTimeout(loadSection,250)});
document.querySelectorAll(".adjust-btn").forEach(b=>b.addEventListener("click",()=>openBalance(b.dataset.id,b.dataset.email,b.dataset.balance)));
document.querySelectorAll(".delete-user-btn").forEach(b=>b.addEventListener("click",async()=>{if(b.disabled)return;const email=b.dataset.email;if(!confirm("Vas a eliminar permanentemente la cuenta "+email+". Solo se permite si no tiene pedidos, depósitos ni transacciones financieras. Esta acción no se puede deshacer. ¿Continuar?"))return;b.disabled=true;b.textContent="Eliminando...";try{const {data,error}=await supabase.functions.invoke("admin-delete-user",{body:{target_user_id:b.dataset.id}});if(error)throw new Error(data?.message||data?.error||error.message);if(data?.error)throw new Error(data.message||data.error);toast("Cuenta eliminada correctamente.");await loadSection()}catch(e){toast(e.message||"No se pudo eliminar la cuenta.");b.disabled=false;b.textContent="Eliminar"}}));
document.querySelectorAll(".deposit-action").forEach(b=>b.addEventListener("click",async()=>{const approved=b.dataset.approved==="true";const verb=approved?"confirmar y acreditar":"rechazar";if(!confirm("¿Seguro que deseas "+verb+" este depósito?"))return;b.disabled=true;try{const {data,error}=await supabase.rpc("admin_resolve_deposit",{p_deposit_id:b.dataset.id,p_approved:approved});if(error)throw error;toast("Depósito "+(data==="confirmed"?"confirmado y acreditado":data==="rejected"?"rechazado":data)+".");await loadSection()}catch(e){toast(e.message||"No se pudo resolver el depósito.");b.disabled=false}}));
}catch(e){console.error(e);content.innerHTML='<div class="error">No se pudo cargar esta sección. '+esc(e.message||"Comprueba los permisos y la conexión.")+'</div>'}
finally{$("#refreshBtn").disabled=false}}
function setBalanceMode(mode){balanceMode=mode;$("#increaseBalance").classList.toggle("active",mode==="increase");$("#increaseBalance").classList.toggle("increase",mode==="increase");$("#decreaseBalance").classList.toggle("active",mode==="decrease");$("#decreaseBalance").classList.toggle("decrease",mode==="decrease")}
function openBalance(id,email,balance){selectedUser=id;setBalanceMode("increase");$("#balanceUserLabel").textContent=email+" · Saldo actual: "+money(balance);$("#balanceDelta").value="";$("#balanceReason").value="";$("#balanceModal").classList.add("open")}
function closeBalance(){$("#balanceModal").classList.remove("open");selectedUser=null}
$("#increaseBalance").addEventListener("click",()=>setBalanceMode("increase"));$("#decreaseBalance").addEventListener("click",()=>setBalanceMode("decrease"));
$("#cancelBalance").addEventListener("click",closeBalance);$("#balanceModal").addEventListener("click",e=>{if(e.target.id==="balanceModal")closeBalance()});
$("#saveBalance").addEventListener("click",async()=>{const amount=Number($("#balanceDelta").value),reason=$("#balanceReason").value.trim(),delta=balanceMode==="decrease"?-amount:amount;if(!selectedUser||!Number.isFinite(amount)||amount<=0||!reason){toast("Indica un importe mayor que cero y el motivo del ajuste.");return}const btn=$("#saveBalance");btn.disabled=true;btn.textContent="Guardando...";try{const {data,error}=await supabase.rpc("admin_adjust_wallet",{p_user_id:selectedUser,p_delta:delta,p_reason:reason});if(error)throw error;toast("Saldo actualizado. Nuevo saldo: "+money(data.balance_after));closeBalance();await loadSection()}catch(e){toast(e.message||"No se pudo ajustar el saldo.");}finally{btn.disabled=false;btn.textContent="Guardar ajuste"}});
$("#homeBtn").addEventListener("click",showHome);
$("#refreshBtn").addEventListener("click",loadSection);
async function init(){const {data:{session},error}=await supabase.auth.getSession();if(error||!session?.user){location.replace("login.html");return}awaitUser=session.user;const {data:roles,error:roleError}=await supabase.from("user_roles").select("role_id").eq("user_id",session.user.id);if(roleError||!roles?.some(r=>r.role_id==="admin")){document.body.innerHTML='<main style="max-width:520px;margin:15vh auto;padding:24px;text-align:center;color:#fff;font-family:Inter,sans-serif"><h1>Acceso restringido</h1><p>Esta cuenta no tiene permisos de administrador.</p><a href="cuenta.html" style="color:#00c6ff">Volver a mi cuenta</a></main>';return}showHome()}
init().catch(e=>{console.error(e);content.innerHTML='<div class="error">No se pudo iniciar Control Admin. '+esc(e.message||"Comprueba la conexión y vuelve a intentarlo.")+' <button class="action" id="retryInit">Reintentar</button></div>';$("#retryInit")?.addEventListener("click",()=>{content.innerHTML='<div class="loading">Cargando panel administrativo...</div>';init().catch(err=>{content.innerHTML='<div class="error">No se pudo iniciar Control Admin. '+esc(err.message||"Comprueba la conexión.")+'</div>'})})});
</script>
