<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="Opiniones de la comunidad sobre INTERNACIONAL WEB.">
<title>Reseñas — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0d;--panel:#121419;--panel2:#17191f;--orange:#ff7928;--gold:#ffad32;--white:#f5f5f5;--muted:#a0a1a9;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#71300022,transparent 42%),var(--bg);color:var(--white);font-family:var(--font)}a{color:inherit;text-decoration:none}
main{width:min(100% - 32px,900px);margin:34px auto 70px}
.hero{margin-bottom:24px}.hero h1{font:900 clamp(43px,8vw,66px)/.9 var(--display);margin:0}
.summary{display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:center;padding:23px 0;border:0;border-radius:0;background:transparent;box-shadow:none;margin:22px 0}
.average{text-align:center}.average strong{display:block;font:900 58px/.9 var(--display)}.stars{color:var(--gold);letter-spacing:3px;font-size:18px}.average small{display:block;margin-top:7px;color:var(--muted);font-size:10px}
.bars{display:grid;gap:8px}.bar-row{display:grid;grid-template-columns:13px 1fr 30px;gap:9px;align-items:center;color:#c8c8cd;font-size:10px}.bar{height:7px;border-radius:20px;background:#ffffff12;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:20px;width:0}
.bottom-actions{display:flex;justify-content:center;margin:22px 0 12px}
.btn{min-height:42px;padding:0 15px;border:1px solid #ff8b3d88;border-radius:12px;background:linear-gradient(110deg,#ffad32,#ff7928);color:#17100a;font:800 11px var(--font);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.secondary{background:#17191f;color:#f5f5f5;border-color:#ffffff25}.btn:disabled{opacity:.55;cursor:not-allowed}
.sort{height:40px;padding:0 12px;border:1px solid #ffffff25;border-radius:11px;background:#121419;color:#ddd;font:600 11px var(--font)}
.review-list{display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;padding:3px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:#ff792888 transparent;-webkit-overflow-scrolling:touch}.review{flex:0 0 min(360px,82vw);min-width:0;padding:18px;border:1px solid #ffffff12;border-radius:16px;background:#121419;scroll-snap-align:start}
.review-head{display:flex;align-items:center;gap:11px}.avatar{width:39px;height:39px;flex:0 0 39px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffad32,#ff7021);color:#16100a;font-weight:900}.author{min-width:0;flex:1}.author b{display:block;font-size:12px}.author small{display:block;color:#81838c;font-size:10px;margin-top:4px}.review-stars{color:var(--gold);font-size:13px;letter-spacing:1px;white-space:nowrap}.review h3{font-size:13px;margin:14px 0 6px}.review p{font-size:12px;color:#b8bac2;line-height:1.75;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.review-foot{display:flex;justify-content:flex-end;margin-top:12px}.review-foot button{border:0;background:none;color:var(--gold);font:700 10px var(--font);cursor:pointer}
.empty,.loading{flex:0 0 100%;padding:35px 0;text-align:center;border:0;border-radius:0;color:var(--muted);font-size:12px;line-height:1.7}.empty b{display:block;color:#fff;font:800 24px var(--display);margin-bottom:5px}
.form-panel{display:none;margin:18px 0 24px;padding:21px 0;border:0;border-radius:0;background:transparent;box-shadow:none}.form-panel.open{display:block}.form-panel h2{font:800 28px var(--display);margin:0 0 5px}.form-panel>p{font-size:11px;color:var(--muted);margin:0 0 18px}
.rating-picker{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:5px;margin:0 0 16px}.rating-picker input{position:absolute;opacity:0;pointer-events:none}.rating-picker label{font-size:31px;color:#555;cursor:pointer;line-height:1}.rating-picker label:hover,.rating-picker label:hover~label,.rating-picker input:checked~label{color:var(--gold)}
.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:10px;font-weight:800;color:#ddd}.field input,.field textarea{width:100%;border:1px solid #ffffff25;border-radius:11px;background:#0c0e12;color:#fff;padding:13px;font:500 12px var(--font);outline:none}.field input:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 2px #ff792822}.field textarea{min-height:105px;resize:vertical;line-height:1.6}.form-actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.notice{display:none;margin-top:13px;padding:11px 12px;border-radius:10px;background:#ff792817;border:1px solid #ff792866;color:#ffd4ad;font-size:11px;line-height:1.5}.notice.show{display:block}
@media(max-width:600px){main{margin:25px auto 45px}.summary{grid-template-columns:105px 1fr;gap:12px;padding:16px 0}.average strong{font-size:48px}.stars{font-size:14px;letter-spacing:1px}.bar-row{grid-template-columns:12px 1fr 24px;gap:6px}.review{flex-basis:84vw;padding:15px}.review-stars{font-size:12px}.form-panel{padding:17px}}
</style>
</head>
<body>
<main>
<section class="hero"><h1>RESEÑAS</h1></section>
<section class="summary" aria-label="Resumen de valoraciones">
 <div class="average"><strong id="average">—</strong><div class="stars" id="averageStars">☆☆☆☆☆</div><small id="totalReviews">Cargando reseñas…</small></div>
 <div class="bars" id="ratingBars">
  <div class="bar-row"><span>5</span><div class="bar"><i></i></div><span>0</span></div>
  <div class="bar-row"><span>4</span><div class="bar"><i></i></div><span>0</span></div>
  <div class="bar-row"><span>3</span><div class="bar"><i></i></div><span>0</span></div>
  <div class="bar-row"><span>2</span><div class="bar"><i></i></div><span>0</span></div>
  <div class="bar-row"><span>1</span><div class="bar"><i></i></div><span>0</span></div>
 </div>
</section>

<section class="review-list" id="reviewList"><div class="loading">Cargando opiniones de la comunidad…</div></section>
<div class="bottom-actions"><button class="btn" id="writeReview">✎ Crear reseña</button></div>
<section class="form-panel" id="formPanel">
 <h2 id="formTitle">Comparte tu experiencia</h2><p>Tu opinión ayuda a otros usuarios de la comunidad.</p>
 <form id="reviewForm">
  <div class="rating-picker" role="radiogroup" aria-label="Tu valoración">
   <input type="radio" id="star5" name="rating" value="5" required><label for="star5" aria-label="5 estrellas">★</label>
   <input type="radio" id="star4" name="rating" value="4"><label for="star4" aria-label="4 estrellas">★</label>
   <input type="radio" id="star3" name="rating" value="3"><label for="star3" aria-label="3 estrellas">★</label>
   <input type="radio" id="star2" name="rating" value="2"><label for="star2" aria-label="2 estrellas">★</label>
   <input type="radio" id="star1" name="rating" value="1"><label for="star1" aria-label="1 estrella">★</label>
  </div>
  <div class="field"><label for="reviewTitle">Título de tu reseña</label><input id="reviewTitle" name="title" maxlength="70" minlength="3" placeholder="Resume tu experiencia" required></div>
  <div class="field"><label for="reviewContent">Tu opinión</label><textarea id="reviewContent" name="content" maxlength="1000" minlength="10" placeholder="Cuéntanos qué te pareció la plataforma…" required></textarea></div>
  <div class="form-actions"><button class="btn" id="submitReview" type="submit">Publicar reseña</button><button class="btn secondary" id="cancelReview" type="button">Cancelar</button></div>
  <div class="notice" id="formNotice" role="status" aria-live="polite"></div>
 </form>
</section>
<script type="module">
import { supabase, SITE_URL } from "./supabase-client.js";

const list = document.getElementById("reviewList");
const panel = document.getElementById("formPanel");
const form = document.getElementById("reviewForm");
const notice = document.getElementById("formNotice");
const writeButton = document.getElementById("writeReview");
const submitButton = document.getElementById("submitReview");
let currentUser = null;
let ownReview = null;
let reviews = [];

function stars(value){return "★".repeat(value)+"☆".repeat(5-value)}
function showNotice(message,isError=false){notice.textContent=message;notice.classList.add("show");notice.style.borderColor=isError?"#ff6b6b88":"#ff792866";notice.style.color=isError?"#ffb4b4":"#ffd4ad"}
function dateLabel(value){return new Intl.DateTimeFormat("es",{dateStyle:"medium"}).format(new Date(value))}
function updateSummary(){
 const total=reviews.length;
 const average=total?reviews.reduce((sum,item)=>sum+item.rating,0)/total:0;
 document.getElementById("average").textContent=total?average.toFixed(1):"—";
 document.getElementById("averageStars").textContent=total?stars(Math.round(average)):"☆☆☆☆☆";
 document.getElementById("totalReviews").textContent=total?total+" "+(total===1?"reseña":"reseñas"):"Aún no hay reseñas";
 [5,4,3,2,1].forEach((rating,index)=>{
  const count=reviews.filter(item=>item.rating===rating).length;
  const row=document.querySelectorAll(".bar-row")[index];
  row.querySelector("i").style.width=total?(count/total*100)+"%":"0%";
  row.lastElementChild.textContent=count;
 });
}
function renderReviews(){
 const ordered=[...reviews].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
 list.replaceChildren();
 if(!ordered.length){const empty=document.createElement("div");empty.className="empty";const title=document.createElement("b");title.textContent="Sé el primero en opinar";empty.append(title,document.createTextNode("Todavía no hay reseñas publicadas. Comparte tu experiencia con la comunidad."));list.append(empty);return;}
 ordered.forEach(item=>{
  const card=document.createElement("article");card.className="review";
  const head=document.createElement("div");head.className="review-head";
  const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=(item.author_name||"U").trim().charAt(0).toUpperCase();
  const author=document.createElement("div");author.className="author";
  const name=document.createElement("b");name.textContent=item.author_name||"Usuario";
  const date=document.createElement("small");date.textContent=dateLabel(item.updated_at||item.created_at);
  author.append(name,date);
  const rating=document.createElement("div");rating.className="review-stars";rating.textContent=stars(item.rating);rating.setAttribute("aria-label",item.rating+" de 5 estrellas");
  head.append(avatar,author,rating);card.append(head);
  const title=document.createElement("h3");title.textContent=item.title;
  const content=document.createElement("p");content.textContent=item.content;
  card.append(title,content);
  if(currentUser&&item.user_id===currentUser.id){const foot=document.createElement("div");foot.className="review-foot";const edit=document.createElement("button");edit.type="button";edit.textContent="Editar mi reseña";edit.addEventListener("click",()=>openEditor(item));foot.append(edit);card.append(foot);}
  list.append(card);
 });
}
async function loadReviews(){
 list.innerHTML='<div class="loading">Cargando opiniones de la comunidad…</div>';
 const {data,error}=await supabase.from("site_reviews").select("id,user_id,author_name,rating,title,content,created_at,updated_at").order("created_at",{ascending:false}).limit(200);
 if(error){list.innerHTML='<div class="empty">No se pudieron cargar las reseñas. Actualiza la página para intentarlo de nuevo.</div>';console.error("Error cargando reseñas:",error);return;}
 reviews=data||[];updateSummary();renderReviews();
 if(currentUser){const {data:mine,error:mineError}=await supabase.from("site_reviews").select("id,user_id,author_name,rating,title,content").eq("user_id",currentUser.id).maybeSingle();ownReview=mineError?null:mine;writeButton.textContent=ownReview?"✎ Editar mi reseña":"✎ Crear reseña";}
}
function openEditor(item=null){
 if(!currentUser){window.location.href=SITE_URL+"login.html?next=resenas.html";return;}
 form.reset();notice.classList.remove("show");ownReview=item||ownReview;
 document.getElementById("formTitle").textContent=ownReview?"Actualiza tu reseña":"Comparte tu experiencia";
 submitButton.textContent=ownReview?"Guardar cambios":"Publicar reseña";
 if(ownReview){form.elements.rating.value=String(ownReview.rating);form.elements.title.value=ownReview.title;form.elements.content.value=ownReview.content;}
 panel.classList.add("open");panel.scrollIntoView({behavior:"smooth",block:"start"});
}
writeButton.addEventListener("click",()=>openEditor());
document.getElementById("cancelReview").addEventListener("click",()=>panel.classList.remove("open"));
form.addEventListener("submit",async event=>{
 event.preventDefault();
 if(!currentUser){window.location.href=SITE_URL+"login.html?next=resenas.html";return;}
 const rating=Number(form.elements.rating.value);
 const title=form.elements.title.value.trim();
 const content=form.elements.content.value.trim();
 if(!rating){showNotice("Selecciona una valoración de 1 a 5 estrellas.",true);return;}
 if(title.length<3||content.length<10){showNotice("Completa el título y escribe una opinión de al menos 10 caracteres.",true);return;}
 submitButton.disabled=true;submitButton.textContent="PUBLICANDO…";notice.classList.remove("show");
 const {error}=await supabase.from("site_reviews").upsert({user_id:currentUser.id,author_name:"",rating,title,content},{onConflict:"user_id"});
 submitButton.disabled=false;submitButton.textContent=ownReview?"Guardar cambios":"Publicar reseña";
 if(error){console.error("Error guardando reseña:",error);showNotice(error.code==="23505"?"Ya existe una reseña para esta cuenta. Actualiza la que publicaste anteriormente.":"No se pudo guardar tu reseña. Comprueba tu sesión e inténtalo de nuevo.",true);return;}
 panel.classList.remove("open");await loadReviews();
});
const {data:{user}}=await supabase.auth.getUser();currentUser=user||null;
if(!currentUser){writeButton.textContent="✎ Inicia sesión para opinar";}
await loadReviews();
supabase.auth.onAuthStateChange((_event,session)=>{window.setTimeout(async()=>{currentUser=session?.user||null;await loadReviews();},0);});
</script>
</body>
</html>
