<title>Checkout — Gamers Gold Top-Up</title>

<style>
:root{color-scheme:dark;--bg:#050B18;--panel:#081A35;--cyan:#00C6FF;--blue:#007BFF;--white:#F5F4F1;--muted:#92949C;--line:#00C6FF55;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;padding:18px 0 35px;background:radial-gradient(ellipse at 50% 0%,#007bff20,transparent 42%),radial-gradient(ellipse at 50% 90%,#00c6ff12,transparent 45%),var(--bg);color:var(--white);font-family:var(--font)}a{color:inherit;text-decoration:none}.topbar{width:min(1120px,calc(100% - 28px));min-height:66px;margin:0 auto 16px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{width:43px;height:43px;display:grid;place-items:center;border:1px solid #00c6ff99;border-radius:14px;background:linear-gradient(145deg,#0b3154,#07172d);color:var(--cyan);font-size:25px;box-shadow:0 0 18px #00c6ff30}.brand-name{font:800 22px/.95 var(--display);letter-spacing:.2px}.brand-name span{display:block;color:var(--cyan);font-size:15px;letter-spacing:2px;margin-top:3px}.top-actions{margin-left:auto;display:flex;gap:9px}.top-link{min-height:42px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #168bcb88;border-radius:12px;background:#081a35;color:#dceefa;font-size:12px;font-weight:800}.top-link svg{width:17px;height:17px;stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{width:min(1000px,calc(100% - 28px));margin:0 auto}.checkout-card{overflow:hidden;border:1px solid #00bfffaa;border-radius:25px;background:linear-gradient(155deg,#081a35f5,#050e20 72%);box-shadow:0 0 30px #00aaff20,inset 0 0 30px #00c6ff0a}.checkout-head{padding:25px 30px 18px;border-bottom:1px solid #00c6ff25}.head-title{display:flex;align-items:center;gap:14px}.cart-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#00c6ff16;color:var(--cyan)}.cart-icon svg{width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.head-title h1{margin:0;font:800 36px/1 var(--display)}.head-title p{margin:5px 0 0;color:#b5c7dc;font-size:13px}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:24px 5px 0;position:relative}.progress:before{content:"";position:absolute;top:15px;left:16.6%;right:16.6%;height:3px;background:#183d60}.progress-fill{position:absolute;top:15px;left:16.6%;height:3px;width:0;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .35s ease}.step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:#899bad;font-size:11px;font-weight:800}.step-dot{width:32px;height:32px;display:grid;place-items:center;border:2px solid #36516c;border-radius:50%;background:#081a35;color:#8ea2b8;font-size:14px}.step.done{color:var(--cyan)}.step.done .step-dot{border-color:var(--cyan);background:var(--cyan);color:#041321;box-shadow:0 0 15px #00c6ff66}.step.active{color:#eafaff}.step.active .step-dot{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 5px #00c6ff18,0 0 18px #00c6ff55}.step.failed{color:#ff9b9b}.step.failed .step-dot{border-color:#ff5757;background:#35121b;color:#ff7777}
.status-hero{padding:27px 24px 24px;text-align:center}.status-symbol{width:78px;height:78px;margin:0 auto 14px;display:grid;place-items:center;border:3px solid #00d4ff;border-radius:50%;color:var(--cyan);box-shadow:0 0 0 9px #00c6ff12,0 0 28px #00c6ff66,inset 0 0 18px #00c6ff22}.status-symbol svg{width:39px;height:39px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.status-symbol.success{border-color:#28e879;color:#28e879;box-shadow:0 0 0 9px #28e87912,0 0 30px #28e87955}.status-symbol.error{border-color:#ff6262;color:#ff7777;box-shadow:0 0 0 9px #ff626212,0 0 26px #ff626255}.status-hero h2{margin:0;font:900 clamp(30px,5vw,45px)/1.05 var(--display)}.status-hero h2 span{color:var(--cyan)}.status-hero p{max-width:690px;margin:9px auto 0;color:#c0d0e1;font-size:14px;line-height:1.65}.status-note{display:inline-flex;align-items:center;gap:8px;margin-top:13px;padding:8px 12px;border:1px solid #00c6ff55;border-radius:30px;background:#00c6ff10;color:#bceeff;font-size:11px;font-weight:800}
.details{margin:0 26px 22px;border:1px solid #168bcb99;border-radius:18px;background:linear-gradient(135deg,#0a203c,#06142a);overflow:hidden}.details-title{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid #168bcb44;font-size:16px;font-weight:850}.details-title svg{width:23px;height:23px;stroke:var(--cyan);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.details-body{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(230px,.85fr);gap:18px;padding:18px}.product-side{display:flex;align-items:center;gap:16px;min-width:0}.product-art{width:104px;height:104px;flex:0 0 104px;display:grid;place-items:center;overflow:hidden;border:1px solid #00c6ff55;border-radius:16px;background:linear-gradient(145deg,#0e3153,#06152b);color:var(--cyan);font-size:37px}.product-art img{width:100%;height:100%;object-fit:cover}.field-label{display:block;margin-bottom:5px;color:#8fa9c3;font-size:11px;font-weight:700}.field-value{display:block;overflow-wrap:anywhere;color:#f5f4f1;font-size:15px;font-weight:850;line-height:1.4}.product-info .info-block+.info-block{margin-top:13px}.order-side{padding-left:20px;border-left:1px solid #168bcb55;display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0}.price-value{color:var(--cyan);font-size:25px;font-weight:900;letter-spacing:-.5px}.order-code{font-size:13px;letter-spacing:.2px}.date-value{font-size:12px;font-weight:750}.extra-details{display:flex;flex-wrap:wrap;gap:8px 18px;padding:0 18px 17px;color:#aebfd1;font-size:11px}.extra-details[hidden]{display:none}.state-pill{margin:0 26px 20px;padding:12px 16px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;border:1px solid #00c6ff55;border-radius:40px;background:#061b31;color:#dcecf9;font-size:13px;font-weight:800}.state-pill strong{padding:7px 16px;border-radius:30px;background:#00c6ff20;color:var(--cyan)}.state-pill.success{border-color:#28e87966}.state-pill.success strong{background:#28e879;color:#032414}.state-pill.error{border-color:#ff626266}.state-pill.error strong{background:#ff6262;color:#210707}
.actions{padding:0 26px 25px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.action-primary,.action-secondary{min-height:54px;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:30px;font-size:14px;font-weight:900;transition:transform .18s,box-shadow .18s}.action-primary{border:1px solid #5edcff;background:linear-gradient(100deg,#00b8ff,#00d7ed 55%,#008dff);color:#031323;box-shadow:0 0 20px #00c6ff44}.action-secondary{border:1px solid #00c6ff99;background:#061a31;color:#4bdcff}.action-primary svg,.action-secondary svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.action-primary:active,.action-secondary:active{transform:scale(.98)}.support-note{margin:0 20px 22px;text-align:center;color:#899db4;font-size:11px;line-height:1.6}.support-note a{color:var(--cyan);font-weight:800;text-decoration:underline}.loading,.error-box{padding:55px 20px;text-align:center;color:#c2d4e8}.loading .spinner{width:34px;height:34px;margin:0 auto 15px;border:3px solid #00c6ff22;border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}.error-box strong{display:block;margin-bottom:8px;color:#fff;font-size:18px}.error-box a{color:var(--cyan);font-weight:800}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
@media(max-width:640px){body{padding:8px 0 22px}.topbar{width:calc(100% - 22px);min-height:53px;margin-bottom:9px;gap:7px}.brand-mark{width:37px;height:37px;border-radius:12px;font-size:22px}.brand-name{font-size:18px}.brand-name span{font-size:12px;letter-spacing:1.6px}.top-link{min-height:38px;padding:0 10px;font-size:10px}.top-link .desktop-label{display:none}.top-link svg{width:18px;height:18px}main{width:calc(100% - 14px)}.checkout-card{border-radius:18px}.checkout-head{padding:17px 14px 14px}.head-title{gap:10px}.cart-icon{width:40px;height:40px;border-radius:12px}.head-title h1{font-size:29px}.head-title p{font-size:11px;line-height:1.4}.progress{margin:19px 0 0}.progress:before,.progress-fill{top:13px;height:2px}.step{gap:7px;font-size:9px;line-height:1.25}.step-dot{width:28px;height:28px;font-size:12px}.status-hero{padding:24px 14px 20px}.status-symbol{width:66px;height:66px;margin-bottom:12px}.status-symbol svg{width:33px;height:33px}.status-hero h2{font-size:34px}.status-hero p{font-size:12px;line-height:1.6}.status-note{font-size:10px;margin-top:11px}.details{margin:0 11px 15px;border-radius:15px}.details-title{padding:13px 13px;font-size:14px}.details-body{grid-template-columns:1fr;gap:14px;padding:14px}.product-side{gap:12px;align-items:center}.product-art{width:78px;height:78px;flex-basis:78px;border-radius:13px;font-size:30px}.field-label{font-size:10px}.field-value{font-size:13px}.product-info .info-block+.info-block{margin-top:9px}.order-side{padding:13px 0 0;border-left:0;border-top:1px solid #168bcb55;display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}.price-value{font-size:22px}.order-code{font-size:11px}.date-value{font-size:11px}.extra-details{padding:0 14px 14px;font-size:10px}.state-pill{margin:0 11px 15px;padding:10px 12px;gap:8px;font-size:11px}.state-pill strong{padding:6px 12px}.actions{padding:0 12px 18px;grid-template-columns:1fr;gap:9px}.action-primary,.action-secondary{min-height:49px;font-size:13px}.support-note{margin:0 15px 17px;font-size:10px}}
@media(max-width:360px){.brand-name{font-size:16px}.head-title h1{font-size:26px}.status-hero h2{font-size:30px}.step{font-size:8px}.product-art{width:68px;height:68px;flex-basis:68px}.order-side{grid-template-columns:1fr}.price-value{font-size:20px}}
</style>
</head>
<body>
<header class="topbar">
 <a class="brand" href="index.html" aria-label="Gamers Gold Top-Up, inicio"><span class="brand-mark" aria-hidden="true">ϟ</span><span class="brand-name">GAMERS GOLD<span>TOP-UP</span></span></a>
 <div class="top-actions">
  <a class="top-link" href="mis-compras.html"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h5"/></svg><span class="desktop-label">Mis compras</span></a>
  <a class="top-link" href="soporte.html"><svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 12H2v6h4v-6H4Zm16 0h2v6h-4v-6h2Z"/></svg><span class="desktop-label">Soporte</span></a>
 </div>
</header>
<main>
 <section class="checkout-card" aria-labelledby="checkout-title">
  <div class="checkout-head">
   <div class="head-title"><span class="cart-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h2l2.7 13.1a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L22 7H5"/></svg></span><div><h1 id="checkout-title">Checkout</h1><p>Consulta el estado de tu pedido en tiempo real.</p></div></div>
   <div class="progress" aria-label="Progreso del pedido">
    <div class="progress-fill" id="progress-fill"></div>
    <div class="step" id="step-received"><span class="step-dot">1</span><span>Pedido recibido</span></div>
    <div class="step" id="step-processing"><span class="step-dot">2</span><span>Procesando</span></div>
    <div class="step" id="step-completed"><span class="step-dot">3</span><span>Pedido completado</span></div>
   </div>
  </div>
  <div id="checkout-content"><div class="loading"><div class="spinner"></div>Estamos cargando los datos reales de tu pedido…</div></div>
 </section>
</main>
<script type="module">
import { supabase } from "./supabase-client.js";

const content=document.getElementById("checkout-content");
const params=new URLSearchParams(location.search);
const orderCode=(params.get("order")||"").trim();
let currentOrder=null;
let channel=null;
let pollTimer=null;
let polling=false;
const receivedOnEntry=params.get("received")==="1";
const gameImages={
 "free-fire":"fuentes/free_fire.webp",
 "mobile-legends":"fuentes/grok_1795312374293.webp",
 "pubg-mobile":"fuentes/grok_1795312370899.webp",
 "genshin-impact":"fuentes/genshin_impact.webp",
 "honor-of-kings":"fuentes/honor_of_kings.webp",
 "arena-breakout":"fuentes/arena_breakout.webp",
 "blood-strike":"fuentes/blood_strike.webp",
 "call-of-duty-mobile":"fuentes/call_of_duty.webp"
};
const gameNames={
 "free-fire":"Free Fire","mobile-legends":"Mobile Legends","pubg-mobile":"PUBG Mobile",
 "genshin-impact":"Genshin Impact","honor-of-kings":"Honor of Kings","arena-breakout":"Arena Breakout",
 "blood-strike":"Blood Strike","call-of-duty-mobile":"Call of Duty Mobile","steam":"Steam",
 "google-play":"Google Play","playstation":"PlayStation","xbox":"Xbox","nintendo":"Nintendo"
};
function safe(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function formatDate(value){const d=new Date(value);return Number.isNaN(d.getTime())?"Fecha no disponible":d.toLocaleString("es",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function currency(value){const n=Number(value);return Number.isFinite(n)?n.toFixed(2)+" USDT":"—";}
function gameKey(row){const sku=String(row.product_sku||"").split("/");return (row.game||sku[1]||"").toLowerCase().replace(/_/g,"-").replace(/\s+/g,"-");}
function isGift(row){return String(row.product_sku||"").startsWith("giftcard/");}
function render(row){
 currentOrder=row;
 const status=String(row.status||"pending").toLowerCase();
 const failed=status==="failed",completed=status==="completed",received=receivedOnEntry||completed;
 const key=gameKey(row),game=gameNames[key]||String(row.game||"Compra digital").replace(/-/g," ");
 const parts=String(row.product_sku||"").split("/");
 const product=String(row.description||parts.slice(3).join("/")||"Producto digital");
 const gift=isGift(row);
 const title=failed?"Pedido no completado":completed?"¡Compra exitosa!":received?"Tu pedido fue recibido":"Estamos confirmando tu pedido";
 const headline=failed?"No se pudo completar la compra":completed?"¡Compra <span>exitosa!</span>":received?"Tu pedido fue <span>recibido</span>":"Pedido en confirmación";
 const message=failed?"El proveedor no pudo completar esta operación. El estado de tu pedido y su reembolso se reflejan en tu historial.":completed?"Tu recarga se ha completado correctamente. Gracias por confiar en Gamers Gold Top-Up.":received?"RechargeGames recibió tu pedido y está trabajando en la entrega. El estado se actualizará automáticamente.":"Tu compra quedó registrada. Estamos esperando la confirmación de recepción del proveedor. No repitas la compra.";
 const symbol=failed?"×":completed?"✓":received?"✓":"…";
 const stateText=failed?"Fallido / Reembolsado":completed?"Completado":received?"Procesando":"Esperando al proveedor";
 const image=gameImages[key];
 const artwork=image?'<img src="'+safe(image)+'" alt="'+safe(game)+'" onerror="this.remove()">':(gift?"▣":"✦");
 const player=gift?"":row.player_id?'<span><b>Player ID:</b> '+safe(row.player_id)+'</span>':"";
 const server=gift?"":row.server_id?'<span><b>Servidor / Zona:</b> '+safe(row.server_id)+'</span>':"";
 const email=gift&&row.delivery_email?'<span><b>Correo de entrega:</b> '+safe(row.delivery_email)+'</span>':"";
 const steps=failed?0:completed?100:received?50:0;
 document.getElementById("progress-fill").style.width=steps+"%";
 [["step-received",failed?false:received||completed, !received&&!completed&&!failed],
  ["step-processing",completed||received,received&&!completed&&!failed],
  ["step-completed",completed,false]].forEach(([id,done,active])=>{
   const node=document.getElementById(id);node.classList.toggle("done",!!done);node.classList.toggle("active",!!active);node.classList.toggle("failed",failed&&id==="step-completed");
   node.querySelector(".step-dot").textContent=done?"✓":id==="step-completed"&&failed?"!":id==="step-received"?"1":id==="step-processing"?"2":"3";
  });
 content.innerHTML='<div class="status-hero"><div class="status-symbol '+(completed?"success":failed?"error":"")+'"><svg viewBox="0 0 24 24"><path d="'+(failed?"M6 6l12 12M18 6 6 18":completed||received?"M5 12.5l4.5 4.5L19 7":"M12 5v7m0 4h.01")+'"/></svg></div><h2>'+headline+'</h2><p>'+message+'</p><div class="status-note">'+(completed?"✓ Entrega confirmada por el proveedor":failed?"Estado final confirmado":received?"✓ Recepción confirmada · Seguimiento automático":"◷ No vuelvas a enviar el pedido")+'</div></div>'+
 '<section class="details" aria-label="Detalles del pedido"><div class="details-title"><svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H5V3zM15 3v5h5M8 12h8M8 16h8"/></svg>Detalles de tu pedido</div><div class="details-body"><div class="product-side"><div class="product-art">'+artwork+'</div><div class="product-info"><div class="info-block"><span class="field-label">'+(gift?"Gift Card:":"Juego:")+'</span><strong class="field-value">'+safe(game)+'</strong></div><div class="info-block"><span class="field-label">Producto:</span><strong class="field-value">'+safe(product)+'</strong></div></div></div><div class="order-side"><div><span class="field-label">Precio:</span><strong class="price-value">'+currency(row.amount_usdt)+'</strong></div><div><span class="field-label">Pedido N.º:</span><strong class="field-value order-code">'+safe(row.order_code)+'</strong></div><div><span class="field-label">Fecha:</span><strong class="field-value date-value">'+safe(formatDate(row.created_at))+'</strong></div></div></div><div class="extra-details" '+(player||server||email?"":"hidden")+'>'+player+server+email+'</div></section>'+
 '<div class="state-pill '+(completed?"success":failed?"error":"")+'"><span>Estado del pedido:</span><strong>'+stateText+'</strong></div>'+
 '<div class="actions"><a class="action-primary" href="index.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Volver al inicio</a><a class="action-secondary" href="soporte.html"><svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2M4 12H2v6h4v-6H4Zm16 0h2v6h-4v-6h2Z"/></svg>Contactar soporte</a></div>'+
 '<p class="support-note">Puedes consultar este pedido en <a href="mis-compras.html">Mis compras</a>. Si necesitas ayuda, <a href="soporte.html">contacta con soporte</a>.</p>';
 document.title=(completed?"Compra completada":failed?"Pedido fallido":"Seguimiento del pedido")+" — Gamers Gold Top-Up";
}
async function loadOrder(showLoading=true){
 if(showLoading)content.innerHTML='<div class="loading"><div class="spinner"></div>Estamos cargando los datos reales de tu pedido…</div>';
 const {data,error}=await supabase.from("usdt_orders").select("id,order_code,user_id,amount_usdt,description,status,created_at,completed_at,failed_at,product_sku,player_id,game,server_id,delivery_email").eq("order_code",orderCode).maybeSingle();
 if(error)throw error;
 if(!data)throw new Error("No encontramos este pedido en tu cuenta.");
 currentOrder=data;render(data);return data;
}
async function pollProvider(){
 if(polling||!currentOrder||currentOrder.status!=="pending")return;
 polling=true;
 try{
  await supabase.functions.invoke("rechargegames-consultar-pedido",{body:{usdt_order_id:currentOrder.id}});
  const fresh=await loadOrder(false);
  if(fresh.status!=="pending"&&pollTimer){clearInterval(pollTimer);pollTimer=null;}
 }catch(error){console.warn("No se pudo actualizar el estado del proveedor:",error);}
 finally{polling=false;}
}
async function start(){
 if(!orderCode){content.innerHTML='<div class="error-box"><strong>No encontramos el pedido</strong>Abre el Checkout desde la confirmación de una compra.<p><a href="mis-compras.html">Ir a Mis compras</a></p></div>';return;}
 const {data:{user},error}=await supabase.auth.getUser();
 if(error||!user){const next="checkout.html"+location.search;location.replace("login.html?returnTo="+encodeURIComponent(next));return;}
 try{
  const order=await loadOrder();
  if(order.user_id!==user.id)throw new Error("No tienes permiso para consultar este pedido.");
  channel=supabase.channel("checkout-order-"+order.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"usdt_orders",filter:"id=eq."+order.id},payload=>{
   if(payload.new?.id!==currentOrder?.id)return;
   render({...currentOrder,...payload.new});
   if(["completed","failed"].includes(payload.new.status)&&pollTimer){clearInterval(pollTimer);pollTimer=null;}
  }).subscribe();
  if(order.status==="pending"){
   pollProvider();
   pollTimer=window.setInterval(pollProvider,18000);
  }
 }catch(error){
  console.error("CHECKOUT_LOAD_FAILED",error);
  content.innerHTML='<div class="error-box"><strong>No pudimos cargar tu pedido</strong>'+safe(error?.message||"Comprueba tu conexión e inténtalo de nuevo.")+'<p><a href="mis-compras.html">Consultar Mis compras</a></p></div>';
 }
}
window.addEventListener("pagehide",()=>{if(pollTimer)clearInterval(pollTimer);if(channel)supabase.removeChannel(channel);});
start();
</script>
</body>
</html>
