<script type="module">
import { supabase, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-client.js";

const { data: { user: verifiedUser }, error: authError } = await supabase.auth.getUser();
if (authError || !verifiedUser) {
  window.location.replace("login.html");
  throw new Error("auth_required");
}
const { data: { session: entrySession }, error: sessionError } = await supabase.auth.getSession();
if (sessionError || !entrySession?.access_token || entrySession.user?.id !== verifiedUser.id) {
  window.location.replace("login.html");
  throw new Error("session_unavailable");
}
let activeSession = entrySession;
supabase.auth.onAuthStateChange((_event, session) => {
  activeSession = session;
  if (!session) window.location.replace("login.html");
});
const GAME="roblox";
const CATALOG_URL="https://fyyebxjysrhcxgmgperf.supabase.co/functions/v1/public-game-catalog";
const message=document.getElementById("message");
const packages=document.getElementById("packages");
const regions=document.getElementById("regions");
const buyButton=document.getElementById("buy-button");
const playerSection=document.getElementById("player-title").closest(".section");
const playerInput=document.getElementById("player-id");

const validationResult=document.createElement("div");
validationResult.className="validation-result";
validationResult.setAttribute("role","status");
validationResult.setAttribute("aria-live","polite");
playerSection.append(validationResult);
let validationTimer=null;
let validationRequest=0;
function showValidation(text,state=""){
 validationResult.textContent=text;
 validationResult.className="validation-result show"+(state?" "+state:"");
}
function clearValidation(){
 validationResult.textContent="";
 validationResult.className="validation-result";
}
async function verifyPlayer(){
 const playerId=playerInput?.value.trim()||"";
 const requestId=++validationRequest;
 if(!/^\d{5,20}$/.test(playerId)||!selectedRegion)return;
 const product=selectedProduct||products.find(p=>p.region===selectedRegion&&p.requiresPlayerId&&p.supportsPlayerValidation);
 if(!product||!product.requiresPlayerId||!product.supportsPlayerValidation)return;
 const zoneId=document.getElementById("provider-zone-id")?.value.trim()||"";
 if(product.requiresZoneId&&!zoneId){showValidation("Ingresa también tu Zone ID para verificar esta cuenta.","error");return;}
 try{
  const {data:sessionData,error:sessionError}=await supabase.auth.getSession();
  if(requestId!==validationRequest||playerInput.value.trim()!==playerId)return;
  if(sessionError||!sessionData?.session?.access_token)throw new Error("Inicia sesión para verificar tu cuenta.");
  const response=await fetch(SUPABASE_URL+"/functions/v1/nextlevel-player-validate",{
   method:"POST",
   headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+sessionData.session.access_token,"Content-Type":"application/json",Accept:"application/json"},
   body:JSON.stringify({game:GAME,productId:product.productId,playerId,zoneId:zoneId||undefined})
  });
  const data=await response.json().catch(()=>({}));
  if(requestId!==validationRequest||playerInput.value.trim()!==playerId)return;
  if(!response.ok||!data.ok){
   const messages={INVALID_PLAYER_ID:"El Player ID debe contener entre 5 y 20 números.",ZONE_ID_REQUIRED:"Este producto requiere un Zone ID.",INVALID_ZONE_ID:"El Zone ID no tiene un formato válido.",PLAYER_VALIDATION_NOT_SUPPORTED:"Este producto no permite verificar el jugador.",PLAYER_NOT_FOUND:"No encontramos una cuenta con ese Player ID.",NICKNAME_NOT_RETURNED:"El proveedor no devolvió el nickname.",UPSTREAM_TIMEOUT:"La verificación tardó demasiado. Inténtalo otra vez."};
   throw new Error(messages[data.error]||"No se pudo verificar el Player ID.");
  }
  showValidation("✓ "+data.nickname,"success");
 }catch(error){
  if(requestId!==validationRequest||playerInput.value.trim()!==playerId)return;
  showValidation(error instanceof Error?error.message:"No se pudo verificar la cuenta.","error");
 }
}
function schedulePlayerValidation(){
 clearTimeout(validationTimer);validationRequest++;clearValidation();
 if(!/^\d{5,20}$/.test(playerInput?.value.trim()||""))return;
 validationTimer=setTimeout(verifyPlayer,650);
}
const pasteButton=document.getElementById("player-paste");
pasteButton?.addEventListener("click",async()=>{
 try{
  if(!navigator.clipboard?.readText) throw new Error("Tu navegador no permite leer el portapapeles. Mantén pulsado el campo y selecciona Pegar.");
  const pastedText=await navigator.clipboard.readText();
  const value=String(pastedText||"").trim();
  if(!value){notify("El portapapeles está vacío.");return;}
  playerInput.value=value;
  playerInput.dispatchEvent(new Event("input",{bubbles:true}));
  playerInput.focus();
 }catch(error){
  notify(error?.message||"No se pudo pegar. Mantén pulsado el campo y selecciona Pegar.");
 }
});
playerInput?.addEventListener("input",schedulePlayerValidation);
document.addEventListener("input",event=>{if(event.target?.id==="provider-zone-id")schedulePlayerValidation();});

let products=[];
let resellerDiscountPercent=0;
let resellerPricingLoaded=false;
let selectedProduct=null;
let selectedCategory="currency";
     buyButton.disabled=true;
let selectedRegion="";
function notify(text){message.textContent=text;message.classList.add("show")}
function safeText(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function renderRegions(){
 const values=[...new Set(products.map(p=>p.region||"Global"))].sort((a,b)=>a.localeCompare(b,"es"));
 regions.innerHTML="";
 if(values.length>1){
   const prompt=document.createElement("div");
   prompt.className="catalog-prompt";
   prompt.textContent="Selecciona la región para ver los productos disponibles";
   regions.append(prompt);
   selectedRegion="";
 }else{
   selectedRegion=values[0]||"";
 }
 values.forEach(region=>{
   const button=document.createElement("button");
   button.type="button";button.className="choice"+(region===selectedRegion?" selected":"");
   button.dataset.value=region;button.textContent=region;
   button.addEventListener("click",()=>{
     selectedRegion=region;
     selectedProduct=null;
     clearValidation();
     regions.querySelectorAll(".choice").forEach(el=>el.classList.toggle("selected",el===button));
     renderProducts();
   });
   regions.append(button);
 });
}
function productAmount(product){
 const direct=[product.amount,product.quantity,product.denomination,product.value].find(value=>value!==null&&value!==undefined&&value!==""&&Number.isFinite(Number(value))&&Number(value)>0);
 if(direct!==undefined) return Number(direct);
 const match=String(product.name||"").replace(/,/g,"").match(/\d+(?:\.\d+)?/);
 return match?Number(match[0]):0;
}
function isCurrencyPack(product){
 const name=String(product?.name||"").toLowerCase();
 return /diamantes?|diamonds?|bonds?|\bcp\b|tokens?|cristales\s+g[eé]nesis|genesis\s+crystals?|crystals?|\buc\b|robux|\bgold\b/i.test(name);
}
function priceForProduct(product){
 const base=Number(product?.priceUSDT);
 if(!Number.isFinite(base)||base<=0)return 0;
 return resellerDiscountPercent>0?Math.round((base*(1-resellerDiscountPercent/100))*100)/100:base;
}
function renderProducts(){
  packages.innerHTML="";
  const visible=products.filter(p=>!selectedRegion||p.region===selectedRegion);
  if(!selectedRegion){packages.innerHTML='<div class="catalog-state">Selecciona una región para cargar sus productos.</div>';return;}
  if(!visible.length){packages.innerHTML='<div class="catalog-state">No hay productos disponibles para esta región.</div>';return;}
  const currencyGroup=document.createElement("section");currencyGroup.className="package-group";
  currencyGroup.innerHTML='<h3 class="section-head"><span class="ico">R$</span>Robux</h3><div class="packages"></div>';
  const extraGroup=document.createElement("section");extraGroup.className="package-group";
  extraGroup.innerHTML='<h3 class="section-head"><span class="ico">🎁</span>Ofertas Extra</h3><div class="packages"></div>';
  const activeGroup=selectedCategory==="currency"?currencyGroup:extraGroup;packages.append(activeGroup);const activeContainer=activeGroup.querySelector(".packages");
  const currencyProducts=visible.filter(isCurrencyPack).sort((a,b)=>productAmount(a)-productAmount(b)||Number(a.priceUSDT||0)-Number(b.priceUSDT||0));
  const extraProducts=visible.filter(p=>!isCurrencyPack(p)).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"es"));
  function renderGroup(list,container){
    if(!list.length){const empty=document.createElement("div");empty.className="package-empty";empty.textContent="No hay productos disponibles.";container.append(empty);return;}
    list.forEach(product=>{
      const button=document.createElement("button");button.type="button";button.className="package"+(selectedProduct?.productId===product.productId?" selected":"");button.dataset.productId=product.productId;
      const icon=product.type==="GIFT_CARD"?"🎁":"R$";
      button.innerHTML=(resellerDiscountPercent>0?'<span class="reseller-discount-badge">-'+resellerDiscountPercent+'%</span>':'')+'<span class="diamond">'+icon+'</span><strong>'+safeText(product.name)+'</strong><small class="price-usdt">'+(typeof product.priceUSDT==="number"?priceForProduct(product).toFixed(2)+" USDT":"Precio no disponible")+'</small><small class="region-label">'+safeText(product.region)+'</small>';
      button.addEventListener("click",()=>{selectedProduct=product;clearValidation();buyButton.disabled=false;packages.querySelectorAll(".package").forEach(el=>el.classList.toggle("selected",el===button));updateRequirements();});
      container.append(button);
    });
  }
  renderGroup(selectedCategory==="currency"?currencyProducts:extraProducts,activeContainer);
}
function setProductCategory(category){
 if(!["currency","offers"].includes(category)||selectedCategory===category)return;
 selectedCategory=category;selectedProduct=null;clearValidation();buyButton.disabled=true;
 buyButton.textContent=category==="offers"?"Comprar oferta":"Recargar ahora";
 const currencyTab=document.getElementById("tab-currency"),offersTab=document.getElementById("tab-offers");
 currencyTab.classList.toggle("active",category==="currency");offersTab.classList.toggle("active",category==="offers");
 currencyTab.setAttribute("aria-selected",String(category==="currency"));offersTab.setAttribute("aria-selected",String(category==="offers"));
 renderProducts();updateRequirements();
}
document.getElementById("tab-currency").addEventListener("click",()=>setProductCategory("currency"));
document.getElementById("tab-offers").addEventListener("click",()=>setProductCategory("offers"));
buyButton.textContent="Recargar ahora";

function updateRequirements(){
buyButton.textContent=selectedCategory==="offers"?"Comprar oferta":"Recargar ahora";
 const needsPlayer=selectedProduct ? !!selectedProduct.requiresPlayerId : products.some(p=>p.requiresPlayerId);
 playerSection.hidden=!needsPlayer;
 const zoneId=document.getElementById("provider-zone-id");
 const needsZone=selectedProduct ? !!selectedProduct.requiresZoneId : products.some(p=>p.requiresZoneId);
 if(needsZone){
   if(!zoneId){
     const field=document.createElement("div");
     field.id="provider-zone-wrap";field.className="field-row";field.style.marginTop="9px";
     field.innerHTML='<div class="player-field"><input class="player-input" id="provider-zone-id" type="text" autocomplete="off" placeholder="Ingresa tu Zone ID..." aria-label="Zone ID"></div>';
     playerSection.querySelector(".field-row").after(field);
   }
 }else{
   document.getElementById("provider-zone-wrap")?.remove();
 }
}
function applyCatalogProducts(rawProducts){
 products=Array.isArray(rawProducts)?rawProducts.filter(p=>p.type==="TOPUP"&&typeof p.priceUSDT==="number"&&p.priceUSDT>0&&p.currency==="USDT"):[];
 if(!products.length){
   packages.innerHTML='<div class="catalog-state">No hay productos disponibles en este momento. Vuelve a intentarlo más tarde.</div>';
   regions.innerHTML="";
   playerSection.hidden=true;
   buyButton.disabled=true;
   return;
 }
 playerSection.hidden=false;
 renderRegions();
 renderProducts();
 updateRequirements();
}
function readPrefetchedCatalog(){
 for(const storage of [localStorage,sessionStorage]){
  try{
   const cached=JSON.parse(storage.getItem("iw_catalog_"+GAME)||"null");
   if(cached&&Array.isArray(cached.products)&&Date.now()-cached.savedAt<24*60*60*1000) return cached.products;
  }catch(error){}
 }
 return null;
}
async function loadCatalog(){
 buyButton.textContent="Recargar ahora";
 const cachedProducts=readPrefetchedCatalog();
 if(cachedProducts) applyCatalogProducts(cachedProducts);
 else { packages.replaceChildren(); buyButton.disabled=true; }
 try{
   const response=await fetch(CATALOG_URL+"?game="+encodeURIComponent(GAME),{method:"GET",headers:{Accept:"application/json",Authorization:"Bearer "+(activeSession?.access_token||"")}});
   const data=await response.json();
   if(!response.ok||!data.ok) throw new Error(data.error||"catalog_unavailable");
   resellerDiscountPercent=Number(data.reseller?.discountPercent)||0;
    resellerPricingLoaded=true;
    const freshProducts=Array.isArray(data.products)?data.products:[];
   const cacheEntry=JSON.stringify({products:freshProducts,savedAt:Date.now()});try{localStorage.setItem("iw_catalog_"+GAME,cacheEntry);}catch(error){}try{sessionStorage.setItem("iw_catalog_"+GAME,cacheEntry);}catch(error){}
   applyCatalogProducts(freshProducts);
 }catch(error){
   if(!cachedProducts){
     packages.innerHTML='<div class="catalog-state">No pudimos cargar el catálogo. Comprueba tu conexión e inténtalo de nuevo.</div>';
     notify("No se pudo conectar con el catálogo de Supabase.");
   }
 }
}
let purchaseInProgress=false;
let pendingClientReference="";
buyButton.addEventListener("click",async()=>{
 if(purchaseInProgress) return;
 if(!selectedProduct){notify("Selecciona primero un producto.");return;}
 const playerId=playerInput?.value.trim()||"";
 const zoneId=document.getElementById("provider-zone-id")?.value.trim()||"";
 if(selectedProduct.requiresPlayerId&&!playerId){notify("Ingresa tu Player ID antes de continuar.");playerInput?.focus();return;}
 if(selectedProduct.requiresZoneId&&!zoneId){notify("Ingresa tu Zone ID antes de continuar.");document.getElementById("provider-zone-id")?.focus();return;}
 if(!resellerPricingLoaded){notify("No se pudo comprobar tu nivel de revendedor. Actualiza el catálogo antes de comprar.");return;}
  const price=priceForProduct(selectedProduct);
 if(!Number.isFinite(price)||price<=0){notify("No se pudo comprobar el precio. Actualiza el catálogo.");return;}
 const accepted=window.confirm("¿Confirmas "+selectedProduct.name+" por "+price.toFixed(2)+" USDT? Se descontará de tu saldo.");
 if(!accepted) return;
 purchaseInProgress=true;
 buyButton.disabled=true;
 buyButton.textContent="Enviando pedido…";
 notify("Enviando el pedido de forma segura. No cierres esta página.");
 try{
   const accessToken=activeSession?.access_token;
   if(!accessToken) throw new Error("Tu sesión ya no está activa. Vuelve a iniciar sesión.");
   if(!pendingClientReference) pendingClientReference="IW-"+crypto.randomUUID().replace(/-/g,"");
   const clientReference=pendingClientReference;
   const response=await fetch(SUPABASE_URL+"/functions/v1/nextlevel-crear-pedido",{
     method:"POST",
     headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+accessToken,"Content-Type":"application/json",Accept:"application/json"},
     body:JSON.stringify({productId:selectedProduct.productId,game:GAME,playerId,zoneId,clientReference})
   });
   const data=await response.json().catch(()=>({}));
   if(response.status===402&&data.error==="insufficient_usdt_balance"){
     pendingClientReference="";
     notify("Saldo USDT insuficiente. No se realizó el pedido.");
   }else if(data.refunded===true){
     pendingClientReference="";
     notify("Error al crear el pedido. El saldo fue reembolsado.");
   }else if(response.status===202||data.error==="provider_submission_pending_confirmation"){
     notify("Pedido pendiente de confirmación. No repitas la compra; consulta soporte. Código: "+(data.order?.code||"pendiente"));
   }else if(!response.ok||!data.ok){
     throw new Error(data.error==="wallet_not_found"?"No encontramos tu monedero USDT.":(data.error||"No se pudo crear el pedido."));
   }else{
     const status=data.order?.status||"pending";
     pendingClientReference="";
     notify("Pedido "+(status==="completed"?"completado":status==="failed"?"rechazado y reembolsado":"enviado; pendiente del proveedor")+". Código: "+(data.order?.code||"—")+".");
   }
 }catch(error){
   notify(error instanceof Error?error.message:"Error al procesar. Si no sabes si se creó, consulta soporte antes de reintentar.");
 }finally{
   purchaseInProgress=false;
   buyButton.disabled=!selectedProduct;
   buyButton.textContent="Recargar ahora";
 }
});
playerInput?.addEventListener("input",()=>message.classList.remove("show"));
loadCatalog();
</script>
