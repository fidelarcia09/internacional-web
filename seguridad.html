<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="Seguridad de tu cuenta de Internacional Web.">
<title>Seguridad — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0d;--orange:#ff7900;--white:#f5f4f1;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#ff790012,transparent 42%),var(--bg);color:var(--white);font-family:var(--font);padding-bottom:80px}
a{color:inherit;text-decoration:none}
main{width:min(90%,510px);margin:22px auto 35px}
.page-kicker{text-align:center;color:var(--orange);font-size:9px;font-weight:800;letter-spacing:2px;margin:0 0 8px}
h1{font:900 clamp(42px,10vw,58px)/.95 var(--display);text-align:center;letter-spacing:.4px;margin:0 0 26px}
.security-options{display:grid;gap:13px}
.security-option{min-height:91px;display:grid;grid-template-columns:54px minmax(0,1fr) 22px;align-items:center;gap:14px;padding:15px 17px;border:1px solid #ff790078;border-radius:17px;background:linear-gradient(105deg,#17110c,#0d0e11 65%);box-shadow:inset 0 0 16px #ff79000b;transition:border-color .18s,box-shadow .18s,transform .18s}
.security-icon{width:49px;height:49px;border-radius:14px;display:grid;place-items:center;background:#ffffff08;border:1px solid #ffffff12;color:#e8e9ed}
.security-icon svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.security-icon .accent{stroke:#ff922e}
.security-copy strong{display:block;font-size:14px;font-weight:700;letter-spacing:.1px;margin-bottom:5px}
.security-copy small{display:block;color:#9699a2;font-size:10px;line-height:1.4}
.security-arrow{font-size:29px;line-height:1;color:var(--orange);text-align:right;font-weight:400}
.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:65px;background:#101217f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;height:60px;color:#777}
.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav small{font-size:8px;letter-spacing:.2px}
.mobile-nav a.current{color:var(--orange)}
.mobile-nav a.current:before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:66px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#ff700059 0%,#ff700026 42%,transparent 75%);filter:blur(5px)}
.mobile-nav a.current svg{filter:drop-shadow(0 0 4px #ff7d00) drop-shadow(0 0 9px #ff690073)}
.mobile-nav a.current small{text-shadow:0 0 8px #ff780059}
@media(max-width:620px){main{margin:22px auto 28px;width:90%}h1{margin-bottom:22px}.security-options{gap:10px}.security-option{min-height:82px;padding:12px 13px;grid-template-columns:48px minmax(0,1fr) 18px;gap:12px;border-radius:15px}.security-icon{width:44px;height:44px;border-radius:12px}.security-copy strong{font-size:13px}.security-copy small{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
<style id="mobile-nav-final-unified">
@media(max-width:620px){
  .mobile-nav{
    position:fixed!important;z-index:10!important;left:0!important;right:0!important;bottom:0!important;
    display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;
    gap:0!important;height:calc(64px + env(safe-area-inset-bottom))!important;
    box-sizing:border-box!important;padding:3px 1% env(safe-area-inset-bottom)!important;
    align-items:center!important;justify-content:initial!important;background:#080808f5!important;
    border:0!important;border-top:1px solid #292929!important;
    backdrop-filter:blur(15px)!important;isolation:isolate!important
  }
  .mobile-nav:before{
    content:""!important;position:absolute!important;z-index:0!important;
    top:5px!important;left:1%!important;width:19.6%!important;height:39px!important;
    border:0!important;border-radius:50%!important;outline:0!important;
    background:radial-gradient(ellipse at center,rgba(255,112,0,.30) 0%,rgba(255,112,0,.14) 42%,rgba(255,112,0,0) 76%)!important;
    box-shadow:none!important;filter:blur(2px)!important;
    transform:translateX(calc(var(--active-index,0)*100%))!important;
    transition:transform .62s cubic-bezier(.22,1.38,.42,1)!important;
    pointer-events:none!important
  }
  .mobile-nav a{
    position:relative!important;z-index:1!important;isolation:isolate!important;
    display:flex!important;flex-direction:column!important;align-items:center!important;
    justify-content:center!important;gap:1px!important;min-width:0!important;height:50px!important;
    color:#858585!important;transition:color .22s ease!important
  }
  .mobile-nav svg{
    width:20px!important;height:20px!important;fill:none!important;stroke:currentColor!important;
    stroke-width:2!important;stroke-linecap:round!important;stroke-linejoin:round!important;filter:none!important
  }
  .mobile-nav small{font-size:7.5px!important;letter-spacing:.2px!important;color:inherit!important;text-shadow:none!important}
  .mobile-nav a:hover,.mobile-nav a.current{color:#ff8700!important}
  .mobile-nav a.current:before{content:none!important;display:none!important}
  .mobile-nav a.current svg{filter:drop-shadow(0 0 2px rgba(255,135,0,.35))!important}
}
@media(prefers-reduced-motion:reduce){.mobile-nav:before{transition:none!important}}
</style>
</head>
<body>
<main>
<p class="page-kicker">TU PERFIL</p>

<span class="security-copy"><strong>Cerrar sesión en todos los dispositivos</strong><small>Finaliza las sesiones abiertas de tu cuenta</small></span>

</div>
</section>
</main>

<a href="revendedores.html" aria-label="Revendedores"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.4-5 6-5s6 1.7 6 5m1-10 2 2 4-4m-5 9h5"/></svg><small>Revendedores</small></a>

</nav>
</body>
</html>
