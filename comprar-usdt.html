<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090706">
<meta name="description" content="Comprar USDT en Internacional Web.">
<link rel="preload" as="image" href="fuentes/novatopup_tienda_banner.webp" type="image/webp" fetchpriority="high">
<title>Comprar USDT — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080706;--panel:#100d0a;--orange:#ff8500;--orange2:#ffb000;--white:#f8f7f4;--muted:#99918a;--line:rgba(255,137,0,.34);--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;padding:7px 0 86px;background:radial-gradient(ellipse at 50% 0%,#ff79001c,transparent 38%),#080706;color:var(--white);font-family:var(--font)}
a{color:inherit;text-decoration:none}
main{width:min(1180px,98%);margin:0 auto}
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;margin-bottom:13px;border:1px solid #ff8a304d;border-radius:17px;background:linear-gradient(110deg,#160d06,#090807 52%,#170c04);box-shadow:0 0 22px #ff6a0012,inset 0 0 18px #ff6a000a}
.topbar a{width:38px;height:38px;display:grid;place-items:center;border:1px solid #ff9a3c;border-radius:12px;color:#ffae22;background:#120b06}
.topbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{font:900 19px var(--display);letter-spacing:.5px;text-align:center}.brand em{font-style:normal;color:var(--orange)}
.banner{position:relative;z-index:0;overflow:hidden;border:0;border-radius:0;background:transparent;margin:0 0 -34px;transform:perspective(1000px) rotateX(1.5deg) scale(1.055);transform-origin:center bottom;filter:drop-shadow(0 15px 12px #000c)}
.banner img{display:block;width:100%;height:clamp(135px,20vw,215px);object-fit:cover;object-position:center;transform:scale(1.055);transform-origin:center 42%;filter:saturate(1.04) contrast(1.02);-webkit-mask-image:linear-gradient(to bottom,#000 42%,rgba(0,0,0,.96) 58%,rgba(0,0,0,.78) 72%,rgba(0,0,0,.42) 86%,transparent 100%);mask-image:linear-gradient(to bottom,#000 42%,rgba(0,0,0,.96) 58%,rgba(0,0,0,.78) 72%,rgba(0,0,0,.42) 86%,transparent 100%)}
.banner:after{content:"";position:absolute;inset:-14px -8px -18px;pointer-events:none;background:linear-gradient(180deg,transparent 34%,#100c0908 48%,#100c0928 62%,#100c0968 76%,#100c09c9 91%,#100c09 100%);filter:blur(13px);transform:scaleY(1.08);transform-origin:center bottom}
.heading{padding:5px 5px 9px}
.eyebrow{display:flex;align-items:center;gap:9px;color:#ffad4a;font-size:9px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase}
.eyebrow:before{content:"";width:23px;height:2px;background:var(--orange);box-shadow:0 0 9px var(--orange)}
h1{font:900 clamp(42px,8vw,70px)/.88 var(--display);letter-spacing:-1px;margin:10px 0 8px;text-transform:uppercase}
h1 em{color:var(--orange);font-style:normal;text-shadow:0 0 22px #ff710052}
.heading p{margin:0;color:#aaa19a;font-size:11px;line-height:1.7}
.order-panel{position:relative;z-index:1;overflow:hidden;width:calc(100% + 2vw);margin:15px -1vw 0;border:0;border-radius:0 0 22px 22px;padding:22px clamp(17px,3.5vw,30px) 22px;background:linear-gradient(180deg,#090807d9 0%,#090807ed 16%,#100c09 38%,#100c09 68%,#100c09e8 92%,#090807 100%);box-shadow:0 10px 28px #0008,inset 0 1px 0 #ffffff04}
.order-panel:before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 16px #ff79000a}
.section-title{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:800 clamp(21px,4vw,29px)/1.1 var(--display)}
.section-title .symbol{width:35px;height:35px;flex:0 0 35px;display:grid;place-items:center;color:var(--orange);filter:drop-shadow(0 0 8px #ff8b2b55)}
.section-title svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.packages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px 11px;margin-bottom:17px}
.package{position:relative;min-height:68px;display:flex;align-items:center;justify-content:center;gap:13px;border:1px solid #ff8b2b;border-radius:16px;background:linear-gradient(145deg,#120d09,#080706);color:#f7f4ef;font:800 clamp(23px,4vw,32px) var(--display);cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.package:hover{transform:translateY(-2px);box-shadow:0 0 15px #ff850033}
.package.selected{border:2px solid #ffb000;box-shadow:0 0 9px #ff9a00,0 0 25px #ff79004d,inset 0 0 15px #ff790018}
.package .coin{width:39px;height:39px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 28%,#38e6d1,#009f91 62%,#005b58);border:2px solid #36e8d3;box-shadow:0 0 10px #00d4bd50;color:#fff;font:900 23px var(--display)}
.package .check{position:absolute;right:-7px;top:-9px;width:27px;height:27px;border-radius:50%;display:none;place-items:center;background:#ffb000;color:#130a00;font-size:17px;font-weight:900}
.package.selected .check{display:grid}
.amount-area{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:start;margin-bottom:13px}
.field-label{display:block;margin:0 0 8px;color:#f2e9df;font-size:11px;font-weight:800}
.input-shell{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid #a95012;border-radius:12px;background:#090706;transition:.2s}
.input-shell:focus-within{border-color:#ffb000;box-shadow:0 0 0 3px #ff8a001c}
.input-shell .prefix{font-weight:800;color:#ff9a27}
.input-shell input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#fff;font:700 17px var(--font)}
.input-shell input:disabled{opacity:.7}
.helper{margin:7px 0 0;color:#8d837b;font-size:9px;line-height:1.5}
.receive{height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 13px;border:1px solid #237c60;border-radius:12px;background:linear-gradient(100deg,#092018,#0b120e)}
.receive small{display:block;color:#83b99f;font-size:9px;margin-bottom:4px}
.receive strong{font-size:18px;color:#65e6a6}
.receive .tether{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#00a88d;color:white;font:900 20px var(--display)}
.divider{height:1px;background:linear-gradient(90deg,transparent,#ff8a344d,transparent);margin:15px 0}
.pay-title{display:flex;align-items:center;gap:10px;margin:0 0 9px;font:800 clamp(20px,4vw,27px) var(--display)}
.pay-title svg{width:34px;height:34px;flex:0 0 34px;fill:none;stroke:var(--orange);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.address{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border:1px solid #a95012;border-radius:13px;background:#090706}
.address span{font-size:12px;color:#8d8580;line-height:1.5}
.copy{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border:1px solid #ff9b2b;border-radius:10px;background:#1a1007;color:#ffad22;opacity:.55;cursor:not-allowed}
.copy svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pay-button{width:100%;height:66px;margin:12px 0 15px;border:2px solid #ffd94d;border-radius:999px;background:linear-gradient(100deg,#ff8a00 0%,#ffb000 48%,#ff8500 100%);color:#160d05;font:900 clamp(24px,5vw,34px) var(--display);box-shadow:0 0 20px #ff880080,inset 0 2px 0 #fff8;opacity:1;cursor:not-allowed;display:flex;align-items:center;justify-content:center;gap:14px}
.pay-button svg{width:42px;height:34px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.txid-label{display:flex;align-items:center;gap:10px;margin:0 0 8px;font:800 clamp(18px,3.7vw,25px) var(--display)}
.txid-label svg{width:35px;height:35px;flex:0 0 35px;fill:none;stroke:var(--orange);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.txid{width:100%;height:55px;padding:0 14px;border:1px solid #a95012;border-radius:13px;background:#090706;color:#eee;font:500 13px var(--font);outline:0}
.txid::placeholder{color:#77716c}
.txid:disabled{opacity:.68}
.preview-note{display:flex;align-items:flex-start;gap:10px;margin-top:17px;padding:12px 13px;border:1px solid #68421b;border-radius:12px;background:#1b1309;color:#cdb48f;font-size:10px;line-height:1.65}
.preview-note b{color:#ffb34e}

.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:65px;background:#101010f5;border-top:1px solid #ffffff15;display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;height:60px;color:#777}
.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav small{font-size:8px;letter-spacing:.2px}
.mobile-nav a.current{color:var(--orange)}
.mobile-nav a.current:before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:66px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#ff700059 0%,#ff700026 42%,transparent 75%);filter:blur(5px)}
.mobile-nav a.current svg{filter:drop-shadow(0 0 4px #ff7d00) drop-shadow(0 0 9px #ff690073)}
.mobile-nav a.current small{text-shadow:0 0 8px #ff780059}
@media(max-width:620px){
 body{padding-top:9px}
 main{width:94%}
 .topbar{height:53px;margin-bottom:10px}
 .banner{margin:0 0 -27px;transform:perspective(800px) rotateX(1.5deg) scale(1.045)}
 .banner img{height:clamp(130px,40vw,170px);transform:scale(1.045)}
 .heading{padding:5px 3px 8px}
 .order-panel{width:calc(100% + 6vw);margin:13px -3vw 0;padding:19px 13px 15px;border-radius:0 0 19px 19px;background:linear-gradient(180deg,#090807d9 0%,#090807ed 16%,#100c09 38%,#100c09 68%,#100c09e8 92%,#090807 100%)}
 .packages{gap:8px 9px;margin-bottom:14px}
 .package{min-height:62px;gap:8px;border-radius:13px}
 .package .coin{width:32px;height:32px;font-size:19px}
 .amount-area{grid-template-columns:1fr;gap:9px;margin-bottom:10px}
 .pay-button{height:60px;margin:10px 0 13px}
 .mobile-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;height:calc(64px + env(safe-area-inset-bottom));padding:3px 1% env(safe-area-inset-bottom);background:#080808f5;border-top:1px solid #292929}
 .mobile-nav a{min-width:0;height:50px;gap:1px}
 .mobile-nav svg{width:20px;height:20px;stroke-width:2}
 .mobile-nav small{font-size:7.5px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
<div class="banner"><img src="fuentes/novatopup_tienda_banner.webp" alt="Banner de NovaTopUp" loading="eager" fetchpriority="high" decoding="sync"></div>
<section class="order-panel" aria-label="Comprar USDT">
<h2 class="section-title"><span class="symbol"><svg viewBox="0 0 36 36"><path d="M18 3 32 11v14L18 33 4 25V11L18 3Z"/><path d="m4 11 14 8 14-8M18 19v14"/></svg></span>Selecciona el paquete</h2>

<button class="package selected" type="button" data-amount="10" aria-pressed="true"><span class="coin">₮</span>10<span class="check">✓</span></button>
<button class="package" type="button" data-amount="25"><span class="coin">₮</span>25<span class="check">✓</span></button>
<button class="package" type="button" data-amount="50"><span class="coin">₮</span>50<span class="check">✓</span></button>
<button class="package" type="button" data-amount="75"><span class="coin">₮</span>75<span class="check">✓</span></button>
<button class="package" type="button" data-amount="100"><span class="coin">₮</span>100<span class="check">✓</span></button>
</div>
<div class="amount-area">
<div>
<label class="field-label" for="usd">Importe en USD</label>
<div class="input-shell"><span class="prefix">$</span><input id="usd" type="number" inputmode="decimal" min="1" max="100000" step="0.01" value="10"></div>

</div>
<div>
<span class="field-label">Recibirías (estimación)</span>

</div>
</div>
<div class="divider"></div>
<h2 class="pay-title"><svg viewBox="0 0 36 36"><path d="M18 3 31 9v10c0 8-5.5 12-13 15C10.5 31 5 27 5 19V9l13-6Z"/><circle cx="18" cy="17" r="5"/><path d="M18 22v5"/></svg>Dirección de pago</h2>
<div class="address"><span>La dirección estará disponible cuando se habiliten los pagos.</span><button class="copy" type="button" disabled aria-label="Copiar dirección"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3"/></svg></button></div>
<button class="pay-button" type="button" disabled><svg viewBox="0 0 48 36" aria-hidden="true"><rect x="3" y="4" width="42" height="28" rx="4" fill="currentColor" stroke="none"/><path d="M4 12h40M10 23h11M10 27h7" stroke="#ff9a00" stroke-width="2.5" stroke-linecap="round"/><rect x="30" y="22" width="8" height="5" rx="1" fill="#ff9a00" stroke="none"/></svg>Pagar</button>
<h2 class="txid-label"><svg viewBox="0 0 36 36"><path d="m18 3 13 6v10c0 8-5.5 12-13 15C10.5 31 5 27 5 19V9l13-6Z"/><path d="m11 18 5 5 10-11"/></svg>Ingresa el Hash de la transacción (TXID)</h2>
<input class="txid" type="text" placeholder="Escribe aquí el TXID..." disabled>

</section>
</main>
<nav class="mobile-nav" aria-label="Navegación inferior">
<a href="index.html" aria-label="Inicio"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><small>Inicio</small></a>
<a href="tienda.html" aria-label="Tienda"><svg viewBox="0 0 24 24"><path d="M3 9h18l-1.5 11h-15L3 9Z"/><path d="M7 9 9 4h6l2 5M9 13v3m6-3v3"/></svg><small>Tienda</small></a>
<a href="revendedores.html" aria-label="Revendedores"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.4-5 6-5s6 1.7 6 5m1-10 2 2 4-4m-5 9h5"/></svg><small>Revendedores</small></a>

<a href="cuenta.html" aria-label="Cuenta"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.4-6 8-6s7.3 2 8 6"/></svg><small>Cuenta</small></a>
</nav>
<script>
const usd=document.getElementById('usd');
const result=document.getElementById('result');
const packages=[...document.querySelectorAll('.package')];
function updateEstimate(){
 const amount=Number(usd.value);
 result.textContent=Number.isFinite(amount)&&amount>=0
  ?amount.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' USDT'
  :'— USDT';
}
function selectPackage(button){
 packages.forEach(item=>{
  const active=item===button;
  item.classList.toggle('selected',active);
  item.setAttribute('aria-pressed',String(active));
 });
 usd.value=button.dataset.amount;
 updateEstimate();
}
packages.forEach(button=>button.addEventListener('click',()=>selectPackage(button)));
usd.addEventListener('input',()=>{
 updateEstimate();
 packages.forEach(button=>{
  const active=Number(usd.value)===Number(button.dataset.amount);
  button.classList.toggle('selected',active);
  button.setAttribute('aria-pressed',String(active));
 });
});
updateEstimate();
</script>

<script>
// Guarda automáticamente el banner para que permanezca disponible al volver a abrir la página.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((error) => {
      console.warn("No se pudo activar la caché de imágenes:", error);
    });
  }, { once: true });
}
</script>
