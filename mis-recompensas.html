<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<meta name="description" content="Consulta tus recompensas y comparte tu enlace de referidos en Internacional Web.">
<title>Mis recompensas — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b18;--orange:#00c6ff;--white:#f5f4f1;--muted:#9699a2;--line:#ffffff16;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#00c6ff12,transparent 42%),var(--bg);color:var(--white);font-family:var(--font);padding-bottom:80px}
a{color:inherit;text-decoration:none}
.back{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid #34363d;border-radius:13px;color:#bbb;font-size:12px;font-weight:800;white-space:nowrap;margin:0 0 20px}.back svg{width:18px;height:18px;fill:none;stroke:var(--orange);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
main{width:min(90%,510px);margin:22px auto 35px}
.page-kicker{text-align:center;color:var(--orange);font-size:9px;font-weight:800;letter-spacing:2px;margin:0 0 8px}
h1{font:900 clamp(42px,10vw,58px)/.95 var(--display);text-align:center;letter-spacing:.4px;margin:0 0 9px}
.intro{text-align:center;color:#9699a2;font-size:11px;line-height:1.6;margin:0 auto 23px;max-width:330px}
.reward-summary{position:relative;overflow:hidden;display:flex;align-items:center;gap:15px;padding:18px 17px;margin-bottom:19px;border:1px solid var(--orange);border-radius:19px;background:linear-gradient(110deg,#0b171c,#101014 68%);box-shadow:inset 0 0 24px #00c6ff18,0 0 18px #00c6ff14}
.reward-summary:after{content:"";position:absolute;width:150px;height:150px;right:-55px;top:-80px;border-radius:50%;background:#00c6ff1c;filter:blur(22px);pointer-events:none}
.summary-icon{width:54px;height:54px;flex:0 0 54px;border:1px solid #2ecfff65;border-radius:16px;display:grid;place-items:center;background:#00c6ff12;color:#32caff}
.summary-icon svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.summary-copy{position:relative;z-index:1;min-width:0}
.summary-copy small{display:block;color:#57d3ff;font-size:8px;font-weight:800;letter-spacing:1.5px;margin-bottom:5px}
.summary-copy strong{display:block;font-size:15px;line-height:1.25;margin-bottom:4px}
.summary-copy span{display:block;color:#a4a5ac;font-size:10px;line-height:1.45}
.section-title{font:800 20px var(--display);letter-spacing:.6px;margin:0 0 11px}
.reward-list{display:grid;gap:11px}
.reward-card{min-height:105px;display:grid;grid-template-columns:53px minmax(0,1fr) 19px;align-items:center;gap:13px;padding:15px 14px;border:1px solid #00c6ff78;border-radius:17px;background:linear-gradient(105deg,#0d2342,#081a35 65%);box-shadow:inset 0 0 16px #00c6ff0b;transition:border-color .18s,box-shadow .18s,transform .18s}
.referral-entry{width:100%;color:inherit;text-decoration:none;text-align:left;cursor:pointer}.reward-card:hover{border-color:#22beff;box-shadow:0 0 15px #00c6ff1c;transform:translateY(-2px)}
.reward-icon{width:50px;height:50px;border:1px solid #ffffff14;border-radius:14px;display:grid;place-items:center;background:#ffffff08;color:#e8e9ed}
.reward-icon svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.reward-icon .accent{stroke:#2ecfff}
.reward-copy strong{display:block;font-size:14px;font-weight:700;margin-bottom:5px}
.reward-copy small{display:block;color:#9699a2;font-size:10px;line-height:1.5}
.reward-arrow{font-size:29px;line-height:1;color:var(--orange);text-align:right}
.bottom-note{text-align:center;color:#777b84;font-size:9px;line-height:1.6;margin:17px 8px 0}
.mobile-nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:65px;background:#101217f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;height:60px;color:#777}
.mobile-nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mobile-nav small{font-size:8px;letter-spacing:.2px}
.mobile-nav a.current{color:var(--orange)}
.mobile-nav a.current:before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:66px;height:44px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#00cfff59 0%,#00cfff26 42%,transparent 75%);filter:blur(5px)}
.mobile-nav a.current svg{filter:drop-shadow(0 0 4px #00c2ff) drop-shadow(0 0 9px #00d6ff73)}
.mobile-nav a.current small{text-shadow:0 0 8px #00c7ff59}
@media(max-width:620px){main{margin:22px auto 28px;width:94%}h1{margin-bottom:8px}.intro{margin-bottom:19px}.reward-summary{padding:15px 13px;gap:12px;border-radius:16px}.summary-icon{width:48px;height:48px;flex-basis:48px}.summary-copy strong{font-size:14px}.reward-list{gap:9px}.reward-card{min-height:94px;padding:12px;grid-template-columns:47px minmax(0,1fr) 17px;gap:11px;border-radius:15px}.reward-icon{width:44px;height:44px;border-radius:12px}.reward-copy strong{font-size:13px}.reward-copy small{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
<style id="mobile-nav-final-unified">
@media(max-width:620px){
.mobile-nav{position:fixed!important;z-index:10!important;left:0!important;right:0!important;bottom:0!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:0!important;height:calc(64px + env(safe-area-inset-bottom))!important;box-sizing:border-box!important;padding:3px 1% env(safe-area-inset-bottom)!important;align-items:center!important;justify-content:initial!important;background:#080808f5!important;border:0!important;border-top:1px solid #292929!important;backdrop-filter:blur(15px)!important;isolation:isolate!important}
.mobile-nav:before{content:""!important;position:absolute!important;z-index:0!important;top:5px!important;left:1%!important;width:19.6%!important;height:39px!important;border:0!important;border-radius:50%!important;outline:0!important;background:radial-gradient(ellipse at center,rgba(255,112,0,.30) 0%,rgba(255,112,0,.14) 42%,rgba(255,112,0,0) 76%)!important;box-shadow:none!important;filter:blur(2px)!important;transform:translateX(calc(var(--active-index,0)*100%))!important;transition:transform .62s cubic-bezier(.22,1.38,.42,1)!important;pointer-events:none!important}
.mobile-nav a{position:relative!important;z-index:1!important;isolation:isolate!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:1px!important;min-width:0!important;height:50px!important;color:#858585!important;transition:color .22s ease!important}
.mobile-nav svg{width:20px!important;height:20px!important;fill:none!important;stroke:currentColor!important;stroke-width:2!important;stroke-linecap:round!important;stroke-linejoin:round!important;filter:none!important}
.mobile-nav small{font-size:7.5px!important;letter-spacing:.2px!important;color:inherit!important;text-shadow:none!important}
.mobile-nav a:hover,.mobile-nav a.current{color:#00b8ff!important}.mobile-nav a.current:before{content:none!important;display:none!important}.mobile-nav a.current svg{filter:drop-shadow(0 0 2px rgba(255,135,0,.35))!important}
}
@media(prefers-reduced-motion:reduce){.mobile-nav:before{transition:none!important}}
</style>

<style id="GG_BOTTOM_GLOW_BLUE">.mobile-nav:before{background:radial-gradient(ellipse at center,rgba(0,184,255,.34) 0%,rgba(0,184,255,.15) 42%,rgba(0,184,255,0) 76%)!important}</style>

<style id="gg-bottom-nav-edge-fix">
/* Separación pequeña y uniforme del borde inferior */
.mobile-nav{position:fixed!important;left:0!important;right:0!important;bottom:6px!important;inset-block-end:6px!important;margin:0!important;box-sizing:border-box!important;height:64px!important;padding:3px 1%!important;padding-bottom:3px!important;}
</style>
<style id="GG_SUPPORT_NAV_MATCH">@media(max-width:620px){.mobile-nav{background:rgba(5,11,24,.96)!important;border-top:1px solid rgba(40,228,255,.16)!important}.mobile-nav:before{background:radial-gradient(ellipse at center,rgba(0,184,255,.34) 0%,rgba(0,184,255,.15) 42%,rgba(0,184,255,0) 76%)!important;border:0!important;outline:0!important;box-shadow:none!important}.mobile-nav a:hover,.mobile-nav a.current{color:#28e4ff!important}.mobile-nav a.current svg{stroke:#28e4ff!important;filter:drop-shadow(0 0 4px rgba(40,228,255,.55))!important}.mobile-nav a.current small{color:#28e4ff!important;text-shadow:0 0 8px rgba(0,199,255,.35)!important}}</style><style id="GG_BOTTOM_NAV_OPAQUE_EDGE">
@media (max-width: 850px) {
  .mobile-nav {
    position: fixed !important;
    z-index: 1000 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    inset-inline: 0 !important;
    inset-block-end: 0 !important;
    margin: 0 !important;
    width: 100% !important;
    box-sizing: border-box !important;
    height: calc(64px + env(safe-area-inset-bottom, 0px)) !important;
    padding: 3px 1% env(safe-area-inset-bottom, 0px) !important;
    background: #050B18 !important;
    background-color: #050B18 !important;
    background-image: none !important;
    opacity: 1 !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
    border-bottom: 0 !important;
  }
}
</style>
<style id="GG_NAV_FIXED_VIEWPORT">
/* Navegación inferior fija al viewport: no acompaña el desplazamiento del documento */
@media (max-width:850px){
  .mobile-nav{
    position:fixed!important;inset:auto 0 0 0!important;top:auto!important;right:0!important;bottom:0!important;left:0!important;
    z-index:10000!important;width:100%!important;margin:0!important;box-sizing:border-box!important;
    transform:none!important;-webkit-transform:none!important;translate:none!important;
    animation:none!important;transition:none!important;will-change:auto!important;
    height:calc(64px + env(safe-area-inset-bottom, 0px))!important;
    padding:3px 1% env(safe-area-inset-bottom, 0px)!important;
    background:#050B18!important;background-color:#050B18!important;background-image:none!important;
    opacity:1!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;
  }
}
</style>
</head>
