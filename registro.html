<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="Crea tu cuenta en INTERNACIONAL WEB.">
<title>Crear cuenta — INTERNACIONAL WEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#090a0d;--panel:#0b0c0f;--orange:#ff7928;--gold:#ffad32;--white:#f5f5f5;--muted:#a5a6ad;--line:#ff792875;--font:'Inter',sans-serif;--display:'Barlow Condensed',sans-serif}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;min-height:100svh;padding:24px 16px 30px;display:flex;align-items:center;justify-content:center;overflow-x:hidden;background:var(--bg);color:var(--white);font-family:var(--font);position:relative;isolation:isolate}
body:before{content:"";position:fixed;z-index:-2;inset:-8%;background-image:url("fuentes/personaje_gamer_cuadrado.webp");background-size:cover;background-position:center 34%;transform:scale(1.22);filter:brightness(.32) saturate(.88);opacity:.62}
body:after{content:"";position:fixed;z-index:-1;inset:0;background:radial-gradient(ellipse at 50% 42%,#090a0d40 0%,#090a0dba 62%,#090a0df2 100%),linear-gradient(180deg,#090a0d9c,#090a0dce)}
a{color:inherit}
.page{width:min(100%,510px);margin:auto}
.topline{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 4px 17px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand-mark{width:39px;height:39px;display:grid;place-items:center;border:1px solid #ff7928a8;border-radius:12px;background:linear-gradient(145deg,#ff9a2d,#ed5a13);box-shadow:0 0 19px #ff79285c;color:#111;font:900 25px/1 var(--display);transform:skew(-7deg)}
.brand-name{font:900 19px/.92 var(--display);letter-spacing:.35px;white-space:nowrap}
.brand-name span{display:block;margin-top:4px;color:var(--orange);font-size:12px;letter-spacing:2px}
.top-link{font-size:11px;color:#c4c4c9;text-decoration:none;white-space:nowrap}
.top-link strong{color:var(--gold);font-weight:800}
.register-card{position:relative;overflow:hidden;padding:clamp(22px,5vw,34px);border:1px solid #ff7928b8;border-radius:27px;background:linear-gradient(155deg,#090a0df2 0%,#0a0b0eeF 55%,#100d0af2 100%);box-shadow:0 0 0 1px #ff792820,inset 0 0 34px #ff79280c,0 0 42px #ff79282b}
.register-card:before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse at 50% 0%,#ff792820,transparent 42%),radial-gradient(ellipse at 0% 100%,#ff79281b,transparent 30%)}
.card-content{position:relative;z-index:1}
.crown{width:48px;height:48px;margin:0 auto 8px;color:var(--gold);filter:drop-shadow(0 0 10px #ff9a2b80)}
h1{margin:0;text-align:center;font:800 clamp(38px,9vw,52px)/.98 var(--display);letter-spacing:.2px;text-shadow:0 2px 18px #000}
.subtitle{margin:9px 0 24px;text-align:center;color:var(--gold);font-size:14px;font-weight:800;letter-spacing:.35px}
.fields{display:grid;gap:13px}
.field{height:58px;display:flex;align-items:center;gap:13px;padding:0 16px;border:1px solid #ff7928a8;border-radius:17px;background:linear-gradient(100deg,#090a0df5,#101014ed);box-shadow:0 0 11px #ff792832,inset 0 0 14px #ff79280c;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:#ffad32;box-shadow:0 0 0 2px #ff9a2b22,0 0 18px #ff79285a}
.field>svg{width:21px;height:21px;flex:0 0 21px;fill:none;stroke:#f0f0f2;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.94}
.field input{width:100%;min-width:0;height:100%;border:0;outline:0;background:transparent;color:#fff;font:500 14px var(--font)}
.field input::placeholder{color:#b7b8bf;opacity:1}
.toggle-pass{width:29px;height:36px;flex:0 0 29px;display:grid;place-items:center;border:0;background:transparent;color:#c7c7cd;cursor:pointer;padding:0}
.toggle-pass svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.terms{display:flex;align-items:flex-start;gap:11px;margin:18px 2px 20px;color:#e3e3e5;font-size:12px;line-height:1.7}
.terms input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:0 0 20px;margin:1px 0 0;border:1px solid #ff8a2c;border-radius:5px;background:#111318;cursor:pointer;display:grid;place-items:center}
.terms input:checked{background:linear-gradient(145deg,#ffad32,#ff7021);border-color:#ffad32}
.terms input:checked:after{content:"✓";font-size:14px;font-weight:900;color:#111}
.terms a{color:var(--gold);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.submit{width:100%;min-height:58px;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid #ffc05c;border-radius:17px;background:linear-gradient(100deg,#ffb52e 0%,#ff8121 52%,#ff9d25 100%);box-shadow:0 0 10px #ff8b2c85,0 0 25px #ff79284c,inset 0 1px 0 #fff7;color:#17100a;font:900 18px var(--font);cursor:pointer;transition:transform .18s,filter .18s}
.submit:active{transform:scale(.985);filter:brightness(.95)}
.submit svg{width:23px;height:23px;fill:none;stroke:#17100a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.divider{display:flex;align-items:center;gap:13px;margin:22px 0 15px;color:#c5c5ca;font-size:11px;font-weight:700;white-space:nowrap}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#ff8a2c99)}
.divider:after{background:linear-gradient(90deg,#ff8a2c99,transparent)}
.socials{display:flex;justify-content:center;gap:10px}
.social{width:100%;max-width:180px;height:55px;display:grid;place-items:center;border:1px solid #ffffff26;border-radius:14px;background:linear-gradient(145deg,#111318,#08090c);box-shadow:inset 0 0 12px #ff79280a;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.social:hover{border-color:#ff7928a8;box-shadow:0 0 13px #ff79282b}
.social svg{width:27px;height:27px}
.social.google svg{width:25px;height:25px}
.social-note{min-height:15px;margin:10px 0 0;text-align:center;color:#ffbd71;font-size:10px;line-height:1.4}
.login{text-align:center;margin:14px 0 0;color:#dedee1;font-size:13px}
.login a{color:var(--gold);font-weight:800;text-decoration:none;margin-left:5px}
.login a:hover{text-decoration:underline;text-underline-offset:3px}
.notice{display:none;margin:14px 0 0;padding:11px 13px;border:1px solid #ff9a2b70;border-radius:12px;background:#ff8b2c12;color:#ffd29d;text-align:center;font-size:11px;line-height:1.5}
.notice.show{display:block}
@media(max-width:420px){body{padding:15px 12px 22px}.topline{margin-bottom:13px}.brand-mark{width:35px;height:35px}.brand-name{font-size:17px}.register-card{padding:23px 17px;border-radius:23px}.field{height:55px;border-radius:15px}.fields{gap:11px}.subtitle{margin-bottom:20px}.socials{gap:8px}.social{height:51px}}
@media(min-width:700px){body{padding-top:30px;padding-bottom:30px}.page{width:min(100%,490px)}}
@media(prefers-reduced-motion:no-preference){.register-card{animation:card-in .55s ease both}@keyframes card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<main class="page">
    <section class="register-card" aria-labelledby="title">
    <div class="card-content">
      <svg class="crown" viewBox="0 0 48 48" aria-hidden="true">
        <path d="m5 15 10 9 9-15 9 15 10-9-4 22H9L5 15Z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M10 32h28M15 41h18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="5" cy="13" r="2.5" fill="currentColor"/><circle cx="24" cy="7" r="2.5" fill="currentColor"/><circle cx="43" cy="13" r="2.5" fill="currentColor"/>
      </svg>
      <h1 id="title">CREAR CUENTA</h1>
      <p class="subtitle">Únete a nuestra comunidad gaming</p>

      <form id="registerForm">
        <div class="fields">
          <label class="field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.4-6 8-6s7.3 2 8 6"/></svg>
            <input name="username" type="text" autocomplete="username" placeholder="Nombre de usuario" aria-label="Nombre de usuario" required minlength="3">
          </label>
          <label class="field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
            <input name="email" type="email" autocomplete="email" placeholder="Correo electrónico" aria-label="Correo electrónico" required>
          </label>
          <label class="field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg>
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Contraseña" aria-label="Contraseña" required minlength="8">
            <button class="toggle-pass" type="button" data-toggle="password" aria-label="Mostrar contraseña">
              <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="m3 3 18 18"/></svg>
            </button>
          </label>
          <label class="field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirmar contraseña" aria-label="Confirmar contraseña" required minlength="8">
            <button class="toggle-pass" type="button" data-toggle="confirmPassword" aria-label="Mostrar confirmación de contraseña">
              <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="m3 3 18 18"/></svg>
            </button>
          </label>
        </div>

        <label class="terms">
          <input type="checkbox" name="terms" required>
          <span>Acepto los <a href="#terminos" data-info="Los Términos y Condiciones se habilitarán próximamente.">Términos y Condiciones</a> y la <a href="#privacidad" data-info="La Política de Privacidad se habilitará próximamente.">Política de Privacidad</a>.</span>
        </label>

        <button class="submit" type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2m4-11v8m-4-4h8"/></svg>
          REGISTRARSE
        </button>
        <div class="notice" id="notice" role="status" aria-live="polite"></div>
      </form>

      <div class="divider">O REGÍSTRATE CON</div>
      <div class="socials" aria-label="Otras opciones de registro">
        <button class="social google" type="button" aria-label="Google" data-provider="Google">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.7a12 12 0 0 1 0-7.4V15H5.8a20 20 0 0 0 0 18l6.8-5.3Z"/><path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.8 15l6.8 5.3c1.6-4.8 6.1-8.2 11.4-8.2Z"/></svg>
        </button>
      </div>
      <p class="social-note" id="socialNote"></p>
      <p class="login">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
  </section>
</main>
<script type="module">
import { supabase, SITE_URL } from "./supabase-client.js";

document.querySelectorAll("[data-toggle]").forEach(button => {
  button.addEventListener("click", () => {
    const field = document.getElementById(button.dataset.toggle);
    const visible = field.type === "password";
    field.type = visible ? "text" : "password";
    button.setAttribute("aria-label", visible ? "Ocultar contraseña" : "Mostrar contraseña");
    const slash = button.querySelector(".slash");
    if (slash) slash.style.display = visible ? "none" : "block";
  });
});

const form = document.getElementById("registerForm");
const notice = document.getElementById("notice");
const submit = form.querySelector(".submit");
const socialNote = document.getElementById("socialNote");
const showNotice = (message, isError = false) => {
  notice.textContent = message;
  notice.classList.add("show");
  notice.style.borderColor = isError ? "#ff5d5d99" : "#ff9a2b70";
  notice.style.color = isError ? "#ffb5b5" : "#ffd29d";
};
const translateError = error => {
  const message = (error?.message || "").toLowerCase();
  if (message.includes("already registered") || message.includes("already been registered")) return "Este correo ya tiene una cuenta. Inicia sesión.";
  if (message.includes("password") && message.includes("least")) return "La contraseña debe tener al menos 8 caracteres.";
  if (message.includes("rate limit")) return "Has realizado demasiados intentos. Espera un momento y vuelve a intentarlo.";
  if (message.includes("profiles_username_lower_unique") || message.includes("duplicate key")) return "Ese nombre de usuario ya está ocupado. Prueba con otro.";
  if (message.includes("database error saving new user")) return "No se pudo crear la cuenta. Puede que el nombre de usuario ya esté ocupado; prueba con otro.";
  return "No se pudo crear la cuenta. Revisa los datos e inténtalo nuevamente.";
};

form.addEventListener("submit", async event => {
  event.preventDefault();
  const usernameField = form.elements.username;
  const emailField = form.elements.email;
  const password = document.getElementById("password");
  const confirm = document.getElementById("confirmPassword");
  const username = usernameField.value.trim();
  const email = emailField.value.trim().toLowerCase();

  if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {
    usernameField.setCustomValidity("Usa entre 3 y 24 caracteres: letras, números o guion bajo.");
    usernameField.reportValidity();
    usernameField.addEventListener("input", () => usernameField.setCustomValidity(""), { once: true });
    return;
  }
  if (password.value !== confirm.value) {
    confirm.setCustomValidity("Las contraseñas no coinciden.");
    confirm.reportValidity();
    confirm.addEventListener("input", () => confirm.setCustomValidity(""), { once: true });
    return;
  }

  submit.disabled = true;
  submit.style.opacity = ".7";
  submit.textContent = "CREANDO CUENTA...";
  notice.classList.remove("show");

  const { data, error } = await supabase.auth.signUp({
    email,
    password: password.value,
    options: {
      data: { username },
      emailRedirectTo: SITE_URL + "login.html"
    }
  });

  submit.disabled = false;
  submit.style.opacity = "";
  submit.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2m4-11v8m-4-4h8"/></svg> REGISTRARSE';

  if (error) {
    showNotice(translateError(error), true);
    return;
  }
  if (data.session) {
    showNotice("¡Tu cuenta está creada! Entrando a Internacional Web...");
    window.location.assign(SITE_URL + "index.html");
    return;
  }
  showNotice("¡Registro recibido! Te enviamos un correo para confirmar tu cuenta. Abre el enlace desde tu correo para activar el acceso.");
});

document.querySelectorAll("[data-provider]").forEach(button => {
  button.addEventListener("click", async () => {
    socialNote.textContent = "Conectando con Google...";
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: SITE_URL + "index.html" }
    });
    if (error) socialNote.textContent = "Google aún no está habilitado en el panel de Supabase. Configura el proveedor Google para activarlo.";
  });
});

document.querySelectorAll("[data-info]").forEach(link => {
  link.addEventListener("click", event => {
    event.preventDefault();
    socialNote.textContent = link.dataset.info;
  });
});
</script>
</body>
</html>
